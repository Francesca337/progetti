<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Retail — Pasticceria Giotto · Natale 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  /* ---------- BRAND TYPEFACES ---------- */
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-Light.woff2") format("woff2");
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-LightItalic.woff2") format("woff2");
    font-weight: 300; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-Italic.woff2") format("woff2");
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-MediumItalic.woff2") format("woff2");
    font-weight: 500; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Gazpacho";
    src: url("fonts/Gazpacho-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }

  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-Light.woff2") format("woff2");
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-LightItalic.woff2") format("woff2");
    font-weight: 300; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-Italic.woff2") format("woff2");
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-MediumItalic.woff2") format("woff2");
    font-weight: 500; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Neue Montreal";
    src: url("fonts/NeueMontreal-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    /* Brand palette */
    --bg:          #F2E8D7;   /* cream peach */
    --bg-alt:      #EDE1C9;   /* deeper cream */
    --card:        #FBF6EA;   /* card surface */
    --card-soft:   #F6EFDC;   /* nested surface */

    --ink:         #0A0A0A;   /* deep black */
    --ink-soft:    #2A2620;   /* warm dark */
    --ink-muted:   #8C8276;   /* warm muted */
    --ink-fade:    #B3A893;   /* faded text */

    --gold:        #A89060;   /* signature gold */
    --gold-deep:   #8E7848;   /* deeper gold for text contrast */
    --gold-soft:   #D6C39A;   /* light gold */
    --gold-pale:   #EFE3C7;   /* pale gold bg */

    --hairline:    rgba(168,144,96,0.32);
    --hairline-soft: rgba(168,144,96,0.18);
    --rule:        rgba(10,10,10,0.08);

    /* System badge palette — desaturated, brand-aligned */
    --sys-zoho-bg:   #E3E8EF; --sys-zoho-fg:   #2A3D5C;
    --sys-wa-bg:     #E2E8D4; --sys-wa-fg:     #4A5A2A;
    --sys-mail-bg:   #F1E2C8; --sys-mail-fg:   #7A4A1A;
    --sys-man-bg:    #F0DCCB; --sys-man-fg:    #7A3920;
    --sys-ads-bg:    #E4DFEC; --sys-ads-fg:    #4F4677;
    --sys-log-bg:    #E6DFD0; --sys-log-fg:    #4F4738;

    --branch-yes:   #4F6B2C;
    --branch-yes-bg:#E8EBD6;
    --branch-maybe: #A87A1E;
    --branch-maybe-bg:#F2E6C4;
    --branch-no:    #9C4628;
    --branch-no-bg: #F1DCCE;

    --top-h: 72px;
    --bot-h: 44px;
    --col-w: 280px;
    --gap: 64px;

    --serif: "Gazpacho", "Cormorant Garamond", Georgia, serif;
    --sans: "Neue Montreal", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.45;
    font-weight: 400;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--top-h);
    background: var(--ink);
    color: #F5EBD7;
    display: flex; align-items: center;
    padding: 0 28px;
    z-index: 50;
    border-bottom: 1px solid rgba(168,144,96,0.18);
  }
  .brand {
    display: flex; align-items: center;
    gap: 18px;
    margin-right: 28px;
    flex-shrink: 0;
  }
  .wordmark {
    display: flex; flex-direction: column;
    align-items: center;
    line-height: 1;
    padding-right: 18px;
    border-right: 1px solid rgba(168,144,96,0.22);
  }
  .wordmark .top, .wordmark .bot {
    font-family: var(--serif);
    font-size: 8.5px;
    letter-spacing: 4.5px;
    color: var(--gold-soft);
    font-weight: 500;
    text-transform: uppercase;
  }
  .wordmark .top { margin-bottom: 4px; }
  .wordmark .bot { margin-top: 4px; font-size: 7.5px; letter-spacing: 3.5px; }
  .wordmark .giotto {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    color: #FAF1DB;
    letter-spacing: 0;
    display: flex; align-items: center;
    gap: 5px;
  }
  .wordmark .giotto .bar {
    width: 1px;
    height: 14px;
    background: rgba(255,255,255,0.35);
  }
  .subtitle {
    display: flex; flex-direction: column;
    line-height: 1.3;
  }
  .subtitle .kicker {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--gold-soft);
    margin-bottom: 1px;
  }
  .subtitle .title {
    font-size: 12px;
    color: #E8DDC6;
    letter-spacing: 0.4px;
    font-weight: 400;
  }
  .nav {
    display: flex; gap: 4px; overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
    padding: 0 4px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(168,144,96,0.22);
    color: #B7AB91;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    font-family: var(--sans);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill:hover {
    color: #F5EBD7;
    border-color: var(--gold);
  }
  .pill.active {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .pill .num {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 500;
    font-style: italic;
    font-variant-numeric: tabular-nums;
    color: var(--gold-soft);
    line-height: 1;
  }
  .pill.active .num { color: var(--ink); }

  /* ---------- SCROLL AREA ---------- */
  .scroll-area {
    position: fixed;
    top: var(--top-h);
    bottom: var(--bot-h);
    left: 0; right: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: 36px 48px 40px 48px;
  }
  .track {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
    min-width: max-content;
    position: relative;
    padding-bottom: 24px;
  }

  /* ---------- COLUMN ---------- */
  .col {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    background: var(--card);
    border: 1px solid var(--hairline-soft);
    border-radius: 2px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    z-index: 2;
    box-shadow: 0 1px 0 rgba(168,144,96,0.05);
  }
  .col.current {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .col-header {
    background: var(--ink);
    color: #F5EBD7;
    padding: 22px 22px 20px;
    position: relative;
  }
  .col-header::after {
    content: "";
    position: absolute;
    left: 22px; right: 22px;
    bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold) 30%, transparent 100%);
  }
  .col.current .col-header {
    background: #14110A;
  }
  .col-numline {
    display: flex; align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .col-num {
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 500;
    line-height: 1;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .col-fase {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--gold-soft);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    line-height: 1;
  }
  .here-dot {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--gold);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-left: auto;
    font-family: var(--sans);
  }
  .here-dot .d {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(168,144,96,0.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(168,144,96,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(168,144,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(168,144,96,0); }
  }
  .col-name {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.2px;
    color: #FAF1DB;
    margin: 0;
    line-height: 1.15;
  }
  .col-period {
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--gold-soft);
    margin-top: 8px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    font-weight: 400;
  }
  .col-tags {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 12px;
  }
  .tag {
    font-family: var(--serif);
    font-style: italic;
    font-size: 10.5px;
    color: var(--gold-soft);
    border: 1px solid rgba(168,144,96,0.35);
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: 0.2px;
    background: transparent;
  }

  .col-body {
    padding: 18px 18px 22px;
    display: flex; flex-direction: column;
    gap: 12px;
    flex: 1;
  }
  .note {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-soft);
    padding: 6px 0 6px 12px;
    border-left: 1px solid var(--gold);
    margin: 2px 0 4px;
  }
  .annotation {
    font-family: var(--sans);
    font-size: 11px;
    line-height: 1.5;
    color: var(--gold-deep);
    background: var(--gold-pale);
    border: 1px solid var(--hairline);
    padding: 9px 11px 9px 32px;
    border-radius: 2px;
    position: relative;
    letter-spacing: 0.2px;
  }
  .annotation i.ti {
    position: absolute;
    left: 10px; top: 9px;
    font-size: 14px;
    color: var(--gold);
  }

  /* ---------- TOUCHPOINT ---------- */
  .tp {
    background: transparent;
    border-top: 1px solid var(--rule);
    padding: 10px 0 4px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .tp:first-of-type { border-top: none; padding-top: 4px; }
  .tp-row {
    display: flex; align-items: flex-start; gap: 10px;
  }
  .tp-icon {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 1px;
    border: 1px solid currentColor;
    background: transparent;
  }
  .tp-icon i.ti { opacity: 0.9; }
  .tp-text {
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-soft);
    flex: 1;
    font-weight: 400;
  }
  .tp-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center;
    padding-left: 34px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 500;
    padding: 3px 8px 3px 7px;
    border-radius: 999px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge i.ti { font-size: 11px; }
  .timing {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--ink-muted);
    padding: 2px 0;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.1px;
  }
  .timing i.ti { font-size: 10.5px; color: var(--gold); }
  .tp-extra {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11.5px;
    color: var(--ink-muted);
    padding-left: 34px;
    line-height: 1.45;
  }

  /* ---------- SYSTEM COLORS ---------- */
  .sys-zoho      { color: var(--sys-zoho-fg);  background: var(--sys-zoho-bg); border-color: rgba(42,61,92,0.18); }
  .sys-whatsapp  { color: var(--sys-wa-fg);    background: var(--sys-wa-bg);   border-color: rgba(74,90,42,0.18); }
  .sys-email     { color: var(--sys-mail-fg);  background: var(--sys-mail-bg); border-color: rgba(122,74,26,0.18); }
  .sys-manuale   { color: var(--sys-man-fg);   background: var(--sys-man-bg);  border-color: rgba(122,57,32,0.18); }
  .sys-ads       { color: var(--sys-ads-fg);   background: var(--sys-ads-bg);  border-color: rgba(79,70,119,0.18); }
  .sys-logistica { color: var(--sys-log-fg);   background: var(--sys-log-bg);  border-color: rgba(79,71,56,0.18); }

  /* icon-only variant (just stroked circle) */
  .tp-icon.sys-zoho      { color: var(--sys-zoho-fg);  background: transparent; }
  .tp-icon.sys-whatsapp  { color: var(--sys-wa-fg);    background: transparent; }
  .tp-icon.sys-email     { color: var(--sys-mail-fg);  background: transparent; }
  .tp-icon.sys-manuale   { color: var(--sys-man-fg);   background: transparent; }
  .tp-icon.sys-ads       { color: var(--sys-ads-fg);   background: transparent; }
  .tp-icon.sys-logistica { color: var(--sys-log-fg);   background: transparent; }

  /* ---------- BRANCHES ---------- */
  .branch-block {
    margin-top: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 10px;
  }
  .branch-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 2px;
    letter-spacing: 0.2px;
  }
  .branch {
    border-left: 2px solid var(--bc);
    background: var(--bbg);
    border-radius: 0 2px 2px 0;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .branch-head {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 500;
    font-style: italic;
    color: var(--bc);
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.3px;
  }
  .branch-head .dot {
    width: 6px; height: 6px;
    background: var(--bc);
    border-radius: 50%;
  }
  .branch.yes   { --bc: var(--branch-yes);   --bbg: var(--branch-yes-bg); }
  .branch.maybe { --bc: var(--branch-maybe); --bbg: var(--branch-maybe-bg); }
  .branch.no    { --bc: var(--branch-no);    --bbg: var(--branch-no-bg); }
  .b-step {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 4px 0;
  }
  .b-step .tp-icon { width: 22px; height: 22px; font-size: 11.5px; }
  .b-step-text {
    font-family: var(--sans);
    font-size: 11.5px;
    line-height: 1.4;
    flex: 1;
    color: var(--ink-soft);
  }
  .b-step-text .badge {
    margin-top: 5px;
  }

  /* ---------- CONNECTOR ARROWS ---------- */
  .connector {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  /* ---------- BOTTOM BAR ---------- */
  .botbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bot-h);
    background: var(--ink);
    color: var(--gold-soft);
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 14px;
    z-index: 50;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid rgba(168,144,96,0.18);
  }
  .botbar::-webkit-scrollbar { display: none; }
  .legend-label {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12.5px;
    color: var(--gold);
    flex-shrink: 0;
    padding-right: 6px;
    border-right: 1px solid rgba(168,144,96,0.22);
    margin-right: 4px;
  }
  .botbar .badge {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(168,144,96,0.22);
    color: #D6C39A;
    padding: 4px 10px;
  }
  .botbar .badge i.ti { color: var(--gold); }

  /* ---------- SCROLLBAR ---------- */
  .scroll-area::-webkit-scrollbar { height: 10px; width: 10px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb {
    background: rgba(168,144,96,0.35);
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: var(--gold); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="wordmark">
      <span class="top">Pasticceria</span>
      <span class="giotto">G<span class="bar"></span>I<span class="bar"></span>O<span class="bar"></span>T<span class="bar"></span>T<span class="bar"></span>O</span>
      <span class="bot">Oltre la dolcezza</span>
    </div>
    <div class="subtitle">
      <span class="kicker">Journey Retail</span>
      <span class="title">Campagna Natale 2026 — operativo rivenditori</span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main class="scroll-area" id="scrollArea">
  <div class="track" id="track">
    <svg class="connector" id="connector" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10" fill="none" stroke="#A89060" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </marker>
      </defs>
    </svg>
  </div>
</main>

<footer class="botbar">
  <span class="legend-label">Sistemi</span>
  <span class="badge"><i class="ti ti-database"></i>Zoho CRM</span>
  <span class="badge"><i class="ti ti-brand-whatsapp"></i>WhatsApp Business</span>
  <span class="badge"><i class="ti ti-mail"></i>Email automatica</span>
  <span class="badge"><i class="ti ti-user"></i>Manuale Laura</span>
  <span class="badge"><i class="ti ti-speakerphone"></i>Meta / Google Ads</span>
  <span class="badge"><i class="ti ti-truck"></i>Logistica</span>
</footer>

<script>
  // -------------- SYSTEM CATALOG ----------------
  const SYS = {
    manuale:   { label: "Manuale",     cls: "sys-manuale",   icon: "ti-user" },
    ads:       { label: "Ads",         cls: "sys-ads",       icon: "ti-speakerphone" },
    email:     { label: "Email",       cls: "sys-email",     icon: "ti-mail" },
    zoho:      { label: "Zoho CRM",    cls: "sys-zoho",      icon: "ti-database" },
    whatsapp:  { label: "WhatsApp",    cls: "sys-whatsapp",  icon: "ti-brand-whatsapp" },
    logistica: { label: "Logistica",   cls: "sys-logistica", icon: "ti-truck" },
  };

  // -------------- DATA ----------------
  const phases = [

      n: 1, name: "Generazione lead", period: "Maggio – Giugno 2026",

      note: "Due stream paralleli: outbound (lista manuale) e inbound (ads → landing → Zoho). Avvio immediato.",

        { text: "Campagna awareness geo-targeted — prepara il terreno prima delle chiamate", system: "ads", icon: "ti-speakerphone", timing: "Mag 2026" },
        { text: "Campagna lead gen Nord Italia → landing → ingresso automatico in Zoho", system: "ads", icon: "ti-target", timing: "Mag 2026",

    {

      note: "Laura lavora la lista outbound mentre i lead inbound entrano da soli in Zoho.",

        { text: "Mail automatica con allegato retail (benefit rivenditori Giotto)", system: "email", icon: "ti-mail", timing: "Entro 24h — trigger: email in Zoho" },

    },
    {

      touchpoints: [

        { text: "Laura propone incontro per far assaggiare la campionatura", system: "manuale", icon: "ti-phone", timing: "Giu 2026" },
      ],
      branches: [
        { kind: "yes",   label: "Sì",    steps: [
          { text: "Appuntamento fissato a calendario in Zoho", system: "zoho", icon: "ti-calendar" },
        ]},
        { kind: "maybe", label: "Forse", steps: [

    },
    {

      touchpoints: [
        { text: "Laura porta la campionatura prodotti Natale 2026", system: "manuale", icon: "ti-gift", timing: "Giu–Lug 2026" },
        { text: "Mostra materiali di comunicazione da tablet", system: "manuale", icon: "ti-device-tablet" },

    },
    {

      note: "1–2 settimane in base al momento dell'anno. Touchpoint attivo a metà periodo.",
      touchpoints: [
        { text: "Reminder Zoho con data di richiamo personalizzata", system: "zoho", icon: "ti-bell" },
        { text: "WhatsApp a metà periodo: \"Com'è andata con la campionatura?\"", system: "whatsapp", icon: "ti-brand-whatsapp", timing: "A metà del periodo" },

    },
    {
      n: 6, name: "Risposta", period: "Luglio – Agosto 2026",
      note: "Momento decisivo. I No definitivi restano nel perimetro Giotto via newsletter.",
      branches: [
        { kind: "yes",   label: "Sì",    steps: [
          { text: "Laura prende l'ordine", system: "manuale", icon: "ti-clipboard-check" },
        ]},
        { kind: "maybe", label: "Forse", steps: [
          { text: "Reminder ping automatico in Zoho", system: "zoho", icon: "ti-bell" },
        ]},
        { kind: "no",    label: "No",    steps: [
          { text: "Reminder a mesi in Zoho", system: "zoho", icon: "ti-calendar-off" },
          { text: "Inserito in lista newsletter awareness", system: "email", icon: "ti-mail" },
        ]},
      ],
    },
    {
      n: 7, name: "Onboarding", period: "Agosto – Settembre 2026",
      tags: ["storici entrano qui"],
      note: "I rivenditori storici che riacquistano saltano le fasi 1–6 ed entrano direttamente qui.",
      annotation: { icon: "ti-arrow-down-right", text: "Rivenditori storici: entrano direttamente da qui" },
      touchpoints: [
        { text: "Mail automatica: store locator + scontistica dedicata per i primi 6 mesi", system: "email", icon: "ti-mail", timing: "Entro 24h dalla conferma" },
        { text: "Spedizione ordine + kit comunicazione campagna Natale nella scatola", system: "logistica", icon: "ti-truck", timing: "Set 2026" },
      ],
    },
    {
      n: 8, name: "Campagna attiva", period: "Ottobre – Dicembre 2026",
      note: "Touchpoint ricorrenti per tutti i rivenditori attivi — nuovi e storici.",
      touchpoints: [
        { text: "Scheda prodotto mensile (approfondimento campagna Natale)", system: "email", icon: "ti-mail", timing: "1× al mese" },
        { text: "WhatsApp: contenuti social selezionati da Laura", system: "whatsapp", icon: "ti-brand-whatsapp", timing: "Ogni venerdì" },
        { text: "Newsletter editoriale \"Storie dal carcere\"", system: "email", icon: "ti-newspaper", timing: "Ogni 2 del mese" },
        { text: "Mail numeri salienti della campagna", system: "email", icon: "ti-chart-bar", timing: "Nov 2026 — 3 sett. prima chiusura" },
      ],
    },
    {
      n: 9, name: "Fine campagna", period: "Gennaio 2027",
      touchpoints: [
        { text: "Mail automatica di feedback sulla campagna", system: "email", icon: "ti-mail", timing: "Gen 2027" },
        { text: "Laura propone la campagna successiva (Colomba / Pasqua 2027)", system: "manuale", icon: "ti-arrow-right", timing: "Gen 2027",
          extra: "Momento di massimo calore — non lasciarlo raffreddare" },
      ],
    },
  ];

  // -------------- RENDER HELPERS ----------------
  const pad = (n) => String(n).padStart(2, "0");

  function badgeForSystem(systemKey) {
    const s = SYS[systemKey];
    if (!s) return "";
    return `<span class="badge ${s.cls}"><i class="ti ${s.icon}"></i>${s.label}</span>`;
  }

  function timingPill(timing) {
    if (!timing) return "";
    return `<span class="timing"><i class="ti ti-clock"></i>${timing}</span>`;
  }

  function renderTouchpoint(tp) {
    const sys = SYS[tp.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="tp">
        <div class="tp-row">
          <span class="tp-icon ${iconCls}"><i class="ti ${tp.icon}"></i></span>
          <div class="tp-text">${tp.text}</div>
        </div>
        <div class="tp-meta">
          ${badgeForSystem(tp.system)}
          ${timingPill(tp.timing)}
        </div>
        ${tp.extra ? `<div class="tp-extra">${tp.extra}</div>` : ""}
      </div>`;
  }

  function renderBranchStep(step) {
    const sys = SYS[step.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="b-step">
        <span class="tp-icon ${iconCls}"><i class="ti ${step.icon}"></i></span>
        <div class="b-step-text">
          ${step.text}
          <div>${badgeForSystem(step.system)}</div>
        </div>
      </div>`;
  }

  function renderBranches(branches) {
    if (!branches || !branches.length) return "";
    return `
      <div class="branch-block">
        <div class="branch-title">Risposta del contatto</div>
        ${branches.map(b => `
          <div class="branch ${b.kind}">
            <div class="branch-head"><span class="dot"></span>${b.label}</div>
            ${b.steps.map(renderBranchStep).join("")}
          </div>
        `).join("")}
      </div>`;
  }

  function renderColumn(p) {
    const isCurrent = !!p.current;
    return `
      <section class="col ${isCurrent ? "current" : ""}" id="phase-${p.n}" data-phase="${p.n}">
        <div class="col-header">
          <div class="col-numline">
            <span class="col-num">${pad(p.n)}</span>
            <span class="col-fase">Fase</span>
            ${isCurrent ? `<span class="here-dot"><span class="d"></span>Siamo qui</span>` : ""}
          </div>
          <h2 class="col-name">${p.name}</h2>
          <div class="col-period">${p.period}</div>
          ${p.tags ? `<div class="col-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        </div>
        <div class="col-body">
          ${p.note ? `<div class="note">${p.note}</div>` : ""}
          ${p.annotation ? `<div class="annotation"><i class="ti ${p.annotation.icon}"></i>${p.annotation.text}</div>` : ""}
          ${(p.touchpoints || []).map(renderTouchpoint).join("")}
          ${renderBranches(p.branches)}
        </div>
      </section>`;
  }

  // -------------- RENDER ----------------
  const track = document.getElementById("track");
  const nav = document.getElementById("nav");

  track.insertAdjacentHTML("beforeend", phases.map(renderColumn).join(""));

  nav.innerHTML = phases.map(p => `
    <button class="pill" data-target="phase-${p.n}">
      <span class="num">${pad(p.n)}</span>${p.name}
    </button>
  `).join("");

  // -------------- NAV INTERACTION ----------------
  const scrollArea = document.getElementById("scrollArea");
  const pills = [...nav.querySelectorAll(".pill")];

  pills.forEach(pill => {
    pill.addEventListener("click", () => {
      const target = document.getElementById(pill.dataset.target);
      if (!target) return;
      const left = target.offsetLeft - 48;
      scrollArea.scrollTo({ left, behavior: "smooth" });
    });
  });

  const colEls = [...document.querySelectorAll(".col")];
  const ratios = new Map();
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      ratios.set(entry.target.id, entry.intersectionRatio);
    });
    let bestId = null, bestR = 0;
    ratios.forEach((r, id) => {
      if (r > bestR) { bestR = r; bestId = id; }
    });
    pills.forEach(p => p.classList.toggle("active",
      bestId && p.dataset.target === bestId && bestR > 0.05));
  }, {
    root: scrollArea,
    threshold: [0, 0.25, 0.5, 0.75, 1],
  });
  colEls.forEach(el => observer.observe(el));

  // -------------- SVG CONNECTORS ----------------
  function drawConnectors() {
    const svg = document.getElementById("connector");
    svg.setAttribute("width", track.scrollWidth);
    svg.setAttribute("height", track.scrollHeight);

    [...svg.querySelectorAll("path.link")].forEach(n => n.remove());

    for (let i = 0; i < colEls.length - 1; i++) {
      const a = colEls[i];
      const b = colEls[i + 1];
      const ax = a.offsetLeft + a.offsetWidth;
      const bx = b.offsetLeft;
      const y = a.offsetTop + 48;
      const midX = (ax + bx) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${ax + 4} ${y} C ${midX} ${y}, ${midX} ${y}, ${bx - 10} ${y}`;
      path.setAttribute("d", d);
      path.setAttribute("class", "link");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#A89060");
      path.setAttribute("stroke-width", "1");
      path.setAttribute("stroke-dasharray", "3 5");
      path.setAttribute("opacity", "0.7");
      path.setAttribute("marker-end", "url(#arrowhead)");
      svg.appendChild(path);
    }
  }

  window.addEventListener("load", drawConnectors);
  window.addEventListener("resize", drawConnectors);
  setTimeout(drawConnectors, 200);
  setTimeout(drawConnectors, 800);
  setTimeout(drawConnectors, 2000); // re-run after webfonts load

  // Re-run on font load if available
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawConnectors);
  }

  setTimeout(() => {
    if (!pills.some(p => p.classList.contains("active"))) {
      pills[0].classList.add("active");
    }
  }, 300);
</script>
