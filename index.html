<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Retail — Pasticceria Giotto · Natale 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  /* ---------- BRAND TYPEFACES ---------- */
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Light.woff2") format("woff2");        font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-LightItalic.woff2") format("woff2");  font-weight:300; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Regular.woff2") format("woff2");      font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Italic.woff2") format("woff2");       font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Medium.woff2") format("woff2");       font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-MediumItalic.woff2") format("woff2"); font-weight:500; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Bold.woff2") format("woff2");         font-weight:700; font-style:normal; font-display:swap; }

  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Light.woff2") format("woff2");        font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-LightItalic.woff2") format("woff2");  font-weight:300; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Regular.woff2") format("woff2");      font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Italic.woff2") format("woff2");       font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Medium.woff2") format("woff2");       font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-MediumItalic.woff2") format("woff2"); font-weight:500; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Bold.woff2") format("woff2");         font-weight:700; font-style:normal; font-display:swap; }

  :root {
    --bg:          #F2E8D7;
    --card:        #FFFFFF;

    --ink:         #0A0A0A;
    --ink-soft:    #232019;
    --ink-muted:   #847C70;
    --ink-fade:    #B3A893;

    --gold:        #A89060;
    --gold-deep:   #8E7848;
    --gold-soft:   #D6C39A;

    --hairline:      rgba(168,144,96,0.32);
    --hairline-soft: rgba(168,144,96,0.18);
    --rule:          rgba(10,10,10,0.08);

    --actor-manual:  #7A3920;
    --actor-auto:    #8E7848;
    --actor-sched:   #4F6B2C;

    --sys-zoho:   #2A3D5C;  --sys-zoho-soft: #E5ECF4;
    --sys-wa:     #4A5A2A;  --sys-wa-soft:   #ECF1D8;
    --sys-mail:   #B36A1F;  --sys-mail-soft: #FBE6CC;
    --sys-man:    #B5421E;  --sys-man-soft:  #FBDDC9;
    --sys-ads:    #6757A0;  --sys-ads-soft:  #ECE6F4;
    --sys-log:    #6F6452;  --sys-log-soft:  #EFE9DC;

    --branch-yes:    #4F6B2C;
    --branch-maybe:  #A87A1E;
    --branch-no:     #9C4628;

    --top-h: 76px;
    --bot-h: 48px;
    --col-w: 332px;
    --gap: 152px;

    --serif: "Gazpacho", Georgia, serif;
    --sans:  "Neue Montreal", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.5;
    font-weight: 400;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     TOP BAR
     ============================================================ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--top-h);
    background: var(--bg);
    color: var(--ink-soft);
    display: flex; align-items: center;
    padding: 0 32px;
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-right: 32px; flex-shrink: 0; }
  .wordmark {
    display: flex; flex-direction: column; align-items: center;
    line-height: 1;
    padding-right: 22px;
    border-right: 1px solid var(--hairline);
  }
  .wordmark .top, .wordmark .bot {
    font-family: var(--serif);
    font-size: 9px; letter-spacing: 5px;
    color: var(--gold-deep);
    font-weight: 400; text-transform: uppercase;
  }
  .wordmark .top { margin-bottom: 5px; }
  .wordmark .bot { margin-top: 5px; font-size: 7.5px; letter-spacing: 3.5px; }
  .wordmark .giotto {
    font-family: var(--serif);
    font-size: 21px; font-weight: 400;
    color: var(--ink);
    display: flex; align-items: center; gap: 6px;
  }
  .wordmark .giotto .bar { width: 1px; height: 15px; background: rgba(10,10,10,0.28); }
  .subtitle { display: flex; flex-direction: column; line-height: 1.3; }
  .subtitle .kicker {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--gold-deep);
    margin-bottom: 2px;
    font-weight: 400;
  }
  .subtitle .title {
    font-size: 12.5px;
    color: var(--ink-muted);
    letter-spacing: 0.3px;
    font-weight: 400;
  }
  .nav {
    display: flex; gap: 6px; overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
    padding: 0 4px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--ink-muted);
    padding: 6px 12px;
    border-radius: 0;
    font-size: 13px;
    font-weight: 400;
    cursor: default;
    transition: color 0.18s;
    white-space: nowrap;
    font-family: var(--sans);
    display: inline-flex; align-items: baseline; gap: 8px;
    border-bottom: 1px solid transparent;
  }
  .pill.active { color: var(--gold-deep); border-bottom-color: var(--gold-deep); }
  .pill .num {
    font-family: var(--serif);
    font-size: 15px; font-weight: 400; font-style: italic;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    opacity: 0.55;
    line-height: 1;
  }
  .pill.active .num { color: var(--gold-deep); opacity: 1; }

  /* ============================================================
     SCROLL AREA + TRACK
     ============================================================ */
  .scroll-area {
    position: fixed;
    top: var(--top-h);
    bottom: var(--bot-h);
    left: 0; right: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: 48px 56px 56px 56px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .track {
    display: flex; align-items: flex-start;
    gap: var(--gap);
    min-width: max-content;
    position: relative;
    padding-bottom: 32px;
  }

  /* ============================================================
     COLUMN
     ============================================================ */
  .col {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    background: var(--card);
    border-radius: 28px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    z-index: 2;
    box-shadow: 0 1px 0 rgba(168,144,96,0.05),
                0 18px 44px -28px rgba(10,10,10,0.10);
  }
  .col.current {
    box-shadow: 0 0 0 1.5px var(--gold) inset,
                0 1px 0 rgba(168,144,96,0.05),
                0 18px 44px -22px rgba(168,144,96,0.22);
  }

  /* Column header (light, editorial) */
  .col-header {
    padding: 32px 28px 24px;
    position: relative;
    background: var(--card);
  }
  .col-header::after {
    content: ""; position: absolute;
    left: 28px; right: 28px; bottom: 0;
    height: 1px; background: var(--hairline-soft);
  }
  .here-dot {
    position: absolute; top: 30px; right: 32px;
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--gold-deep);
    font-size: 10px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    font-family: var(--sans);
  }
  .here-dot .d {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(168,144,96,0.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(168,144,96,0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(168,144,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(168,144,96,0); }
  }

  .col-num {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 76px;
    line-height: 0.9;
    color: var(--gold);
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    display: block;
    margin-bottom: 18px;
  }
  .col-name {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.4px;
    color: var(--ink);
    margin: 0 0 14px;
    line-height: 1.1;
  }
  .col-period {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .col-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag {
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--gold-deep);
    border: 1px solid var(--hairline);
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .col-body {
    padding: 28px 32px 36px;
    display: flex; flex-direction: column;
    gap: 22px;
    flex: 1;
  }

  /* Editorial note */
  .note {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink-soft);
    padding: 0;
    border: none;
    margin: 0;
  }

  /* Entry annotation (storici) */
  .annotation {
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.5;
    color: var(--gold-deep);
    background: var(--bg);
    border: none;
    padding: 14px 16px 14px 44px;
    position: relative;
    letter-spacing: 0.1px;
    border-radius: 14px;
  }
  .annotation::before {
    content: "ENTRY POINT";
    display: block;
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--gold);
    letter-spacing: 2px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .annotation i.ti {
    position: absolute;
    left: 16px; top: 14px;
    font-size: 18px;
    color: var(--gold);
  }

  /* ============================================================
     STREAM BLOCK
     ============================================================ */
  .stream {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .stream + .stream { margin-top: 10px; }
  .stream-header {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 12px;
    background: var(--bg);
    border-radius: 999px;
    align-self: flex-start;
  }
  .stream-header::before {
    content: "↘";
    color: var(--gold-deep);
    font-size: 14px;
    line-height: 1;
    font-weight: 400;
  }
  .stream.loop .stream-header::before {
    content: "↻";
  }
  .stream-name {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 1.8px;
    text-transform: uppercase;
    line-height: 1;
  }
  .stream-caption { display: none; }

  /* ============================================================
     RAIL (cards stack — no line, no dots)
     ============================================================ */
  .rail {
    display: flex; flex-direction: column;
    gap: 10px;
  }

  /* Sequence link between two cards */
  .rail-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
  }
  .rail-link::before {
    content: "";
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
  }
  .rail-link .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--gold-deep);
    padding: 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.3;
  }
  .rail-link .chip i.ti {
    font-size: 13px;
    color: var(--gold);
  }

  /* ============================================================
     NODE (touchpoint card)
     ============================================================ */
  .node {
    display: flex; flex-direction: column;
    gap: 10px;
    padding: 16px 20px 16px 16px;
    border-radius: 18px;
    background: var(--node-bg, #F6F1E5);
  }
  .node-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-right: 20px;
  }
  .node-icon {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 17px;
    border: none;
    background: var(--node-fg, var(--ink-soft));
    color: #FFFFFF;
  }
  .node-icon i.ti { color: #FFFFFF; }
  .node-text {
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.35;
    color: var(--ink);
    flex: 1;
    font-weight: 500;
    letter-spacing: -0.1px;
  }
  .node-meta {
    display: flex; flex-wrap: wrap;
    align-items: center;
    gap: 4px 14px;
    padding-left: 48px;
    font-size: 11.5px;
  }

  /* Actor as text label (no pill) */
  .actor {
    display: inline-flex; align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    line-height: 1;
    color: currentColor;
  }
  .actor::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .actor i.ti { display: none; }
  .actor-manual { color: var(--actor-manual); }
  .actor-auto   { color: var(--gold-deep); }
  .actor-sched  { color: var(--actor-sched); }

  /* System tag — minimal text+icon */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    line-height: 1;
    color: currentColor;
    background: transparent;
    border: none;
    padding: 0;
  }
  .badge i.ti { font-size: 12px; }

  /* Timing — italic serif inline */
  .timing {
    display: inline-flex; align-items: center;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .timing i.ti { display: none; }

  .node-extra {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-muted);
    padding-left: 48px;
    line-height: 1.45;
  }

  /* System color tokens — used both on cards (--node-bg/fg) and badges */
  .sys-zoho      { color: var(--sys-zoho); }
  .sys-whatsapp  { color: var(--sys-wa); }
  .sys-email     { color: var(--sys-mail); }
  .sys-manuale   { color: var(--sys-man); }
  .sys-ads       { color: var(--sys-ads); }
  .sys-logistica { color: var(--sys-log); }

  /* Card pastel backgrounds + filled icon color (driven by data-system) */
  .rail-node[data-system="zoho"]      { --node-bg: var(--sys-zoho-soft); --node-fg: var(--sys-zoho); }
  .rail-node[data-system="whatsapp"]  { --node-bg: var(--sys-wa-soft);   --node-fg: var(--sys-wa); }
  .rail-node[data-system="email"]     { --node-bg: var(--sys-mail-soft); --node-fg: var(--sys-mail); }
  .rail-node[data-system="manuale"]   { --node-bg: var(--sys-man-soft);  --node-fg: var(--sys-man); }
  .rail-node[data-system="ads"]       { --node-bg: var(--sys-ads-soft);  --node-fg: var(--sys-ads); }
  .rail-node[data-system="logistica"] { --node-bg: var(--sys-log-soft);  --node-fg: var(--sys-log); }

  /* ============================================================
     BRANCHES
     ============================================================ */
  .branch-block {
    margin-top: 8px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    display: flex; flex-direction: column;
    gap: 18px;
  }
  .branch-title {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .branch {
    background: var(--bg);
    padding: 14px 16px;
    border-radius: 16px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative;
  }
  .branch::before {
    content: "";
    position: absolute;
    left: 0; top: 14px; bottom: 14px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--bc);
  }
  .branch-head {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 400;
    font-style: italic;
    color: var(--bc);
    line-height: 1;
    padding-left: 8px;
  }
  .branch.yes   { --bc: var(--branch-yes); }
  .branch.maybe { --bc: var(--branch-maybe); }
  .branch.no    { --bc: var(--branch-no); }
  .b-step {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 2px 0;
  }
  .b-step .node-icon { width: 24px; height: 24px; font-size: 12px; }
  .b-step-text {
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.4;
    flex: 1;
    color: var(--ink-soft);
  }
  .b-step-text .badge { margin-top: 6px; }

  /* ============================================================
     CONNECTOR (between columns)
     ============================================================ */
  .connector {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  /* ============================================================
     BOTTOM BAR
     ============================================================ */
  .botbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bot-h);
    background: var(--bg);
    color: var(--ink-muted);
    display: flex; align-items: center;
    padding: 0 32px;
    gap: 18px;
    z-index: 50;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .botbar::-webkit-scrollbar { display: none; }
  .legend-section {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .legend-label {
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 500;
    color: var(--gold-deep);
    letter-spacing: 2px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .legend-divider {
    width: 1px; height: 20px;
    background: var(--hairline);
    flex-shrink: 0;
  }
  .botbar .actor { font-size: 9.5px; }
  .botbar .badge {
    color: var(--ink-muted);
    font-size: 9.5px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--card);
    border: none;
  }
  .botbar .badge i.ti { font-size: 13px; }
  .botbar .badge.bsys-zoho      { background: var(--sys-zoho-soft); color: var(--sys-zoho); }
  .botbar .badge.bsys-whatsapp  { background: var(--sys-wa-soft);   color: var(--sys-wa); }
  .botbar .badge.bsys-email     { background: var(--sys-mail-soft); color: var(--sys-mail); }
  .botbar .badge.bsys-manuale   { background: var(--sys-man-soft);  color: var(--sys-man); }
  .botbar .badge.bsys-ads       { background: var(--sys-ads-soft);  color: var(--sys-ads); }
  .botbar .badge.bsys-logistica { background: var(--sys-log-soft);  color: var(--sys-log); }
  .botbar .badge i.ti { color: currentColor; }

  /* ============================================================
     PHASE OUTCOME (label between two phases)
     ============================================================ */
  .phase-outcome {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--ink);
    color: #FAF1DB;
    padding: 11px 22px 12px;
    max-width: 230px;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13.5px;
    line-height: 1.35;
    letter-spacing: 0.2px;
    z-index: 3;
    pointer-events: none;
    border-radius: 999px;
    box-shadow: 0 12px 28px -12px rgba(10,10,10,0.45),

      touchpoints: [
        { text: "Mail automatica di feedback sulla campagna",
          system: "email", icon: "ti-mail", actor: "auto",
          timing: "Gen 2027",
          assets: [
            { type: "doc", title: "Template mail feedback campagna", url: "#" },
            { type: "link", title: "Form feedback rivenditori", url: "#" },
          ]},
        { text: "Laura propone la campagna successiva (Colomba / Pasqua 2027)",
          system: "manuale", icon: "ti-arrow-right", actor: "manual",
          timing: "Gen 2027",
          link: { text: "subito dopo il feedback", icon: "ti-arrow-down" },
          extra: "Momento di massimo calore — non lasciarlo raffreddare",
          assets: [
            { type: "doc", title: "Brief campagna Colomba / Pasqua 2027", url: "#" },
            { type: "doc", title: "Script proposta nuova campagna", url: "#" },
          ]},
      ],
    },
  ];

  // ============================================================
  // RENDER
  // ============================================================
  const pad = (n) => String(n).padStart(2, "0");

  function badgeForSystem(systemKey) {
    const s = SYS[systemKey];
    if (!s) return "";
    return `<span class="badge ${s.cls}"><i class="ti ${s.icon}"></i>${s.label}</span>`;
  }

  function actorPill(actorKey) {
    const a = ACTOR[actorKey];
    if (!a) return "";
    return `<span class="actor ${a.cls}">${a.label}</span>`;
  }

  function timingPill(timing) {
    if (!timing) return "";
    return `<span class="timing">${timing}</span>`;
  }

  function renderLink(link) {
    if (!link) return "";
    const icon = link.icon || "ti-arrow-down";
    return `<div class="rail-link">
      <span class="chip"><i class="ti ${icon}"></i>${link.text}</span>
    </div>`;
  }

  let _tpCounter = 0;
  function renderNode(tp, phase) {
    const sys = SYS[tp.system];
    const iconCls = sys ? sys.cls : "";
    const actorCls = tp.actor ? `actor-${tp.actor}` : "";
    const id = "tp-" + (++_tpCounter);
    touchpointIndex.set(id, { tp, phase });
    return `
      <div class="rail-node ${actorCls}" data-tp-id="${id}" data-system="${tp.system || ''}" tabindex="0" role="button" aria-label="Vedi asset">
        <div class="node">
          <div class="node-head">
            <span class="node-icon ${iconCls}"><i class="ti ${tp.icon}"></i></span>
            <div class="node-text">${tp.text}</div>
            <i class="ti ti-chevron-right node-chev"></i>
          </div>
          <div class="node-meta">
            ${actorPill(tp.actor)}
            ${timingPill(tp.timing)}
          </div>
          ${tp.extra ? `<div class="node-extra">${tp.extra}</div>` : ""}
        </div>
      </div>`;
  }

  function renderRail(touchpoints, phase) {
    if (!touchpoints || !touchpoints.length) return "";
    return `<div class="rail">
      ${touchpoints.map((tp, i) => `
        ${i > 0 ? renderLink(tp.link) : ""}
        ${renderNode(tp, phase)}
      `).join("")}
    </div>`;
  }

  function renderStream(stream, phase) {
    return `
      <div class="stream ${stream.loop ? "loop" : ""}">
        <div class="stream-header">
          <span class="stream-name">${stream.name}</span>
        </div>
        ${renderRail(stream.touchpoints, phase)}
      </div>`;
  }

  function renderBranchStep(step) {
    const sys = SYS[step.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="b-step">
        <span class="node-icon ${iconCls}"><i class="ti ${step.icon}"></i></span>
        <div class="b-step-text">
          ${step.text}
          <div>${badgeForSystem(step.system)}</div>
        </div>
      </div>`;
  }

  function renderBranches(branches) {
    if (!branches || !branches.length) return "";
    return `
      <div class="branch-block">
        <div class="branch-title">Risposta del contatto</div>
        ${branches.map(b => `
          <div class="branch ${b.kind}">
            <div class="branch-head">${b.label}</div>
            ${b.steps.map(renderBranchStep).join("")}
          </div>
        `).join("")}
      </div>`;
  }

  function formatLeads(n) {
    return n.toLocaleString("it-IT");
  }

  function renderColumn(p) {
    const isCurrent = !!p.current;
    let body = "";
    if (p.streams && p.streams.length) {
      body = p.streams.map(s => renderStream(s, p)).join("");
    } else if (p.touchpoints && p.touchpoints.length) {
      body = renderRail(p.touchpoints, p);
    }
    return `
      <section class="col ${isCurrent ? "current" : ""}" id="phase-${p.n}" data-phase="${p.n}">
        <div class="col-header">
          ${isCurrent ? `<span class="here-dot"><span class="d"></span>Siamo qui</span>` : ""}
          <span class="col-num">${pad(p.n)}</span>
          <h2 class="col-name">${p.name}</h2>
          <div class="col-period">${p.period}</div>
          ${p.leads != null ? `<div class="col-leads"><span class="num">${formatLeads(p.leads)}</span><span class="label">lead</span></div>` : ""}
          ${p.tags ? `<div class="col-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        </div>
        <div class="col-body">
          ${p.annotation ? `<div class="annotation"><i class="ti ${p.annotation.icon}"></i>${p.annotation.text}</div>` : ""}
          ${body}
          ${renderBranches(p.branches)}
        </div>
      </section>`;
  }

  // ============================================================
  // BOOT
  // ============================================================
  const track = document.getElementById("track");
  const nav = document.getElementById("nav");

  track.insertAdjacentHTML("beforeend", phases.map(renderColumn).join(""));

  nav.innerHTML = phases.map(p => `
    <button class="pill" data-target="phase-${p.n}">
      <span class="num">${pad(p.n)}</span>${p.name}
    </button>
  `).join("");

  const scrollArea = document.getElementById("scrollArea");
  const pills = [...nav.querySelectorAll(".pill")];

  // ----- Zoom (Cmd/Ctrl+wheel, pinch trackpad, keyboard, controls) -----
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 1.8;
  let zoomLevel = 1.0;
  const zoomPctEl = document.querySelector(".zoom-pct");

  function updateZoomLabel() {
    if (zoomPctEl) zoomPctEl.textContent = Math.round(zoomLevel * 100) + "%";
  }

  function setZoom(nextZoom, anchorX) {
    const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, nextZoom));
    if (Math.abs(clamped - zoomLevel) < 0.001) return;
    if (anchorX == null) anchorX = scrollArea.clientWidth / 2;

    const ratio = clamped / zoomLevel;
    const beforeContentX = scrollArea.scrollLeft + anchorX;

    zoomLevel = clamped;
    track.style.zoom = clamped;

    // Keep the point under the anchor visually stable
    scrollArea.scrollLeft = beforeContentX * ratio - anchorX;

    updateZoomLabel();
    requestAnimationFrame(drawConnectors);
  }

  // Cmd/Ctrl+wheel and trackpad pinch (Mac sends ctrlKey=true on pinch) → zoom
  // All other wheel input falls through to native browser scrolling
  scrollArea.addEventListener("wheel", (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const rect = scrollArea.getBoundingClientRect();
      const cursorX = e.clientX - rect.left;
      const factor = Math.pow(0.998, e.deltaY);
      setZoom(zoomLevel * factor, cursorX);
    }
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === "0") { e.preventDefault(); setZoom(1.0); }
    else if (e.key === "=" || e.key === "+") { e.preventDefault(); setZoom(zoomLevel * 1.15); }
    else if (e.key === "-") { e.preventDefault(); setZoom(zoomLevel / 1.15); }
  });

  document.querySelectorAll(".zoom-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const dir = parseInt(btn.dataset.zoom, 10);
      if (dir === 0) setZoom(1.0);
      else if (dir > 0) setZoom(zoomLevel * 1.15);
      else setZoom(zoomLevel / 1.15);
    });
  });

  updateZoomLabel();

  // ----- Asset Panel (slide-over) -----
  const panel = document.getElementById("assetPanel");
  const backdrop = document.getElementById("assetBackdrop");
  const panelTitle = document.getElementById("assetPanelTitle");
  const panelKicker = document.getElementById("assetPanelKicker");
  const panelMeta = document.getElementById("assetPanelMeta");
  const panelBody = document.getElementById("assetPanelBody");
  const panelClose = document.getElementById("assetPanelClose");

  function renderAssetCard(asset) {
    const t = ASSET_TYPE[asset.type] || ASSET_TYPE.link;
    return `
      <a class="asset-card" href="${asset.url || "#"}" target="_blank" rel="noopener">
        <span class="asset-icon"><i class="ti ${t.icon}"></i></span>
        <span class="asset-info">
          <span class="asset-title">${asset.title}</span>
          <span class="asset-type">${t.label}</span>
        </span>
        <i class="ti ti-arrow-up-right asset-arrow"></i>
      </a>`;
  }

  function openPanel(tpId) {
    const entry = touchpointIndex.get(tpId);
    if (!entry) return;
    const { tp, phase } = entry;

    panelKicker.textContent = `Fase ${pad(phase.n)} · ${phase.name}`;
    panelTitle.textContent = tp.text;

    panelMeta.innerHTML = [
      actorPill(tp.actor),
      badgeForSystem(tp.system),
      timingPill(tp.timing),
    ].filter(Boolean).join("");

    if (tp.assets && tp.assets.length) {
      panelBody.innerHTML = `
        <div class="asset-panel-section-title">Asset & materiali</div>
        ${tp.assets.map(renderAssetCard).join("")}
      `;
    } else {
      panelBody.innerHTML = `<div class="asset-empty">Nessun asset associato a questo touchpoint.</div>`;
    }

    panel.classList.add("open");
    backdrop.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
  }

  function closePanel() {
    panel.classList.remove("open");
    backdrop.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
  }

  // Click delegation on rail nodes
  track.addEventListener("click", (e) => {
    const node = e.target.closest(".rail-node");
    if (!node) return;
    const tpId = node.dataset.tpId;
    if (tpId) openPanel(tpId);
  });

  // Keyboard activation
  track.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const node = e.target.closest(".rail-node");
    if (!node) return;
    e.preventDefault();
    const tpId = node.dataset.tpId;
    if (tpId) openPanel(tpId);
  });

  panelClose.addEventListener("click", closePanel);
  backdrop.addEventListener("click", closePanel);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePanel();
  });

  const colEls = [...document.querySelectorAll(".col")];
  const ratios = new Map();
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => ratios.set(entry.target.id, entry.intersectionRatio));
    let bestId = null, bestR = 0;
    ratios.forEach((r, id) => { if (r > bestR) { bestR = r; bestId = id; } });
    pills.forEach(p => p.classList.toggle("active",
      bestId && p.dataset.target === bestId && bestR > 0.05));
  }, { root: scrollArea, threshold: [0, 0.25, 0.5, 0.75, 1] });
  colEls.forEach(el => observer.observe(el));

  function drawConnectors() {
    const svg = document.getElementById("connector");
    svg.setAttribute("width", track.scrollWidth);
    svg.setAttribute("height", track.scrollHeight);
    [...svg.querySelectorAll("path.link")].forEach(n => n.remove());
    [...track.querySelectorAll(".phase-outcome")].forEach(n => n.remove());

    // Single horizontal line for all connectors at ~½ of the shortest column,
    // so the outcome chip floats between phases at column mid-height.
    const minColH = Math.min(...colEls.map(c => c.offsetHeight));
    const baseY = Math.floor(minColH / 2);

    for (let i = 0; i < colEls.length - 1; i++) {
      const a = colEls[i];
      const b = colEls[i + 1];
      const ax = a.offsetLeft + a.offsetWidth;
      const bx = b.offsetLeft;
      const y = a.offsetTop + baseY;
      const midX = (ax + bx) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${ax + 8} ${y} C ${midX} ${y}, ${midX} ${y}, ${bx - 14} ${y}`;
      path.setAttribute("d", d);
      path.setAttribute("class", "link");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#A89060");
      path.setAttribute("stroke-width", "1");
      path.setAttribute("opacity", "0.6");
      path.setAttribute("marker-end", "url(#arrowhead)");
      svg.appendChild(path);

      // Phase outcome label centered on the connector + lead delta
      const phase = phases[i];
      const next = phases[i + 1];
      if (phase.outcome || (phase.leads != null && next.leads != null)) {
        const label = document.createElement("div");
        label.className = "phase-outcome";
        label.style.left = midX + "px";
        label.style.top = y + "px";

        if (phase.outcome) {
          const span = document.createElement("span");
          span.textContent = phase.outcome;
          label.appendChild(span);
        }

        if (phase.leads != null && next.leads != null && phase.leads > 0) {
          const delta = next.leads - phase.leads;
          if (delta !== 0) {
            const pct = Math.round((delta / phase.leads) * 100);
            const sign = delta > 0 ? "+" : "−";
            const deltaEl = document.createElement("span");
            deltaEl.className = "outcome-delta " + (delta > 0 ? "positive" : "negative");
            deltaEl.textContent = `${sign}${formatLeads(Math.abs(delta))} lead · ${sign}${Math.abs(pct)}%`;
            label.appendChild(deltaEl);
          }
        }

        track.appendChild(label);
      }
    }
  }

  window.addEventListener("load", drawConnectors);
  window.addEventListener("resize", drawConnectors);
  setTimeout(drawConnectors, 200);
  setTimeout(drawConnectors, 800);
  setTimeout(drawConnectors, 2000);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawConnectors);
  }

  setTimeout(() => {
    if (!pills.some(p => p.classList.contains("active"))) {
      pills[0].classList.add("active");
    }
  }, 300);
</script>
</body>
</html>
