<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Retail — Pasticceria Giotto · Natale 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #EDE9E2;
    --bar: #1C1B18;
    --col-bg: #FFFFFF;
    --col-border: rgba(26,25,23,0.10);
    --col-header: #1C1B18;
    --col-header-current: #251F10;
    --text: #1A1917;
    --text-soft: #8C8A84;
    --arrow: #C0BDB6;

    --sys-zoho-bg: #E6F1FB;       --sys-zoho-fg: #0C447C;
    --sys-wa-bg:   #EAF3DE;       --sys-wa-fg:   #27500A;
    --sys-mail-bg: #FAEEDA;       --sys-mail-fg: #633806;
    --sys-man-bg:  #FAECE7;       --sys-man-fg:  #712B13;
    --sys-ads-bg:  #EEEDFE;       --sys-ads-fg:  #3C3489;
    --sys-log-bg:  #F1EFE8;       --sys-log-fg:  #444441;

    --branch-yes: #4F9D3A;
    --branch-maybe: #C28A1E;
    --branch-no: #B3402A;

    --top-h: 54px;
    --bot-h: 38px;
    --col-w: 268px;
    --gap: 56px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--top-h);
    background: var(--bar);
    color: #F4F2EC;
    display: flex; align-items: center;
    padding: 0 20px;
    z-index: 50;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .brand {
    display: flex; flex-direction: column;
    margin-right: 28px;
    min-width: 220px;
    flex-shrink: 0;
  }
  .brand strong {
    font-size: 13.5px;
    letter-spacing: 0.2px;
    font-weight: 600;
  }
  .brand span {
    font-size: 11px;
    color: #9F9C93;
    margin-top: 2px;
  }
  .nav {
    display: flex; gap: 6px; overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.14);
    color: #B8B5AC;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
    white-space: nowrap;
    font-family: inherit;
  }
  .pill:hover { color: #F4F2EC; border-color: rgba(255,255,255,0.3); }
  .pill.active {
    background: #F4F2EC;
    color: #1C1B18;
    border-color: #F4F2EC;
  }
  .pill .num {
    font-variant-numeric: tabular-nums;
    margin-right: 6px;
    opacity: 0.65;
    font-weight: 600;
  }
  .pill.active .num { opacity: 1; }

  /* ---------- SCROLL AREA ---------- */
  .scroll-area {
    position: fixed;
    top: var(--top-h);
    bottom: var(--bot-h);
    left: 0; right: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: 28px 40px 32px 40px;
  }
  .track {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
    min-width: max-content;
    position: relative;
    padding-bottom: 20px;
  }

  /* ---------- COLUMN ---------- */
  .col {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    background: var(--col-bg);
    border: 1px solid var(--col-border);
    border-radius: 12px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 0 rgba(26,25,23,0.04), 0 8px 24px -16px rgba(26,25,23,0.18);
    position: relative;
    z-index: 2;
  }
  .col-header {
    background: var(--col-header);
    color: #F4F2EC;
    padding: 14px 16px 13px;
    position: relative;
  }
  .col.current .col-header { background: var(--col-header-current); }
  .col-num {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    color: #B5A98A;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
  }
  .here-dot {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 222, 138, 0.14);
    color: #F5D78A;
    padding: 2px 7px 2px 6px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
  }
  .here-dot .d {
    width: 6px; height: 6px;
    background: #F5D78A;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(245,215,138,0.6);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(245,215,138,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(245,215,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,215,138,0); }
  }
  .col-name {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.1px;
    margin: 0;
  }
  .col-period {
    font-size: 11px;
    color: #B8B5AC;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .col-tags {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 9px;
  }
  .tag {
    font-size: 9.5px;
    font-weight: 500;
    color: #DCD7C9;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 2px 7px;
    border-radius: 999px;
    letter-spacing: 0.2px;
  }

  .col-body {
    padding: 14px 14px 16px;
    display: flex; flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .note {
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--text-soft);
    background: #F7F4ED;
    border-left: 2px solid #D5CFC1;
    padding: 8px 10px;
    border-radius: 0 6px 6px 0;
  }
  .annotation {
    font-size: 11px;
    line-height: 1.45;
    color: #0C447C;
    background: #E6F1FB;
    border-left: 2px solid #6FA5D8;
    padding: 8px 10px 8px 30px;
    border-radius: 0 6px 6px 0;
    position: relative;
  }
  .annotation i.ti {
    position: absolute;
    left: 9px; top: 8px;
    font-size: 14px;
  }

  /* ---------- TOUCHPOINT ---------- */
  .tp {
    background: #FBFAF6;
    border: 1px solid rgba(26,25,23,0.07);
    border-radius: 8px;
    padding: 9px 10px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .tp-row {
    display: flex; align-items: flex-start; gap: 8px;
  }
  .tp-icon {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 1px;
  }
  .tp-text {
    font-size: 11.8px;
    line-height: 1.38;
    color: var(--text);
    flex: 1;
  }
  .tp-meta {
    display: flex; flex-wrap: wrap; gap: 5px;
    align-items: center;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 999px;
    letter-spacing: 0.1px;
    white-space: nowrap;
  }
  .badge i.ti { font-size: 11px; }
  .timing {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px;
    color: var(--text-soft);
    background: #F1EEE5;
    border: 1px solid rgba(26,25,23,0.05);
    padding: 2px 7px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .timing i.ti { font-size: 10.5px; }
  .tp-extra {
    font-size: 10.5px;
    color: var(--text-soft);
    font-style: italic;
    padding-left: 30px;
    line-height: 1.4;
  }

  /* ---------- SYSTEM COLORS ---------- */
  .sys-zoho     { background: var(--sys-zoho-bg);  color: var(--sys-zoho-fg); }
  .sys-whatsapp { background: var(--sys-wa-bg);    color: var(--sys-wa-fg); }
  .sys-email    { background: var(--sys-mail-bg);  color: var(--sys-mail-fg); }
  .sys-manuale  { background: var(--sys-man-bg);   color: var(--sys-man-fg); }
  .sys-ads      { background: var(--sys-ads-bg);   color: var(--sys-ads-fg); }
  .sys-logistica{ background: var(--sys-log-bg);   color: var(--sys-log-fg); }

  /* ---------- BRANCHES ---------- */
  .branch-block {
    margin-top: 4px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .branch-title {
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-soft);
    margin-bottom: 2px;
  }
  .branch {
    border-left: 3px solid var(--bc);
    background: var(--bbg);
    border-radius: 0 8px 8px 0;
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .branch-head {
    font-size: 11px;
    font-weight: 600;
    color: var(--bc);
    display: flex; align-items: center; gap: 6px;
    letter-spacing: 0.2px;
  }
  .branch-head .dot {
    width: 7px; height: 7px;
    background: var(--bc);
    border-radius: 50%;
  }
  .branch.yes   { --bc: var(--branch-yes);   --bbg: #F1F7EC; }
  .branch.maybe { --bc: var(--branch-maybe); --bbg: #FAF3DF; }
  .branch.no    { --bc: var(--branch-no);    --bbg: #FAE9E2; }
  .b-step {
    display: flex; align-items: flex-start; gap: 7px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(26,25,23,0.05);
    padding: 6px 8px;
    border-radius: 6px;
  }
  .b-step .tp-icon { width: 20px; height: 20px; font-size: 12px; }
  .b-step-text {
    font-size: 11px;
    line-height: 1.35;
    flex: 1;
    color: var(--text);
  }
  .b-step-text .badge {
    margin-top: 4px;
  }

  /* ---------- CONNECTOR ARROWS ---------- */
  .connector {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  /* ---------- BOTTOM BAR ---------- */
  .botbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bot-h);
    background: var(--bar);
    color: #B8B5AC;
    display: flex; align-items: center;
    padding: 0 20px;
    gap: 14px;
    z-index: 50;
    overflow-x: auto;
    font-size: 11px;
    scrollbar-width: none;
  }
  .botbar::-webkit-scrollbar { display: none; }
  .legend-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #6B6962;
    flex-shrink: 0;
  }
  .botbar .badge {
    flex-shrink: 0;
    font-size: 10.5px;
    padding: 3px 9px;
  }

  /* ---------- SCROLLBAR ---------- */
  .scroll-area::-webkit-scrollbar { height: 10px; width: 10px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb {
    background: rgba(26,25,23,0.18);
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: rgba(26,25,23,0.32); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <strong>Journey Retail · Pasticceria Giotto</strong>
    <span>Campagna Natale 2026 — operativo rivenditori</span>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main class="scroll-area" id="scrollArea">
  <div class="track" id="track">
    <svg class="connector" id="connector" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#C0BDB6"></path>
        </marker>
      </defs>
    </svg>
  </div>
</main>

<footer class="botbar">
  <span class="legend-label">Sistemi</span>
  <span class="badge sys-zoho"><i class="ti ti-database"></i>Zoho CRM</span>
  <span class="badge sys-whatsapp"><i class="ti ti-brand-whatsapp"></i>WhatsApp Business</span>
  <span class="badge sys-email"><i class="ti ti-mail"></i>Email automatica</span>
  <span class="badge sys-manuale"><i class="ti ti-user"></i>Manuale Laura</span>
  <span class="badge sys-ads"><i class="ti ti-speakerphone"></i>Meta / Google Ads</span>
  <span class="badge sys-logistica"><i class="ti ti-truck"></i>Logistica</span>
</footer>

<script>
  // -------------- SYSTEM CATALOG ----------------
  const SYS = {
    manuale:   { label: "Manuale Laura",     cls: "sys-manuale",   icon: "ti-user" },
    ads:       { label: "Meta / Google Ads", cls: "sys-ads",       icon: "ti-speakerphone" },
    email:     { label: "Email automatica",  cls: "sys-email",     icon: "ti-mail" },
    zoho:      { label: "Zoho CRM",          cls: "sys-zoho",      icon: "ti-database" },
    whatsapp:  { label: "WhatsApp Business", cls: "sys-whatsapp",  icon: "ti-brand-whatsapp" },
    logistica: { label: "Logistica",         cls: "sys-logistica", icon: "ti-truck" },
  };

  // -------------- DATA ----------------
  const phases = [
    {
      n: 1, name: "Generazione lead", period: "Mag–Giu 2026",
      current: true,
      note: "Due stream paralleli: outbound (lista manuale) e inbound (ads → landing → Zoho). Avvio immediato.",
      touchpoints: [
        { text: "Estrapolazione contatti enoteche per area geografica", system: "manuale", icon: "ti-search", timing: "Avvio immediato" },
        { text: "Campagna awareness geo-targeted — prepara il terreno prima delle chiamate", system: "ads", icon: "ti-speakerphone", timing: "Mag 2026" },
        { text: "Campagna lead gen Nord Italia → landing → ingresso automatico in Zoho", system: "ads", icon: "ti-target", timing: "Mag 2026",
          extra: "Landing già integrata — lead entra in pipeline senza azione manuale" },
      ],
    },
    {
      n: 2, name: "Esplorazione", period: "Mag–Giu 2026",
      tags: ["parallela alla lead gen"],
      note: "Laura lavora la lista outbound mentre i lead inbound entrano da soli in Zoho.",
      touchpoints: [
        { text: "Laura chiama i contatti della lista outbound", system: "manuale", icon: "ti-phone", timing: "Avvio immediato" },
        { text: "Raccoglie l'email durante la chiamata", system: "manuale", icon: "ti-at" },
        { text: "Mail automatica con allegato retail (benefit rivenditori Giotto)", system: "email", icon: "ti-mail", timing: "Entro 24h — trigger: email in Zoho" },
      ],
    },
    {
      n: 3, name: "Proposta appuntamento", period: "Giu 2026",
      note: "Task automatico da Zoho 72h dopo la mail — Laura non deve ricordarselo.",
      touchpoints: [
        { text: "Task automatico Zoho: chiama per proporre l'incontro", system: "zoho", icon: "ti-bell", timing: "+72h dalla mail automatica" },
        { text: "Laura propone incontro per far assaggiare la campionatura", system: "manuale", icon: "ti-phone", timing: "Giu 2026" },
      ],
      branches: [
        { kind: "yes",   label: "Sì",    steps: [
          { text: "Appuntamento fissato a calendario in Zoho", system: "zoho", icon: "ti-calendar" },
        ]},
        { kind: "maybe", label: "Forse", steps: [
          { text: "Task automatico: richiama tra 1 settimana", system: "zoho", icon: "ti-clock" },
        ]},
        { kind: "no",    label: "No",    steps: [
          { text: "Reminder manuale — data scelta da Laura", system: "zoho", icon: "ti-calendar-off" },
          { text: "Inserito in lista newsletter awareness", system: "email", icon: "ti-mail" },
        ]},
      ],
    },
    {
      n: 4, name: "Incontro", period: "Giu–Lug 2026",
      touchpoints: [
        { text: "Laura porta la campionatura prodotti Natale 2026", system: "manuale", icon: "ti-gift", timing: "Giu–Lug 2026" },
        { text: "Mostra materiali di comunicazione da tablet", system: "manuale", icon: "ti-device-tablet" },
        { text: "Presenta e lascia il listino", system: "manuale", icon: "ti-file-text" },
      ],
    },
    {
      n: 5, name: "Ragionamento", period: "Lug 2026",
      note: "1–2 settimane in base al momento dell'anno. Touchpoint attivo a metà periodo.",
      touchpoints: [
        { text: "Reminder Zoho con data di richiamo personalizzata", system: "zoho", icon: "ti-bell" },
        { text: "WhatsApp a metà periodo: \"Com'è andata con la campionatura?\"", system: "whatsapp", icon: "ti-brand-whatsapp", timing: "A metà del periodo" },
      ],
    },
    {
      n: 6, name: "Risposta", period: "Lug–Ago 2026",
      note: "Momento decisivo. I No definitivi restano nel perimetro Giotto via newsletter.",
      branches: [
        { kind: "yes",   label: "Sì",    steps: [
          { text: "Laura prende l'ordine", system: "manuale", icon: "ti-clipboard-check" },
        ]},
        { kind: "maybe", label: "Forse", steps: [
          { text: "Reminder ping automatico in Zoho", system: "zoho", icon: "ti-bell" },
        ]},
        { kind: "no",    label: "No",    steps: [
          { text: "Reminder a mesi in Zoho", system: "zoho", icon: "ti-calendar-off" },
          { text: "Inserito in lista newsletter awareness", system: "email", icon: "ti-mail" },
        ]},
      ],
    },
    {
      n: 7, name: "Onboarding", period: "Ago–Set 2026",
      tags: ["storici entrano qui"],
      note: "I rivenditori storici che riacquistano saltano le fasi 1–6 ed entrano direttamente qui.",
      annotation: { icon: "ti-arrow-down-right", text: "Rivenditori storici: entrano direttamente da qui" },
      touchpoints: [
        { text: "Mail automatica: store locator + scontistica dedicata per i primi 6 mesi", system: "email", icon: "ti-mail", timing: "Entro 24h dalla conferma" },
        { text: "Spedizione ordine + kit comunicazione campagna Natale nella scatola", system: "logistica", icon: "ti-truck", timing: "Set 2026" },
      ],
    },
    {
      n: 8, name: "Campagna attiva", period: "Ott–Dic 2026",
      note: "Touchpoint ricorrenti per tutti i rivenditori attivi — nuovi e storici.",
      touchpoints: [
        { text: "Scheda prodotto mensile (approfondimento campagna Natale)", system: "email", icon: "ti-mail", timing: "1× al mese" },
        { text: "WhatsApp: contenuti social selezionati da Laura", system: "whatsapp", icon: "ti-brand-whatsapp", timing: "Ogni venerdì" },
        { text: "Newsletter editoriale \"Storie dal carcere\"", system: "email", icon: "ti-newspaper", timing: "Ogni 2 del mese" },
        { text: "Mail numeri salienti della campagna", system: "email", icon: "ti-chart-bar", timing: "Nov 2026 — 3 sett. prima chiusura" },
      ],
    },
    {
      n: 9, name: "Fine campagna", period: "Gen 2027",
      touchpoints: [
        { text: "Mail automatica di feedback sulla campagna", system: "email", icon: "ti-mail", timing: "Gen 2027" },
        { text: "Laura propone la campagna successiva (Colomba / Pasqua 2027)", system: "manuale", icon: "ti-arrow-right", timing: "Gen 2027",
          extra: "Momento di massimo calore — non lasciarlo raffreddare" },
      ],
    },
  ];

  // -------------- RENDER HELPERS ----------------
  const pad = (n) => String(n).padStart(2, "0");

  function badgeForSystem(systemKey) {
    const s = SYS[systemKey];
    if (!s) return "";
    return `<span class="badge ${s.cls}"><i class="ti ${s.icon}"></i>${s.label}</span>`;
  }

  function timingPill(timing) {
    if (!timing) return "";
    return `<span class="timing"><i class="ti ti-clock"></i>${timing}</span>`;
  }

  function renderTouchpoint(tp) {
    const sys = SYS[tp.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="tp">
        <div class="tp-row">
          <span class="tp-icon ${iconCls}"><i class="ti ${tp.icon}"></i></span>
          <div class="tp-text">${tp.text}</div>
        </div>
        <div class="tp-meta">
          ${badgeForSystem(tp.system)}
          ${timingPill(tp.timing)}
        </div>
        ${tp.extra ? `<div class="tp-extra">${tp.extra}</div>` : ""}
      </div>`;
  }

  function renderBranchStep(step) {
    const sys = SYS[step.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="b-step">
        <span class="tp-icon ${iconCls}"><i class="ti ${step.icon}"></i></span>
        <div class="b-step-text">
          ${step.text}
          <div>${badgeForSystem(step.system)}</div>
        </div>
      </div>`;
  }

  function renderBranches(branches) {
    if (!branches || !branches.length) return "";
    return `
      <div class="branch-block">
        <div class="branch-title">Risposta del contatto</div>
        ${branches.map(b => `
          <div class="branch ${b.kind}">
            <div class="branch-head"><span class="dot"></span>${b.label}</div>
            ${b.steps.map(renderBranchStep).join("")}
          </div>
        `).join("")}
      </div>`;
  }

  function renderColumn(p) {
    const isCurrent = !!p.current;
    return `
      <section class="col ${isCurrent ? "current" : ""}" id="phase-${p.n}" data-phase="${p.n}">
        <div class="col-header">
          <div class="col-num">
            <span>FASE ${pad(p.n)}</span>
            ${isCurrent ? `<span class="here-dot"><span class="d"></span>Siamo qui</span>` : ""}
          </div>
          <h2 class="col-name">${p.name}</h2>
          <div class="col-period">${p.period}</div>
          ${p.tags ? `<div class="col-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        </div>
        <div class="col-body">
          ${p.note ? `<div class="note">${p.note}</div>` : ""}
          ${p.annotation ? `<div class="annotation"><i class="ti ${p.annotation.icon}"></i>${p.annotation.text}</div>` : ""}
          ${(p.touchpoints || []).map(renderTouchpoint).join("")}
          ${renderBranches(p.branches)}
        </div>
      </section>`;
  }

  // -------------- RENDER ----------------
  const track = document.getElementById("track");
  const nav = document.getElementById("nav");

  track.insertAdjacentHTML("beforeend", phases.map(renderColumn).join(""));

  nav.innerHTML = phases.map(p => `
    <button class="pill" data-target="phase-${p.n}">
      <span class="num">${pad(p.n)}</span>${p.name}
    </button>
  `).join("");

  // -------------- NAV INTERACTION ----------------
  const scrollArea = document.getElementById("scrollArea");
  const pills = [...nav.querySelectorAll(".pill")];

  pills.forEach(pill => {
    pill.addEventListener("click", () => {
      const target = document.getElementById(pill.dataset.target);
      if (!target) return;
      const left = target.offsetLeft - 40;
      scrollArea.scrollTo({ left, behavior: "smooth" });
    });
  });

  // IntersectionObserver: highlight pill of column most visible
  const colEls = [...document.querySelectorAll(".col")];
  const ratios = new Map();
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      ratios.set(entry.target.id, entry.intersectionRatio);
    });
    let bestId = null, bestR = 0;
    ratios.forEach((r, id) => {
      if (r > bestR) { bestR = r; bestId = id; }
    });
    pills.forEach(p => p.classList.toggle("active",
      bestId && p.dataset.target === bestId && bestR > 0.05));
  }, {
    root: scrollArea,
    threshold: [0, 0.25, 0.5, 0.75, 1],
  });
  colEls.forEach(el => observer.observe(el));

  // -------------- SVG CONNECTORS ----------------
  function drawConnectors() {
    const svg = document.getElementById("connector");
    svg.setAttribute("width", track.scrollWidth);
    svg.setAttribute("height", track.scrollHeight);

    [...svg.querySelectorAll("path.link")].forEach(n => n.remove());

    for (let i = 0; i < colEls.length - 1; i++) {
      const a = colEls[i];
      const b = colEls[i + 1];
      const ax = a.offsetLeft + a.offsetWidth;
      const bx = b.offsetLeft;
      const y = a.offsetTop + 36;
      const midX = (ax + bx) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${ax + 2} ${y} C ${midX} ${y}, ${midX} ${y}, ${bx - 8} ${y}`;
      path.setAttribute("d", d);
      path.setAttribute("class", "link");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#C0BDB6");
      path.setAttribute("stroke-width", "1.5");
      path.setAttribute("stroke-dasharray", "4 4");
      path.setAttribute("marker-end", "url(#arrowhead)");
      svg.appendChild(path);
    }
  }

  window.addEventListener("load", drawConnectors);
  window.addEventListener("resize", drawConnectors);
  setTimeout(drawConnectors, 200);
  setTimeout(drawConnectors, 800);

  setTimeout(() => {
    if (!pills.some(p => p.classList.contains("active"))) {
      pills[0].classList.add("active");
    }
  }, 300);
</script>
</body>
</html>
