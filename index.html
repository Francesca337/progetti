    if (!card || !card.classList.contains("editing")) return;
    const action = btn.dataset.action;
    const tpId = card.dataset.tpId;
    const draft = getOrInitDraft(tpId);

    if (action === "delete-data") {
      const row = btn.closest(".node-data-row");
      const idx = +row.dataset.row;
      draft.data.splice(idx, 1);
      // Re-render data section only (simpler: re-render the whole card)
      rerenderRailNode(tpId);
      // Restore dirty + draft (rerenderRailNode reads from entry.tp, not draft)
      dirtyTps.set(tpId, draft);
      const newCard = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
      // Hydrate inputs from draft after re-render
      hydrateCardFromDraft(newCard, draft);
      markCardDirty(newCard, true);
    } else if (action === "add-data") {
      draft.data.push({ label: "", value: "" });
      rerenderRailNode(tpId);
      dirtyTps.set(tpId, draft);
      const newCard = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
      hydrateCardFromDraft(newCard, draft);
      markCardDirty(newCard, true);
      // Focus the new empty row's label input
      const rows = newCard.querySelectorAll(".node-data-row.editing input[data-field='label']");
      const last = rows[rows.length - 1];
      if (last) last.focus();
    } else if (action === "save-tp") {
      saveInlineCard(tpId);
    }
  }

  function hydrateCardFromDraft(card, draft) {
    if (!card) return;
    const tArea = card.querySelector('.node-text-input'); if (tArea) tArea.value = draft.text;
    const eArea = card.querySelector('.node-extra-input'); if (eArea) eArea.value = draft.extra;
    const aSel  = card.querySelector('select[data-field="actor"]'); if (aSel) aSel.value = draft.actor;
    const sSel  = card.querySelector('select[data-field="system"]'); if (sSel) sSel.value = draft.system;
    const tIn   = card.querySelector('input[data-field="timing"]');  if (tIn)  tIn.value = draft.timing;
    card.querySelectorAll(".node-data-row.editing").forEach((row, idx) => {
      const lab = row.querySelector('input[data-field="label"]');
      const val = row.querySelector('input[data-field="value"]');
      if (lab && draft.data[idx]) lab.value = draft.data[idx].label || "";
      if (val && draft.data[idx]) val.value = draft.data[idx].value || "";
    });
  }

  async function saveInlineCard(tpId) {
    const entry = touchpointIndex.get(tpId);
    const draft = dirtyTps.get(tpId);
    if (!entry || !draft) return;
    const card = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
    const status = card.querySelector(".node-save-status");
    const btn = card.querySelector(".node-save-btn");
    btn.disabled = true;
    if (status) { status.textContent = "Salvataggio…"; status.dataset.state = "saving"; }
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      const tpRef = findTouchpointInJourney(journey, tpId, entry);
      if (!tpRef) throw new Error("Touchpoint non trovato nel JSON");

      tpRef.text   = draft.text;
      tpRef.actor  = draft.actor;
      tpRef.system = draft.system;
      if (draft.timing) tpRef.timing = draft.timing; else delete tpRef.timing;
      if (draft.extra)  tpRef.extra  = draft.extra;  else delete tpRef.extra;
      const cleanData = draft.data
        .map(d => ({ label: (d.label||"").trim(), value: (d.value||"").trim() }))
        .filter(d => d.label || d.value);
      if (cleanData.length) tpRef.data = cleanData; else delete tpRef.data;

      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent,
        `cms: update touchpoint (fase ${entry.phase.n}) — ${draft.text.slice(0, 60)}`);

      // Update local + DOM
      entry.tp.text   = draft.text;
      entry.tp.actor  = draft.actor;
      entry.tp.system = draft.system;
      entry.tp.timing = draft.timing || undefined;
      entry.tp.extra  = draft.extra  || undefined;
      entry.tp.data   = cleanData.length ? cleanData : undefined;
      dirtyTps.delete(tpId);
      rerenderRailNode(tpId);
      const fresh = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
      const freshStatus = fresh && fresh.querySelector(".node-save-status");
      if (freshStatus) {
        freshStatus.textContent = "Salvato";
        freshStatus.dataset.state = "ok";
        setTimeout(() => { freshStatus.textContent = ""; delete freshStatus.dataset.state; }, 2500);
      }
    } catch (err) {
      if (status) { status.textContent = "Errore: " + (err.message || err); status.dataset.state = "error"; }
      btn.disabled = false;
    }
  }

  // Attach delegated handlers once
  track.addEventListener("input",  onInlineEdit);
  track.addEventListener("change", onInlineEdit);
  track.addEventListener("click",  onInlineAction);

  editToggleBtn.addEventListener("click", () => {
    // No auth required — commits go through Netlify Function `commit`
    // which holds a GitHub PAT server-side. Anyone with the URL can edit.
    toggleEditMode();
  });

  // ---- Commit helpers (via Netlify Function /.netlify/functions/commit) ----
  async function ggGet(path) {
    const res = await fetch(`/.netlify/functions/commit?path=${encodeURIComponent(path)}`);
    if (res.status === 404) return null;
    if (!res.ok) {
      const detail = await ggReadErr(res);
      throw new Error(`GET ${path}: ${res.status} ${detail}`);
    }
    return res.json();
  }

  async function ggPut(path, base64Content, message) {
    const res = await fetch(`/.netlify/functions/commit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path, content: base64Content, message }),
    });
    if (!res.ok) {
      const detail = await ggReadErr(res);
      throw new Error(`PUT ${path}: ${res.status} ${detail}`);
    }
    return res.json();
  }

  async function ggReadErr(res) {
    try {
      const t = await res.text();
      // Try to extract { error: "..." } JSON, fall back to raw text
      try { return JSON.parse(t).error || t; } catch { return t; }
    } catch { return ""; }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function inferAssetType(name) {
    const ext = name.split(".").pop().toLowerCase();
    if (["pdf"].includes(ext)) return "pdf";
    if (["jpg","jpeg","png","gif","webp","svg","avif"].includes(ext)) return "image";
    if (["mp4","mov","webm","m4v"].includes(ext)) return "video";
    if (["xls","xlsx","csv","numbers"].includes(ext)) return "sheet";
    return "doc";
  }

    return (s || "asset")
      .toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "asset";
  }

  async function saveTouchpointEdits() {
    if (!activeTpId || !draftAssets) return;
    const entry = touchpointIndex.get(activeTpId);
    if (!entry) return;

    editSaveBtn.disabled = true;
    editCancelBtn.disabled = true;

    try {
      // Update journey.json
      setStatus("Salvataggio modifiche…", "saving");
      // Read fresh journey to get latest SHA
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      // Locate the touchpoint and update its fields
      const tpRef = findTouchpointInJourney(journey, activeTpId, entry);
      if (!tpRef) throw new Error("Touchpoint non trovato nel journey JSON");

      // Metadata
      tpRef.text = draftTp.text;
      tpRef.system = draftTp.system;
      tpRef.actor = draftTp.actor;
      if (draftTp.timing) tpRef.timing = draftTp.timing; else delete tpRef.timing;
      if (draftTp.extra)  tpRef.extra  = draftTp.extra;  else delete tpRef.extra;

      // Structured data
      const cleanData = draftData
        .map(d => ({ label: (d.label || "").trim(), value: (d.value || "").trim() }))
        .filter(d => d.label || d.value);
      if (cleanData.length) tpRef.data = cleanData; else delete tpRef.data;

      // Asset links (external URLs)
      const cleanAssets = draftAssets.map(a => {
        const { _pending, _tempId, ...rest } = a;
        return rest;
      });
      if (cleanAssets.length) tpRef.assets = cleanAssets; else delete tpRef.assets;

      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent, `cms: update touchpoint (fase ${entry.phase.n}) — ${draftTp.text.slice(0, 60)}`);

      // Update local data so UI reflects without a full reload
      entry.tp.text   = draftTp.text;
      entry.tp.system = draftTp.system;
      entry.tp.actor  = draftTp.actor;
      entry.tp.timing = draftTp.timing || undefined;
      entry.tp.extra  = draftTp.extra  || undefined;
      entry.tp.data   = cleanData.length ? cleanData : undefined;
      entry.tp.assets = cleanAssets.length ? cleanAssets : undefined;

      // Re-render the affected card in place + redraw connectors
      // so the dashboard reflects the change without a browser refresh
      rerenderRailNode(activeTpId);
      if (typeof drawConnectors === "function") drawConnectors();
      markDirty(false);
      setStatus("Salvato. Netlify ridepoia tra ~30s.", "success");
      setTimeout(() => setStatus(""), 4500);
    } catch (err) {
      console.error(err);
      setStatus("Errore: " + (err.message || err), "error");
    } finally {
      editSaveBtn.disabled = !isDirty;
      editCancelBtn.disabled = false;
    }
  }

  // Find the touchpoint in the journey JSON by re-resolving its position.
  // Multi-channel data: phases live under channels[currentChannel].operativo.phases
  // (falls back to legacy single-channel layout if journey.phases exists.)
  function findTouchpointInJourney(journey, tpId, entry) {
    const op = journey.channels && journey.channels[currentChannel] && journey.channels[currentChannel].operativo;
    const phases = (op && op.phases) || journey.phases || [];
    const phase = phases.find(p => p.n === entry.phase.n);
    if (!phase) return null;
    const matchText = entry.tp.text;
    if (phase.touchpoints) {
      const t = phase.touchpoints.find(x => x.text === matchText);
      if (t) return t;
    }
    if (phase.streams) {
      for (const s of phase.streams) {
        const t = (s.touchpoints || []).find(x => x.text === matchText);
        if (t) return t;
      }
    }
    return null;
  }

  const colEls = [...document.querySelectorAll("#phasesRow > .col, #phasesRow > .col-fork")];
  const ratios = new Map();
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => ratios.set(entry.target.id, entry.intersectionRatio));
    let bestId = null, bestR = 0;
    ratios.forEach((r, id) => { if (r > bestR) { bestR = r; bestId = id; } });
    pills.forEach(p => p.classList.toggle("active",
      bestId && p.dataset.target === bestId && bestR > 0.05));
  }, { root: scrollArea, threshold: [0, 0.25, 0.5, 0.75, 1] });
  colEls.forEach(el => observer.observe(el));

  function drawConnectors() {
    const svg = document.getElementById("connector");
    svg.setAttribute("width", track.scrollWidth);
    svg.setAttribute("height", track.scrollHeight);
    [...svg.querySelectorAll("path.link")].forEach(n => n.remove());
    [...track.querySelectorAll(".phase-outcome")].forEach(n => n.remove());

    // Single horizontal line for all connectors at ~½ of the shortest column,
    // so the outcome chip floats between phases at column mid-height.
    const minColH = Math.min(...colEls.map(c => c.offsetHeight));
    const baseY = Math.floor(minColH / 2);

    function drawArrowLine(x1, y1, x2, y2) {
      if (x2 - x1 < 4) return; // too short to bother
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
      path.setAttribute("class", "link");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#A89060");
      path.setAttribute("stroke-width", "1");
      path.setAttribute("opacity", "0.55");
      path.setAttribute("marker-end", "url(#arrowhead)");
      svg.appendChild(path);
    }

    for (let i = 0; i < colEls.length - 1; i++) {
      const a = colEls[i];
      const b = colEls[i + 1];
      const ax = a.offsetLeft + a.offsetWidth;
      const bx = b.offsetLeft;
      const y = a.offsetTop + baseY;
      const midX = (ax + bx) / 2;

      const phase = phases[i];
      const next = phases[i + 1];
      const hasChip = !!(phase.outcome || (phase.leads != null && next.leads != null));

      let chipLeftEdge = midX, chipRightEdge = midX;

      if (hasChip) {
        // Create + position the chip
        const label = document.createElement("div");
        label.className = "phase-outcome";
        label.style.left = midX + "px";
        label.style.top = y + "px";

        if (phase.outcome) {
          const span = document.createElement("span");
          span.textContent = phase.outcome;
          label.appendChild(span);
        }
        if (phase.leads != null && next.leads != null && phase.leads > 0) {
          const delta = next.leads - phase.leads;
          if (delta !== 0) {
            const pct = Math.round((delta / phase.leads) * 100);
            const sign = delta > 0 ? "+" : "−";
            const deltaEl = document.createElement("span");
            deltaEl.className = "outcome-delta " + (delta > 0 ? "positive" : "negative");
            deltaEl.textContent = `${sign}${formatLeads(Math.abs(delta))} lead · ${sign}${Math.abs(pct)}%`;
            label.appendChild(deltaEl);
          }
        }
        track.appendChild(label);

        // Measure the chip (synchronous layout via offsetWidth)
        const chipW = label.offsetWidth;
        chipLeftEdge  = midX - chipW / 2;
        chipRightEdge = midX + chipW / 2;
      }

      // Arrows removed — only the outcome chip stays as the inter-phase signal.
    }
  }

  window.addEventListener("load", drawConnectors);
  window.addEventListener("resize", drawConnectors);
  setTimeout(drawConnectors, 200);
  setTimeout(drawConnectors, 800);
  setTimeout(drawConnectors, 2000);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawConnectors);

  // ============================================================
  // MULTI-CHANNEL DATA LOADER + ROUTING
  // ============================================================
  let CHANNELS = {};               // populated from journey.json
  let currentChannel = "retail";
  let currentView    = "operativo";

  const VIEWS = [
    { key: "operativo", label: "Operativo", icon: "ti-list-tree" },

  function renderChannelSwitcher() {

    el.innerHTML = Object.entries(CHANNELS).map(([key, ch]) => `
      <button type="button" role="tab" data-channel="${key}"

    el.innerHTML = VIEWS.map(v => {
      const has = ch && ch[v.key];
      return `<button type="button" role="tab" data-view="${v.key}"

        if (b.disabled) return;
        navigateTo(currentChannel, b.dataset.view);
      });

  function parseHash() {
    const m = (location.hash || "").match(/^#\/([^/]+)(?:\/([^/]+))?/);
    return {
      channel: m && CHANNELS[m[1]] ? m[1] : "retail",
      view:    m && VIEWS.find(v => v.key === m[2]) ? m[2] : "operativo",
    };
  }

  function navigateTo(channel, view) {
    const newHash = `#/${channel}/${view}`;
    if (location.hash === newHash) return;
    location.hash = newHash;
    // Full reload — keeps bootDashboard idempotent without a big refactor.
    // Iterate to SPA-style navigation later if needed.
    location.reload();
  }

  function applyRoute() {
    const { channel, view } = parseHash();
    currentChannel = channel;
    currentView    = view;
    renderChannelSwitcher();
    renderViewSwitcher();
    showCurrentView();
  }

  // Updates brand subtitle ("Journey Retail · Operativo Natale 2026")
  function updateBrandSubtitle() {
    const ch = CHANNELS[currentChannel];
    if (!ch) return;

    document.getElementById("brandKicker").textContent = `Journey ${ch.label}`;

  function clearTrack() {
    const track = document.getElementById("track");
    // Keep the SVG defs
    [...track.querySelectorAll(".phases-row, .lane, .phase-outcome")].forEach(n => n.remove());
    const svg = document.getElementById("connector");
    if (svg) [...svg.querySelectorAll("path.link")].forEach(n => n.remove());

  function showCurrentView() {
    updateBrandSubtitle();
    const ch = CHANNELS[currentChannel];
    const viewData = ch && ch[currentView];

    const emptyEl    = document.getElementById("emptyState");
    const scrollArea = document.getElementById("scrollArea");
    const track      = document.getElementById("track");

    if (!viewData) {
      // Empty state
      clearTrack();
      track.style.display = "none";
      emptyEl.hidden = false;
      const isActive = ch && ch.active;
      const view = VIEWS.find(v => v.key === currentView);
      document.getElementById("emptyIcon").className =
        "ti " + (isActive ? "ti-tool" : (ch && ch.icon) || "ti-circle");
      document.getElementById("emptyTitle").textContent = isActive
        ? `Vista "${view ? view.label : currentView}" da costruire`
        : `${ch ? ch.label : "Canale"} · da configurare`;
      document.getElementById("emptyText").textContent = isActive
        ? "Questa vista non è ancora stata sviluppata per questo canale."
        : `Il canale ${ch ? ch.label : ""} sarà attivato quando avremo i contenuti.`;
      return;
    }

    // Has data → render
    emptyEl.hidden = true;
    track.style.display = "";

    if (currentView === "operativo") {
      // Reuse the existing dashboard pipeline
      phases = viewData.phases || [];
      laura  = viewData.laura  || {};
      dems   = viewData.dems   || {};
      bootDashboard();
    } else {
      // Customer / Timeline — placeholder until commits 2 & 3
      clearTrack();
      emptyEl.hidden = false;
      const view = VIEWS.find(v => v.key === currentView);
      document.getElementById("emptyIcon").className = "ti ti-tool";
      document.getElementById("emptyTitle").textContent = `Vista "${view.label}" in arrivo`;
      document.getElementById("emptyText").textContent = "La sto costruendo. Per ora resta solo l'Operativo.";
    }
  }

  // ============================================================
  // LOAD JOURNEY DATA (data/journey.json), THEN BOOT
  // ============================================================
  fetch("data/journey.json", { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(data => {
      CHANNELS = data.channels || {};
      window.addEventListener("hashchange", applyRoute);
      applyRoute();
    })
    .catch(err => {
      console.error("Failed to load data/journey.json:", err);
      document.body.innerHTML = `<div style="padding:60px;font-family:sans-serif;color:#7A3920;max-width:520px;margin:0 auto">
        <h2 style="font-family:Georgia,serif">Dati non caricati</h2>
        <p>Impossibile leggere <code>data/journey.json</code>. Serve un server HTTP — apri la dashboard via Netlify o avvia in locale con <code>python3 -m http.server</code>.</p>
        <p style="font-size:12px;color:#666">${err.message}</p>
      </div>`;
    });
</script>
</body>
</html>
