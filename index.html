<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasticceria Giotto — Customer Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8843a;
      --gold-light: #f5ede0;
      --gold-mid: #e8d5b0;
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e6e3dc;
      --border-strong: #d0ccc3;
      --text-primary: #141413;
      --text-secondary: #6b6860;
      --text-muted: #a8a49d;
      --header-bg: #ffffff;
      --header-text: #141413;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.05);
      --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 14px; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─────────────────────────────────── */
    .header {
      padding: 40px 52px 0;
      background: #fff;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .logo-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ─── TABS ───────────────────────────────────── */
    .tabs-bar {
      display: flex;
      gap: 0;
      padding-top: 20px;
    }

    .tab {
      position: relative;
      padding: 0 0 14px;
      margin-right: 28px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--transition);
      white-space: nowrap;
      letter-spacing: -0.1px;
    }

    .tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background: var(--text-primary);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .tab:hover { color: var(--text-secondary); }

    .tab.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .tab.active::after { opacity: 1; }

    .persona-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 560px;
      margin-bottom: 36px;
    }

    /* ─── CANVAS ─────────────────────────────────── */
    .canvas {
      padding: 44px 52px 80px;
      overflow-x: auto;
      min-height: calc(100vh - 160px);
    }

    .canvas::-webkit-scrollbar { height: 4px; }
    .canvas::-webkit-scrollbar-track { background: transparent; }
    .canvas::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    /* ─── FLOW ───────────────────────────────────── */
    .flow {
      display: flex;
      align-items: stretch;
      gap: 0;
      min-width: max-content;
      padding-bottom: 8px;
    }

    /* ─── CONNECTOR ──────────────────────────────── */
    .connector {
      display: flex;
      align-items: center;
      padding-top: 28px;
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 42px;
    }

    .connector-inner {
      position: relative;
      width: 32px;
      height: 1px;
      background: var(--border-strong);
    }

    .connector-inner::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -3.5px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid var(--border-strong);
    }

    /* ─── STAGE WRAP ─────────────────────────────── */
    .stage-wrap {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .stage-wrap .card {
      flex: 1;
    }

    /* ─── STAGE LABEL ────────────────────────────── */
    .stage-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.15px;
      line-height: 1.35;
      margin-bottom: 10px;
      padding-left: 2px;
      max-width: 210px;
    }

    /* ─── CARD ───────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 210px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), border-color var(--transition);
      overflow: hidden;
    }

    .card:hover { box-shadow: var(--shadow-md); }

    .card.is-expanded {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-light), var(--shadow-md);
    }

    .card.is-persona {
      border-style: solid;
      border-radius: var(--radius-lg);
    }

    /* ─── CARD FOOTER ────────────────────────────── */
    .card-footer {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-top: 1px solid var(--border);
      user-select: none;
      transition: background var(--transition);
    }

    .card-footer:hover { background: #fafaf8; }

    .card-footer-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ─── CARD EMPTY (no sub-stages) ────────────── */
    .card-empty {
      padding: 18px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }

    .card-empty:hover { background: #fafaf8; }

    .card-empty-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge {
      height: 16px;
      min-width: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--gold);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .chevron-btn {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .chevron-btn:hover { background: var(--bg); color: var(--text-primary); }

    .chevron-icon {
      display: block;
      transition: transform var(--transition);
      font-size: 10px;
      line-height: 1;
    }

    .chevron-icon.open { transform: rotate(180deg); }

    /* ─── SUB-STAGES LIST ────────────────────────── */
    .sub-list {
      padding: 0 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* ─── SUB-STAGE ──────────────────────────────── */
    .sub-item {
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color var(--transition), background var(--transition);
    }

    .sub-item:hover { border-color: var(--gold-mid); background: #fdfcfa; }
    .sub-item.is-muted { opacity: 0.55; }
    .sub-item.is-expanded { border-color: var(--gold); border-style: solid; background: #fffdf9; }

    .sub-header {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 6px;
    }

    .sub-title {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .sub-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    /* ─── DIVIDER ────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0;
    }

    /* ─── EXPAND PANEL ───────────────────────────── */
    .panel {
      padding: 14px;
      background: #fafaf8;
      animation: slideDown 0.18s cubic-bezier(0.4,0,0.2,1);
    }

    .panel.sub { padding: 10px; background: transparent; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .notes {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text-primary);
      resize: vertical;
      min-height: 60px;
      background: var(--surface);
      outline: none;
      line-height: 1.55;
      transition: border-color var(--transition);
    }

    .notes::placeholder { color: var(--text-muted); }
    .notes:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-light); }

    /* ─── UPLOAD ─────────────────────────────────── */
    .upload-zone {
      margin-top: 10px;
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      background: var(--surface);
      text-align: center;
    }

    .upload-zone:hover {
      border-color: var(--gold);
      background: var(--gold-light);
    }

    .upload-zone-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-bottom: 2px;
      transition: background var(--transition);
    }

    .upload-zone:hover .upload-zone-icon { background: var(--gold-mid); }

    .upload-zone-text {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .upload-zone-text strong { color: var(--gold); font-weight: 600; }

    input[type="file"] { display: none; }

    /* ─── FILES GRID ─────────────────────────────── */
    .files-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .file-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .file-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }

    .file-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .file-card-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-size: 22px;
    }

    .file-card-footer {
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      border-top: 1px solid var(--border);
    }

    .file-card-name {
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .file-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(20,20,19,0.6);
      color: #fff;
      font-size: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition);
      backdrop-filter: blur(4px);
    }

    .file-card:hover .file-remove { opacity: 1; }

    /* ─── SUB-STAGE MODAL ───────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20,20,19,0.45);
      z-index: 300;
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      backdrop-filter: blur(3px);
      animation: fadeIn 0.2s ease;
    }

    .modal {
      width: 100%;
      max-width: 900px;
      background: #fff;
      display: flex;
      flex-direction: column;
      animation: slideInRight 0.22s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden;
    }

    @keyframes slideInRight {
      from { transform: translateX(40px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .modal-header {
      padding: 24px 36px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-shrink: 0;
    }

    .modal-breadcrumb {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-breadcrumb-sep { opacity: 0.4; }

    .modal-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition);
      margin-top: 4px;
    }

    .modal-close:hover { background: var(--bg); color: var(--text-primary); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 340px;
    }

    .modal-col {
      padding: 32px 36px;
      overflow-y: auto;
    }

    .modal-col + .modal-col {
      border-left: 1px solid var(--border);
      background: #fafaf8;
    }

    .modal-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Activities */
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      transition: border-color var(--transition);
    }

    .activity-item:focus-within { border-color: var(--gold); }

    .activity-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .activity-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: transparent;
      line-height: 1.4;
    }

    .activity-input::placeholder { color: var(--text-muted); }

    .activity-del {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      opacity: 0;
      transition: opacity var(--transition), background var(--transition);
      flex-shrink: 0;
    }

    .activity-item:hover .activity-del { opacity: 1; }
    .activity-del:hover { background: #fee2e2; color: #dc2626; }

    .add-activity-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-md);
      background: transparent;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
      width: 100%;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
    }

    .add-activity-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }

    .modal-divider { height: 1px; background: var(--border); margin: 28px 0; }

    /* ─── LIGHTBOX ───────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--radius-md);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }

    .lightbox-close:hover { background: rgba(255,255,255,0.15); }

    /* ─── SCROLLBAR ─────────────────────────────── */
    .canvas::-webkit-scrollbar { height: 4px; }
    .canvas::-webkit-scrollbar-track { background: transparent; }
    .canvas::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  </style>
</head>

        {
          id: "prospect", title: "Prospect",
          subStages: [
            { id: "fiera-b", title: "Incontro in fiera o evento di settore" },
            { id: "referral-b", title: "Referral da altro cliente B2B" },
            { id: "outbound", title: "Contatto outbound del team sales" },
            { id: "inbound", title: "Richiesta inbound dal sito" }
          ]
        },
        {
          id: "trattativa", title: "In trattativa",
          subStages: [
            { id: "demo", title: "Richiesta campioni / degustazione" },
            { id: "offerta", title: "Riceve offerta commerciale" }
          ]
        },
        { id: "primo-ordine", title: "Primo ordine B2B", subStages: [] },
        {
          id: "cliente-b", title: "Cliente B2B attivo",
          subStages: [
            { id: "riordino", title: "Riordino regolare" },
            { id: "upsell", title: "Espansione ordini / upsell" },
            { id: "churned", title: "Cliente perso", muted: true }
          ]
        }
      ]
    },
    retail: {
      label: "Retail / GDO",
      stages: [
        {
          id: "persona-r", title: "CHI?", isPersona: true,
          description: "Consumatore che acquista prodotti PG tramite la grande distribuzione o rivenditori specializzati. Non conosce necessariamente il brand.",
          subStages: []
        },
        {
          id: "esposizione", title: "Esposizione al prodotto",
          subStages: [
            { id: "scaffale", title: "Vede il prodotto sullo scaffale" },
            { id: "promo-r", title: "Trova una promozione in store" },
            { id: "volantino", title: "Scopre tramite volantino GDO" },
            { id: "adv", title: "Vede pubblicità / ADV" }
          ]
        },
        {
          id: "considerazione", title: "Considerazione",
          subStages: [
            { id: "confronto", title: "Confronta con brand concorrenti" },
            { id: "recensioni", title: "Cerca recensioni online" }
          ]
        },
        {
          id: "acquisto-r", title: "Acquisto al punto vendita",
          subStages: [
            { id: "acquistato-r", title: "Ha acquistato", muted: true },
            { id: "preferito-altro", title: "Ha preferito un altro brand", muted: true }
          ]
        },
        {
          id: "riacquisto", title: "Riacquisto e fedeltà",
          subStages: [
            { id: "ripetuto", title: "Acquisto ripetuto" },
            { id: "cerca-online", title: "Cerca il brand online → DTC" }
          ]
        }
      ]
    }
  };

  const JOURNEY_KEYS = Object.keys(JOURNEYS);

  /* ─── UTILS ──────────────────────────────────── */
  const fileIcon = t =>
    t.startsWith('image/') ? '🖼' :
    t === 'application/pdf' ? '📄' :
    t.includes('presentation') || t.includes('powerpoint') ? '📊' :
    t.includes('word') ? '📝' : '📎';

  const readFile = f => new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(f);
  });

  const lsGet = key => { try { return JSON.parse(localStorage.getItem(key)) ?? null; } catch { return null; } };
  const lsSet = (key, val) => localStorage.setItem(key, JSON.stringify(val));

  /* ─── UPLOAD ZONE ────────────────────────────── */
  function UploadZone({ files, onAdd, onRemove, onPreview }) {
    const ref = useRef();

    const handle = useCallback(async list => {
      for (const f of list) { const url = await readFile(f); onAdd({ name: f.name, type: f.type, url }); }
    }, [onAdd]);

    return (
      <>
        {files.length > 0 && (
          <div className="files-grid">
            {files.map((f, i) => (
              <div key={i} className="file-card" onClick={() => f.type.startsWith('image/') && onPreview(f.url)}>
                {f.type.startsWith('image/')
                  ? <img src={f.url} alt={f.name} />
                  : <div className="file-card-placeholder">{fileIcon(f.type)}</div>}
                <div className="file-card-footer">
                  <span className="file-card-name" title={f.name}>{f.name}</span>
                </div>
                <button className="file-remove" onClick={e => { e.stopPropagation(); onRemove(i); }}>✕</button>
              </div>
            ))}
          </div>
        )}
        <div
          className="upload-zone"
          onClick={() => ref.current.click()}
          onDrop={e => { e.preventDefault(); handle([...e.dataTransfer.files]); }}
          onDragOver={e => e.preventDefault()}
        >
          <div className="upload-zone-icon">↑</div>
          <div className="upload-zone-text">
            <strong>Carica materiali</strong><br />
            Immagini, PDF, presentazioni
          </div>
        </div>
        <input ref={ref} type="file" multiple accept="image/*,.pdf,.ppt,.pptx,.doc,.docx"
          onChange={e => handle([...e.target.files])} />
      </>
    );
  }

  /* ─── EXPAND PANEL ───────────────────────────── */
  function ExpandPanel({ storeKey, isSub, lightboxSet }) {
    const [notes, setNotes] = useState(() => lsGet(`n_${storeKey}`) ?? '');
    const [files, setFiles] = useState(() => lsGet(`f_${storeKey}`) ?? []);

    useEffect(() => lsSet(`n_${storeKey}`, notes), [notes, storeKey]);
    useEffect(() => lsSet(`f_${storeKey}`, files), [files, storeKey]);

    const addFile = useCallback(f => setFiles(p => [...p, f]), []);
    const removeFile = useCallback(i => setFiles(p => p.filter((_, j) => j !== i)), []);

    return (
      <div className={`panel${isSub ? ' sub' : ''}`}>
        <div className="panel-label">Note</div>
        <textarea className="notes" placeholder="Obiettivi, KPI, note strategiche…"
          value={notes} onChange={e => setNotes(e.target.value)} />
        <div className="panel-label" style={{marginTop:10}}>Creatività e materiali</div>
        <UploadZone files={files} onAdd={addFile} onRemove={removeFile} onPreview={lightboxSet} />
      </div>
    );
  }

  /* ─── SUB MODAL ──────────────────────────────── */
  function SubModal({ sub, stageTitle, journeyLabel, sk, onClose }) {
    const [activities, setActivities] = useState(() => lsGet(`act_${sk}`) ?? []);
    const [notes, setNotes]           = useState(() => lsGet(`n_${sk}`)   ?? '');
    const [files, setFiles]           = useState(() => lsGet(`f_${sk}`)   ?? []);
    const [lightbox, setLightbox]     = useState(null);

    useEffect(() => lsSet(`act_${sk}`, activities), [activities, sk]);
    useEffect(() => lsSet(`n_${sk}`,   notes),      [notes, sk]);
    useEffect(() => lsSet(`f_${sk}`,   files),      [files, sk]);

    // close on Escape
    useEffect(() => {
      const h = e => e.key === 'Escape' && onClose();
      window.addEventListener('keydown', h);
      return () => window.removeEventListener('keydown', h);
    }, [onClose]);

    const addActivity = () => setActivities(p => [...p, '']);
    const updateActivity = (i, val) => setActivities(p => p.map((a, j) => j === i ? val : a));
    const deleteActivity = i => setActivities(p => p.filter((_, j) => j !== i));

    const addFile = useCallback(async f => {
      const url = await readFile(f);
      setFiles(p => [...p, { name: f.name, type: f.type, url }]);
    }, []);
    const removeFile = i => setFiles(p => p.filter((_, j) => j !== i));

    const fileRef = useRef();

    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal" onClick={e => e.stopPropagation()}>

          {/* Header */}
          <div className="modal-header">
            <div>
              <div className="modal-breadcrumb">
                <span>{journeyLabel}</span>
                <span className="modal-breadcrumb-sep">›</span>
                <span>{stageTitle}</span>
              </div>
              <div className="modal-title">{sub.title}</div>
            </div>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>

          {/* Body */}
          <div className="modal-body">

            {/* Left: activities + notes */}
            <div className="modal-col">
              <div className="modal-section-title">Attività</div>
              <div className="activity-list">
                {activities.map((act, i) => (
                  <div key={i} className="activity-item">
                    <div className="activity-dot" />
                    <input
                      className="activity-input"
                      placeholder="Descrivi l'attività…"
                      value={act}
                      onChange={e => updateActivity(i, e.target.value)}
                      autoFocus={i === activities.length - 1 && act === ''}
                    />
                    <button className="activity-del" onClick={() => deleteActivity(i)}>✕</button>
                  </div>
                ))}
              </div>
              <button className="add-activity-btn" onClick={addActivity}>
                <span style={{fontSize:16, lineHeight:1}}>+</span> Aggiungi attività
              </button>

              <div className="modal-divider" />

              <div className="modal-section-title">Note</div>
              <textarea
                className="notes"
                style={{minHeight:120, width:'100%'}}
                placeholder="Obiettivi, KPI, note strategiche…"
                value={notes}
                onChange={e => setNotes(e.target.value)}
              />
            </div>

            {/* Right: assets */}
            <div className="modal-col">
              <div className="modal-section-title">Asset e materiali</div>

              {files.length > 0 && (
                <div className="files-grid" style={{marginBottom:12}}>
                  {files.map((f, i) => (
                    <div key={i} className="file-card"
                      onClick={() => f.type.startsWith('image/') && setLightbox(f.url)}>
                      {f.type.startsWith('image/')
                        ? <img src={f.url} alt={f.name} />
                        : <div className="file-card-placeholder">{fileIcon(f.type)}</div>}
                      <div className="file-card-footer">
                        <span className="file-card-name" title={f.name}>{f.name}</span>
                      </div>
                      <button className="file-remove"
                        onClick={e => { e.stopPropagation(); removeFile(i); }}>✕</button>
                    </div>
                  ))}
                </div>
              )}

              <div
                className="upload-zone"
                onClick={() => fileRef.current.click()}
                onDrop={e => { e.preventDefault(); [...e.dataTransfer.files].forEach(addFile); }}
                onDragOver={e => e.preventDefault()}
              >
                <div className="upload-zone-icon">↑</div>
                <div className="upload-zone-text">
                  <strong>Carica materiali</strong><br />
                  Immagini, PDF, presentazioni
                </div>
              </div>
              <input ref={fileRef} type="file" multiple
                accept="image/*,.pdf,.ppt,.pptx,.doc,.docx"
                onChange={e => [...e.target.files].forEach(addFile)} />
            </div>
          </div>
        </div>

        {lightbox && (
          <div className="lightbox" onClick={() => setLightbox(null)}
            style={{zIndex:400}}>
            <button className="lightbox-close" onClick={() => setLightbox(null)}>✕</button>
            <img className="lightbox-img" src={lightbox} alt="preview"
              onClick={e => e.stopPropagation()} />
          </div>
        )}
      </div>
    );
  }

  /* ─── SUB STAGE ──────────────────────────────── */
  function SubStage({ sub, sk, stageTitle, journeyLabel, onOpenModal }) {
    const actCount  = (lsGet(`act_${sk}`) ?? []).filter(a => a.trim()).length;
    const fileCount = (lsGet(`f_${sk}`)   ?? []).length;
    const hasContent = actCount > 0 || fileCount > 0;

    return (
      <div className={`sub-item${sub.muted ? ' is-muted' : ''}`}
        onClick={() => onOpenModal({ sub, stageTitle, sk })}>
        <div className="sub-header">
          <span className="sub-title">{sub.title}</span>
          <div className="sub-actions">
            {hasContent && <span className="badge">{actCount + fileCount}</span>}
            <span style={{fontSize:9, color:'var(--text-muted)'}}>→</span>
          </div>
        </div>
      </div>
    );
  }

  /* ─── STAGE CARD ─────────────────────────────── */
  function StageCard({ stage, journeyKey, journeyLabel, onOpenModal }) {
    return (
      <div className="stage-wrap">
        <div className="stage-label">{stage.title}</div>
        <div className="card">
          {stage.subStages.length > 0 ? (
            <div className="sub-list">
              {stage.subStages.map(sub => (
                <SubStage
                  key={sub.id}
                  sub={sub}
                  sk={`${journeyKey}_${stage.id}_${sub.id}`}
                  stageTitle={stage.title}
                  journeyLabel={journeyLabel}
                  onOpenModal={onOpenModal}
                />
              ))}
            </div>
          ) : (
            <div className="card-empty"
              onClick={() => onOpenModal({ sub: stage, stageTitle: stage.title, sk: `${journeyKey}_${stage.id}` })}>
              <span className="card-empty-text">Apri →</span>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ─── APP ────────────────────────────────────── */
  function App() {
    const [active, setActive]   = useState('ecommerce');
    const [modal, setModal]     = useState(null); // { sub, stageTitle, sk }
    const journey = JOURNEYS[active];

    const openModal  = useCallback(info => setModal(info), []);
    const closeModal = useCallback(() => setModal(null), []);

    return (
      <>
        <header className="header">
          <div className="header-top">
            <div className="logo">
              <span className="logo-text">Pasticceria Giotto</span>
              <span className="logo-sub">Customer Journey</span>
            </div>
          </div>
          <div className="tabs-bar">
            {JOURNEY_KEYS.map(key => (
              <button
                key={key}
                className={`tab${active === key ? ' active' : ''}`}
                onClick={() => setActive(key)}
              >
                {JOURNEYS[key].label}
              </button>
            ))}
          </div>
        </header>

        <main className="canvas">
          {journey.stages.filter(s => s.isPersona).map(s => (
            <p key={s.id} className="persona-text">{s.description}</p>
          ))}
          <div className="flow">
            {journey.stages.filter(s => !s.isPersona).map((stage, i) => (
              <React.Fragment key={stage.id}>
                {i > 0 && (
                  <div className="connector">
                    <div className="connector-inner" />
                  </div>
                )}
                <StageCard
                  stage={stage}
                  journeyKey={active}
                  journeyLabel={journey.label}
                  onOpenModal={openModal}
                />
              </React.Fragment>
            ))}
          </div>
        </main>

        {modal && (
          <SubModal
            sub={modal.sub}
            stageTitle={modal.stageTitle}
            journeyLabel={journey.label}
            sk={modal.sk}
            onClose={closeModal}
          />
        )}
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
