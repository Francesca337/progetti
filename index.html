<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasticceria Giotto — Customer Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8843a;
      --gold-light: #f5ede0;
      --gold-mid: #e8d5b0;
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e6e3dc;
      --border-strong: #d0ccc3;
      --text-primary: #141413;
      --text-secondary: #6b6860;
      --text-muted: #a8a49d;
      --header-bg: #ffffff;
      --header-text: #141413;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.05);
      --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 14px; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─────────────────────────────────── */
    .header {
      padding: 40px 52px 0;
      background: #fff;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .logo-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ─── TABS ───────────────────────────────────── */
    .tabs-bar {
      display: flex;
      gap: 0;
      padding-top: 20px;
    }

    .tab {
      position: relative;
      padding: 0 0 14px;
      margin-right: 28px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--transition);
      white-space: nowrap;
      letter-spacing: -0.1px;
    }

    .tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background: var(--text-primary);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .tab:hover { color: var(--text-secondary); }

    .tab.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .tab.active::after { opacity: 1; }

    /* ─── CANVAS ─────────────────────────────────── */
    .canvas {
      padding: 44px 52px 80px;
      overflow-x: auto;
      min-height: calc(100vh - 160px);
    }

    .canvas::-webkit-scrollbar { height: 4px; }
    .canvas::-webkit-scrollbar-track { background: transparent; }
    .canvas::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    /* ─── FLOW ───────────────────────────────────── */
    .flow {
      display: flex;
      align-items: flex-start;
      gap: 0;
      min-width: max-content;
      padding-bottom: 8px;
    }

    /* ─── CONNECTOR ──────────────────────────────── */
    .connector {
      display: flex;
      align-items: center;
      padding-top: 42px;
      flex-shrink: 0;
    }

    .connector-inner {
      position: relative;
      width: 32px;
      height: 1px;
      background: var(--border-strong);
    }

    .connector-inner::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -3.5px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid var(--border-strong);
    }

    /* ─── STAGE WRAP ─────────────────────────────── */
    .stage-wrap { flex-shrink: 0; }

    /* ─── STAGE NUMBER ───────────────────────────── */
    .stage-num {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 2px;
      text-transform: uppercase;
    }

    /* ─── CARD ───────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 210px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), border-color var(--transition);
      overflow: hidden;
    }

    .card:hover { box-shadow: var(--shadow-md); }

    .card.is-expanded {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-light), var(--shadow-md);
    }

    .card.is-persona {
      border-style: solid;
      border-radius: var(--radius-lg);
    }

    /* ─── CARD HEADER ────────────────────────────── */
    .card-header {
      padding: 14px 14px 12px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      user-select: none;
    }

    .card-header-body { flex: 1; min-width: 0; }

    .card-eyebrow {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      letter-spacing: -0.1px;
    }

    .card-desc {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-top: 6px;
      font-weight: 400;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .badge {
      height: 16px;
      min-width: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--gold);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .chevron-btn {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .chevron-btn:hover { background: var(--bg); color: var(--text-primary); }

    .chevron-icon {
      display: block;
      transition: transform var(--transition);
      font-size: 10px;
      line-height: 1;
    }

    .chevron-icon.open { transform: rotate(180deg); }

    /* ─── SUB-STAGES LIST ────────────────────────── */
    .sub-list {
      padding: 0 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* ─── SUB-STAGE ──────────────────────────────── */
    .sub-item {
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color var(--transition), background var(--transition);
    }

    .sub-item:hover { border-color: var(--gold-mid); background: #fdfcfa; }
    .sub-item.is-muted { opacity: 0.55; }
    .sub-item.is-expanded { border-color: var(--gold); border-style: solid; background: #fffdf9; }

    .sub-header {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 6px;
    }

    .sub-title {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .sub-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    /* ─── DIVIDER ────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0;
    }

    /* ─── EXPAND PANEL ───────────────────────────── */
    .panel {
      padding: 14px;
      background: #fafaf8;
      animation: slideDown 0.18s cubic-bezier(0.4,0,0.2,1);
    }

    .panel.sub { padding: 10px; background: transparent; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .notes {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text-primary);
      resize: vertical;
      min-height: 60px;
      background: var(--surface);
      outline: none;
      line-height: 1.55;
      transition: border-color var(--transition);
    }

    .notes::placeholder { color: var(--text-muted); }
    .notes:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-light); }

    /* ─── UPLOAD ─────────────────────────────────── */
    .upload-zone {
      margin-top: 10px;
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      background: var(--surface);
      text-align: center;
    }

    .upload-zone:hover {
      border-color: var(--gold);
      background: var(--gold-light);
    }

    .upload-zone-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-bottom: 2px;
      transition: background var(--transition);
    }

    .upload-zone:hover .upload-zone-icon { background: var(--gold-mid); }

    .upload-zone-text {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .upload-zone-text strong { color: var(--gold); font-weight: 600; }

    input[type="file"] { display: none; }

    /* ─── FILES GRID ─────────────────────────────── */
    .files-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .file-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .file-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }

    .file-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .file-card-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-size: 22px;
    }

    .file-card-footer {
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      border-top: 1px solid var(--border);
    }

    .file-card-name {
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .file-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(20,20,19,0.6);
      color: #fff;
      font-size: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition);
      backdrop-filter: blur(4px);
    }

    .file-card:hover .file-remove { opacity: 1; }

    /* ─── LIGHTBOX ───────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--radius-md);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }

    .lightbox-close:hover { background: rgba(255,255,255,0.15); }

    /* ─── SCROLLBAR ─────────────────────────────── */
    .canvas::-webkit-scrollbar { height: 4px; }
    .canvas::-webkit-scrollbar-track { background: transparent; }
    .canvas::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useRef, useCallback, useEffect } = React;

  /* ═══════════════════════════════════════════════
     DATA
  ═══════════════════════════════════════════════ */
  const JOURNEYS = {
    ecommerce: {
      label: "E-commerce (DTC)",
      stages: [
        {
          id: "persona", title: "CHI?", isPersona: true,
          description: "Persona che vive in Italia, con capacità di spesa medio-alta e preferenze per prodotti di qualità. Ha già incontrato Pasticceria Giotto, ma non ha ancora un interesse attivo verso i prodotti ecommerce.",
          subStages: []
        },
        {
          id: "inattivo", title: "Inattivo, disinteressato",
          subStages: [
            { id: "contatto", title: "In contatto, non collegato" },
            { id: "cmilano", title: "Sta incontrando PG in C.Milano" },
            { id: "viaroma", title: "Sta incontrando PG in Via Roma" },
            { id: "casa", title: "Sta incontrando PG a casa (amici o regalo)" },
            { id: "hotel", title: "Sta incontrando PG in hotel o buffet" }
          ]
        },
        { id: "coinvolto", title: "Coinvolto e collegato", subStages: [] },
        { id: "valutando", title: "Sta valutando un acquisto e-commerce", subStages: [] },
        {
          id: "effettuando", title: "Sta effettuando l'acquisto su e-commerce",
          subStages: [
            { id: "acquistato", title: "Ha effettuato l'acquisto", muted: true },
            { id: "abbandonato", title: "Ha abbandonato l'acquisto", muted: true }
          ]
        }
      ]
    },
    store: {
      label: "Store",
      stages: [
        {
          id: "persona-s", title: "CHI?", isPersona: true,
          description: "Cliente che visita i punti vendita Pasticceria Giotto. Interessato all'esperienza in negozio, ai prodotti freschi e alla consulenza del personale.",
          subStages: []
        },
        {
          id: "scoperta", title: "Scoperta del brand",
          subStages: [
            { id: "passante", title: "Passa davanti al negozio" },
            { id: "consigliato", title: "Consigliato da amici o famiglia" },
            { id: "social-s", title: "Scoperto tramite social media" },
            { id: "evento-s", title: "Incontro in fiera o evento" }
          ]
        },
        { id: "prima-visita", title: "Prima visita in store", subStages: [] },
        {
          id: "acquisto-s", title: "Acquisto in store",
          subStages: [
            { id: "acquistato-s", title: "Ha effettuato l'acquisto", muted: true },
            { id: "uscito", title: "È uscito senza acquistare", muted: true }
          ]
        },
        {
          id: "fidelizzato", title: "Cliente fidelizzato",
          subStages: [
            { id: "ritorno", title: "Ritorna regolarmente" },
            { id: "ambassador", title: "Diventa ambassador del brand" }
          ]
        }
      ]
    },
    b2b: {
      label: "B2B",
      stages: [
        {
          id: "persona-b", title: "CHI?", isPersona: true,
          description: "Buyer o responsabile acquisti di hotel, ristoranti o aziende. Cerca prodotti di alta qualità per eventi, omaggi o fornitura continuativa.",
          subStages: []
        },
        {
          id: "prospect", title: "Prospect",
          subStages: [
            { id: "fiera-b", title: "Incontro in fiera o evento di settore" },
            { id: "referral-b", title: "Referral da altro cliente B2B" },
            { id: "outbound", title: "Contatto outbound del team sales" },
            { id: "inbound", title: "Richiesta inbound dal sito" }
          ]
        },
        {
          id: "trattativa", title: "In trattativa",
          subStages: [
            { id: "demo", title: "Richiesta campioni / degustazione" },
            { id: "offerta", title: "Riceve offerta commerciale" }
          ]
        },
        { id: "primo-ordine", title: "Primo ordine B2B", subStages: [] },
        {
          id: "cliente-b", title: "Cliente B2B attivo",
          subStages: [
            { id: "riordino", title: "Riordino regolare" },
            { id: "upsell", title: "Espansione ordini / upsell" },
            { id: "churned", title: "Cliente perso", muted: true }
          ]
        }
      ]
    },
    retail: {
      label: "Retail / GDO",
      stages: [
        {
          id: "persona-r", title: "CHI?", isPersona: true,
          description: "Consumatore che acquista prodotti PG tramite la grande distribuzione o rivenditori specializzati. Non conosce necessariamente il brand.",
          subStages: []
        },
        {
          id: "esposizione", title: "Esposizione al prodotto",
          subStages: [
            { id: "scaffale", title: "Vede il prodotto sullo scaffale" },
            { id: "promo-r", title: "Trova una promozione in store" },
            { id: "volantino", title: "Scopre tramite volantino GDO" },
            { id: "adv", title: "Vede pubblicità / ADV" }
          ]
        },
        {
          id: "considerazione", title: "Considerazione",
          subStages: [
            { id: "confronto", title: "Confronta con brand concorrenti" },
            { id: "recensioni", title: "Cerca recensioni online" }
          ]
        },
        {
          id: "acquisto-r", title: "Acquisto al punto vendita",
          subStages: [
            { id: "acquistato-r", title: "Ha acquistato", muted: true },
            { id: "preferito-altro", title: "Ha preferito un altro brand", muted: true }
          ]
        },
        {
          id: "riacquisto", title: "Riacquisto e fedeltà",
          subStages: [
            { id: "ripetuto", title: "Acquisto ripetuto" },
            { id: "cerca-online", title: "Cerca il brand online → DTC" }
          ]
        }
      ]
    }
  };

  const JOURNEY_KEYS = Object.keys(JOURNEYS);

  /* ─── UTILS ──────────────────────────────────── */
  const fileIcon = t =>
    t.startsWith('image/') ? '🖼' :
    t === 'application/pdf' ? '📄' :
    t.includes('presentation') || t.includes('powerpoint') ? '📊' :
    t.includes('word') ? '📝' : '📎';

  const readFile = f => new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(f);
  });

  const lsGet = key => { try { return JSON.parse(localStorage.getItem(key)) ?? null; } catch { return null; } };
  const lsSet = (key, val) => localStorage.setItem(key, JSON.stringify(val));

  /* ─── UPLOAD ZONE ────────────────────────────── */
  function UploadZone({ files, onAdd, onRemove, onPreview }) {
    const ref = useRef();

    const handle = useCallback(async list => {
      for (const f of list) { const url = await readFile(f); onAdd({ name: f.name, type: f.type, url }); }
    }, [onAdd]);

    return (
      <>
        {files.length > 0 && (
          <div className="files-grid">
            {files.map((f, i) => (
              <div key={i} className="file-card" onClick={() => f.type.startsWith('image/') && onPreview(f.url)}>
                {f.type.startsWith('image/')
                  ? <img src={f.url} alt={f.name} />
                  : <div className="file-card-placeholder">{fileIcon(f.type)}</div>}
                <div className="file-card-footer">
                  <span className="file-card-name" title={f.name}>{f.name}</span>
                </div>
                <button className="file-remove" onClick={e => { e.stopPropagation(); onRemove(i); }}>✕</button>
              </div>
            ))}
          </div>
        )}
        <div
          className="upload-zone"
          onClick={() => ref.current.click()}
          onDrop={e => { e.preventDefault(); handle([...e.dataTransfer.files]); }}
          onDragOver={e => e.preventDefault()}
        >
          <div className="upload-zone-icon">↑</div>
          <div className="upload-zone-text">
            <strong>Carica materiali</strong><br />
            Immagini, PDF, presentazioni
          </div>
        </div>
        <input ref={ref} type="file" multiple accept="image/*,.pdf,.ppt,.pptx,.doc,.docx"
          onChange={e => handle([...e.target.files])} />
      </>
    );
  }

  /* ─── EXPAND PANEL ───────────────────────────── */
  function ExpandPanel({ storeKey, isSub, lightboxSet }) {
    const [notes, setNotes] = useState(() => lsGet(`n_${storeKey}`) ?? '');
    const [files, setFiles] = useState(() => lsGet(`f_${storeKey}`) ?? []);

    useEffect(() => lsSet(`n_${storeKey}`, notes), [notes, storeKey]);
    useEffect(() => lsSet(`f_${storeKey}`, files), [files, storeKey]);

    const addFile = useCallback(f => setFiles(p => [...p, f]), []);
    const removeFile = useCallback(i => setFiles(p => p.filter((_, j) => j !== i)), []);

    return (
      <div className={`panel${isSub ? ' sub' : ''}`}>
        <div className="panel-label">Note</div>
        <textarea className="notes" placeholder="Obiettivi, KPI, note strategiche…"
          value={notes} onChange={e => setNotes(e.target.value)} />
        <div className="panel-label" style={{marginTop:10}}>Creatività e materiali</div>
        <UploadZone files={files} onAdd={addFile} onRemove={removeFile} onPreview={lightboxSet} />
      </div>
    );
  }

  /* ─── SUB STAGE ──────────────────────────────── */
  function SubStage({ sub, sk, lightboxSet }) {
    const [open, setOpen] = useState(false);
    const count = (lsGet(`f_${sk}`) ?? []).length;
    return (
      <div className={`sub-item${sub.muted ? ' is-muted' : ''}${open ? ' is-expanded' : ''}`}>
        <div className="sub-header" onClick={() => setOpen(x => !x)}>
          <span className="sub-title">{sub.title}</span>
          <div className="sub-actions">
            {count > 0 && <span className="badge">{count}</span>}
            <span style={{fontSize:9, color:'var(--text-muted)', transition:'transform .18s', transform: open ? 'rotate(180deg)' : 'none', display:'block'}}>▼</span>
          </div>
        </div>
        {open && <ExpandPanel storeKey={sk} isSub lightboxSet={lightboxSet} />}
      </div>
    );
  }

  /* ─── STAGE CARD ─────────────────────────────── */
  function StageCard({ stage, journeyKey, index, lightboxSet }) {
    const [open, setOpen] = useState(false);
    const count = (lsGet(`f_${journeyKey}_${stage.id}`) ?? []).length;
    const isPersona = stage.isPersona;

    return (
      <div className="stage-wrap">
        {!isPersona && (
          <div className="stage-num">Fase {index}</div>
        )}
        {isPersona && <div className="stage-num" style={{opacity:0}}>—</div>}

        <div className={`card${isPersona ? ' is-persona' : ''}${open ? ' is-expanded' : ''}`}>
          <div className="card-header" onClick={() => setOpen(x => !x)}>
            <div className="card-header-body">
              {isPersona && <div className="card-eyebrow">Persona</div>}
              <div className="card-title">{stage.title}</div>
              {isPersona && stage.description && (
                <div className="card-desc">{stage.description}</div>
              )}
            </div>
            <div className="card-actions">
              {count > 0 && <span className="badge">{count}</span>}
              <button className="chevron-btn"
                onClick={e => { e.stopPropagation(); setOpen(x => !x); }}>
                <span className={`chevron-icon${open ? ' open' : ''}`}>▼</span>
              </button>
            </div>
          </div>

          {stage.subStages.length > 0 && (
            <div className="sub-list">
              {stage.subStages.map(sub => (
                <SubStage
                  key={sub.id}
                  sub={sub}
                  sk={`${journeyKey}_${stage.id}_${sub.id}`}
                  lightboxSet={lightboxSet}
                />
              ))}
            </div>
          )}

          {open && (
            <>
              <div className="divider" />
              <ExpandPanel storeKey={`${journeyKey}_${stage.id}`} lightboxSet={lightboxSet} />
            </>
          )}
        </div>
      </div>
    );
  }

  /* ─── APP ────────────────────────────────────── */
  function App() {
    const [active, setActive] = useState('ecommerce');
    const [lightbox, setLightbox] = useState(null);
    const journey = JOURNEYS[active];
    let phaseIndex = 0;

    return (
      <>
        <header className="header">
          <div className="header-top">
            <div className="logo">
              <span className="logo-text">Pasticceria Giotto</span>
              <span className="logo-sub">Customer Journey</span>
            </div>
          </div>
          <div className="tabs-bar">
            {JOURNEY_KEYS.map(key => (
              <button
                key={key}
                className={`tab${active === key ? ' active' : ''}`}
                onClick={() => setActive(key)}
              >
                {JOURNEYS[key].label}
              </button>
            ))}
          </div>
        </header>

        <main className="canvas">
          <div className="flow">
            {journey.stages.map((stage, i) => {
              if (!stage.isPersona) phaseIndex++;
              return (
                <React.Fragment key={stage.id}>
                  {i > 0 && (
                    <div className="connector">
                      <div className="connector-inner" />
                    </div>
                  )}
                  <StageCard
                    stage={stage}
                    journeyKey={active}
                    index={phaseIndex}
                    lightboxSet={setLightbox}
                  />
                </React.Fragment>
              );
            })}
          </div>
        </main>

        {lightbox && (
          <div className="lightbox" onClick={() => setLightbox(null)}>
            <button className="lightbox-close" onClick={() => setLightbox(null)}>✕</button>
            <img className="lightbox-img" src={lightbox} alt="preview"
              onClick={e => e.stopPropagation()} />
          </div>
        )}
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
