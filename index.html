<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Retail — Pasticceria Giotto · Natale 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  /* ---------- BRAND TYPEFACES ---------- */
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Light.woff2") format("woff2");        font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-LightItalic.woff2") format("woff2");  font-weight:300; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Regular.woff2") format("woff2");      font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Italic.woff2") format("woff2");       font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Medium.woff2") format("woff2");       font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-MediumItalic.woff2") format("woff2"); font-weight:500; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Bold.woff2") format("woff2");         font-weight:700; font-style:normal; font-display:swap; }

  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Light.woff2") format("woff2");        font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-LightItalic.woff2") format("woff2");  font-weight:300; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Regular.woff2") format("woff2");      font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Italic.woff2") format("woff2");       font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Medium.woff2") format("woff2");       font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-MediumItalic.woff2") format("woff2"); font-weight:500; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Bold.woff2") format("woff2");         font-weight:700; font-style:normal; font-display:swap; }

  :root {
    --bg:          #FFFFFF;
    --card:        #FFFFFF;
    --card-soft:   #F7F6F2;
    --card-softer: #FBFAF7;

    --ink:         #0A0A0A;
    --ink-soft:    #232019;
    --ink-muted:   #6B655B;
    --ink-fade:    #B5B0A6;

    --gold:        #A89060;
    --gold-deep:   #8E7848;
    --gold-soft:   #D6C39A;
    --gold-pale:   #F4ECD8;

    --hairline:      rgba(20,18,14,0.10);
    --hairline-soft: rgba(20,18,14,0.05);
    --rule:          rgba(20,18,14,0.06);

    --actor-manual:  #7A3920;
    --actor-auto:    #8E7848;
    --actor-sched:   #4F6B2C;

    --sys-zoho:   #2A3D5C;  --sys-zoho-soft: #EAEEF4;
    --sys-wa:     #4A5A2A;  --sys-wa-soft:   #EEF1E1;
    --sys-mail:   #B36A1F;  --sys-mail-soft: #F8E9D3;
    --sys-man:    #B5421E;  --sys-man-soft:  #F8E0D0;
    --sys-ads:    #6757A0;  --sys-ads-soft:  #EFEAF4;
    --sys-log:    #6F6452;  --sys-log-soft:  #EFEBE2;

    --branch-yes:    #4F6B2C;  --branch-yes-bg:   #EFF2E2;
    --branch-maybe:  #A87A1E;  --branch-maybe-bg: #F6EBC8;
    --branch-no:     #9C4628;  --branch-no-bg:    #F6E0D2;

    --top-h: 72px;
    --bot-h: 48px;
    --col-w: 332px;
    --gap: 300px;

    --serif: "Gazpacho", Georgia, serif;
    --sans:  "Neue Montreal", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.5;
    font-weight: 400;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     TOP BAR
     ============================================================ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--top-h);
    background: var(--bg);
    color: var(--ink-soft);
    display: flex; align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid var(--hairline-soft);
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-right: 32px; flex-shrink: 0; }
  .wordmark {
    display: flex; flex-direction: column; align-items: center;
    line-height: 1;
    padding-right: 22px;
    border-right: 1px solid var(--hairline);
  }
  .wordmark .top, .wordmark .bot {
    font-family: var(--serif);
    font-size: 9px; letter-spacing: 5px;
    color: var(--gold-deep);
    font-weight: 400; text-transform: uppercase;
  }
  .wordmark .top { margin-bottom: 5px; }
  .wordmark .bot { margin-top: 5px; font-size: 7.5px; letter-spacing: 3.5px; }
  .wordmark .giotto {
    font-family: var(--serif);
    font-size: 21px; font-weight: 400;
    color: var(--ink);
    display: flex; align-items: center; gap: 6px;
  }
  .wordmark .giotto .bar { width: 1px; height: 15px; background: rgba(10,10,10,0.28); }
  .subtitle { display: flex; flex-direction: column; line-height: 1.3; }
  .subtitle .kicker {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--gold-deep);
    margin-bottom: 2px;
    font-weight: 400;
  }
  .subtitle .title {
    font-size: 12.5px;
    color: var(--ink-muted);
    letter-spacing: 0.3px;
    font-weight: 400;
  }
  .nav {
    display: flex; gap: 6px; overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
    padding: 0 4px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--ink-muted);
    padding: 6px 12px;
    border-radius: 0;
    font-size: 13px;
    font-weight: 400;
    cursor: default;
    transition: color 0.18s;
    white-space: nowrap;
    font-family: var(--sans);
    display: inline-flex; align-items: baseline; gap: 8px;
    border-bottom: 1px solid transparent;
  }
  .pill.active { color: var(--gold-deep); border-bottom-color: var(--gold-deep); }
  .pill .num {
    font-family: var(--serif);
    font-size: 15px; font-weight: 400; font-style: italic;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    opacity: 0.55;
    line-height: 1;
  }
  .pill.active .num { color: var(--gold-deep); opacity: 1; }

  .topbar-switchers {
    display: flex; align-items: center; gap: 12px;
    margin-right: 18px;
    flex-shrink: 0;
  }
  .switcher {
    display: inline-flex; align-items: center;
    gap: 2px;
    padding: 3px;
    background: var(--card-soft);
    border-radius: 999px;
  }
  .switcher button {
    background: transparent;
    border: none;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: var(--ink-muted);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background 0.18s, color 0.18s;
    white-space: nowrap;
  }
  .switcher button i.ti { font-size: 13px; }
  .switcher button:hover { color: var(--ink); }
  .switcher button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(20,18,14,0.06),
                0 1px 0 var(--hairline-soft) inset;
  }
  .switcher button[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .switcher button[disabled]:hover { color: var(--ink-muted); }

  /* Empty state — for non-configured channels/views */
  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .empty-state[hidden] { display: none; }
  .empty-state-inner {
    text-align: center;
    max-width: 460px;
    padding: 48px 32px;
    pointer-events: auto;
  }
  .empty-state-inner i.ti {
    font-size: 36px;
    color: var(--gold);
    opacity: 0.6;
    display: block;
    margin-bottom: 18px;
  }
  .empty-state-inner h2 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 400;
    color: var(--ink);
    margin: 0 0 10px;
    letter-spacing: -0.4px;
  }
  .empty-state-inner p {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.5;
    margin: 0;
  }

  .admin-link {
    flex-shrink: 0;
    margin-left: 16px;
    padding: 6px 14px 6px 12px;
    background: var(--ink);
    color: #F5EBD7;
    border-radius: 999px;
    text-decoration: none;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .admin-link:hover {
    background: #1f1c17;
    transform: translateY(-1px);
  }
  .admin-link i.ti {
    font-size: 14px;
    color: var(--gold);
  }

  /* ============================================================
     SCROLL AREA + TRACK
     ============================================================ */
  .scroll-area {
    position: fixed;
    top: var(--top-h);
    left: 0; right: 0; bottom: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .canvas {
    /* zoom target — includes topbar + track */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-width: max-content;
  }
  .canvas .track {
    padding: 48px 56px 56px 56px;
  }
  .zoom-controls-floating {
    position: fixed;
    right: 20px; bottom: 20px;
    z-index: 100;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 2px;
    box-shadow: 0 4px 16px -6px rgba(20,18,14,0.12);
  }
  .track {
    display: flex;
    flex-direction: column;
    gap: 38px;
    min-width: max-content;
    position: relative;
    padding-bottom: 32px;
  }
  .phases-row {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
  }

  /* ============================================================
     SWIM LANES (always-on layers below the phase columns)
     ============================================================ */
  .lane {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .lane-header {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding-left: 4px;
    align-self: flex-start;
  }
  .lane-icon {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--lane-fg, var(--ink));
    color: #FFFFFF;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 13px;
  }
  .lane-icon i.ti { color: #FFFFFF; }
  .lane-label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 1.8px;
    text-transform: uppercase;
  }
  .lane-body {
    display: flex;
    gap: var(--gap);
    align-items: stretch;
  }
  .lane-segment {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lane-card {
    background: var(--lane-bg, #F6F1E5);
    color: var(--lane-fg, var(--ink));
    border-radius: 16px;
    padding: 14px 16px 15px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lane-card.empty {
    background: transparent;
    border: 1px dashed var(--hairline-soft);
    align-items: center; justify-content: center;
    color: var(--ink-fade);
    font-family: var(--serif);
    font-style: italic;
    font-size: 12.5px;
    min-height: 60px;
  }
  .lane-card.quiet {
    background: transparent;
    border: 1px dashed var(--hairline-soft);
    color: var(--ink-muted);
    font-family: var(--serif);
    font-style: italic;
    font-size: 12.5px;
    align-items: center; justify-content: center;
    min-height: 60px;
  }
  .lane-text {
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.4;
    font-weight: 500;
  }
  .lane-storici-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-top: 2px;
    padding-top: 8px;
    border-top: 1px dashed currentColor;
    opacity: 0.85;
  }

  /* Laura lane palette */
  .lane.lane-laura {
    --lane-bg: var(--sys-man-soft);
    --lane-fg: var(--sys-man);
  }

  /* DEM lane palette */
  .lane.lane-dem {
    --lane-bg: var(--sys-mail-soft);
    --lane-fg: var(--sys-mail);
  }
  .dem-card {
    background: var(--lane-bg);
    color: var(--lane-fg);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .dem-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px -10px rgba(10,10,10,0.14);
  }
  .dem-card-icon {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 9px;
    background: var(--lane-fg);
    color: #FFFFFF;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 13px;
  }
  .dem-card-icon i.ti { color: #FFFFFF; }
  .dem-card-info { flex: 1; min-width: 0; }
  .dem-card-title {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .dem-card-timing {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11.5px;
    color: var(--ink-muted);
    line-height: 1.3;
  }

  /* ============================================================
     COLUMN
     ============================================================ */
  .col {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    background: var(--card);
    border-radius: 22px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    z-index: 2;
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 3px rgba(20,18,14,0.04),
                0 14px 38px -16px rgba(20,18,14,0.14);
  }
  .col.current {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold),
                0 1px 3px rgba(20,18,14,0.04),
                0 14px 38px -14px rgba(168,144,96,0.32);
  }

  /* Column header (light, editorial) */
  .col-header {
    padding: 28px 24px 22px;
    position: relative;
    background: var(--card);
  }
  .col-header::after {
    content: ""; position: absolute;
    left: 24px; right: 24px; bottom: 0;
    height: 1px; background: var(--hairline-soft);
  }
  .here-dot {
    position: absolute; top: 30px; right: 32px;
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--gold-deep);
    font-size: 10px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    font-family: var(--sans);
  }
  .here-dot .d {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(168,144,96,0.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(168,144,96,0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(168,144,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(168,144,96,0); }
  }

  .col-num {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 76px;
    line-height: 0.9;
    color: var(--gold);
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    display: block;
    margin-bottom: 18px;
  }
  .col-name {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.4px;
    color: var(--ink);
    margin: 0 0 14px;
    line-height: 1.1;
  }
  .col-period {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .col-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag {
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--gold-deep);
    border: 1px solid var(--hairline);
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .col-body {
    padding: 28px 32px 36px;
    display: flex; flex-direction: column;
    gap: 22px;
    flex: 1;
  }

  /* Editorial note */
  .note {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink-soft);
    padding: 0;
    border: none;
    margin: 0;
  }

  /* Entry annotation (storici) */
  .annotation {
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.5;
    color: var(--gold-deep);
    background: var(--gold-pale);
    border: none;
    padding: 14px 16px 14px 44px;
    position: relative;
    letter-spacing: 0.1px;
    border-radius: 14px;
  }
  .annotation::before {
    content: "ENTRY POINT";
    display: block;
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--gold);
    letter-spacing: 2px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .annotation i.ti {
    position: absolute;
    left: 16px; top: 14px;
    font-size: 18px;
    color: var(--gold);
  }

  /* ============================================================
     STREAM BLOCK
     ============================================================ */
  .stream {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .stream + .stream { margin-top: 10px; }
  .stream-header {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 12px;
    background: var(--card-soft);
    border-radius: 999px;
    align-self: flex-start;
  }
  .stream-header::before {
    content: "↘";
    color: var(--gold-deep);
    font-size: 14px;
    line-height: 1;
    font-weight: 400;
  }
  .stream.loop .stream-header::before {
    content: "↻";
  }
  .stream-del-btn {
    display: none;
    background: transparent;
    border: none;
    color: var(--branch-no);
    font-size: 16px;
    line-height: 1;
    padding: 0 6px;
    margin-left: auto;
    cursor: pointer;
    border-radius: 50%;
    width: 20px; height: 20px;
    align-items: center; justify-content: center;
  }
  body.editing .stream-del-btn { display: inline-flex; }
  .stream-del-btn:hover { background: rgba(156,70,40,0.08); }

  .add-stream-btn { display: none; }
  body.editing .add-stream-btn {
    display: inline-flex;
    align-items: center; justify-content: center;
    background: transparent;
    color: var(--ink-muted);
    border: 1px dashed var(--hairline);
    padding: 7px 14px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 4px;
  }
  body.editing .add-stream-btn:hover {
    color: var(--ink);
    border-color: var(--gold);
    background: var(--card-soft);
  }

  body.editing .stream-name {
    cursor: text;
    outline: 1px dashed transparent;
    border-radius: 4px;
    padding: 0 4px;
    transition: outline-color 0.15s, background 0.15s;
  }
  body.editing .stream-name:hover { outline-color: var(--gold); }
  body.editing .stream-name[contenteditable="true"]:focus {
    outline: none;
    background: var(--card);
    box-shadow: 0 0 0 1px var(--gold-deep);
  }

  .stream-name {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 1.8px;
    text-transform: uppercase;
    line-height: 1;
  }
  .stream-caption { display: none; }
  .stream-leads {
    display: inline-flex; align-items: baseline; gap: 4px;
    margin-left: 8px;
    padding-left: 12px;
    border-left: 1px solid rgba(168,144,96,0.35);
    font-family: var(--sans);
    font-size: 9px;
    color: var(--ink-muted);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .stream-leads .num {
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.3px;
    line-height: 1;
    text-transform: none;
    margin-right: 1px;
  }

  /* ============================================================
     RAIL (cards stack — no line, no dots)
     ============================================================ */
  .rail {
    display: flex; flex-direction: column;
    gap: 10px;
  }

  /* Sequence link between two cards */
  .rail-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
  }
  .rail-link::before {
    content: "";
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
  }
  .rail-link .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--gold-deep);
    padding: 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.3;
  }
  .rail-link .chip i.ti {
    font-size: 13px;
    color: var(--gold);
  }

  /* ============================================================
     NODE (touchpoint card)
     ============================================================ */
  .node {
    display: flex; flex-direction: column;
    gap: 8px;
    padding: 13px 16px 14px;
    border-radius: 14px;
    background: var(--card-soft);
    border: 1px solid transparent;
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }
  /* hover effect removed — cards are no longer clickable */
  .node-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-right: 22px;
  }
  .node-icon {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 14px;
    border: none;
    background: var(--node-fg, var(--ink-soft));
    color: #FFFFFF;
  }
  .node-icon i.ti { color: #FFFFFF; }
  .node-text {
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.35;
    color: var(--ink);
    flex: 1;
    font-weight: 500;
    letter-spacing: -0.05px;
  }
  .node-meta {
    display: flex; flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    padding-left: 40px;
    font-size: 11px;
  }

  /* Actor as text label (no pill) */
  .actor {
    display: inline-flex; align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    line-height: 1;
    color: currentColor;
  }
  .actor::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .actor i.ti { display: none; }
  .actor-manual { color: var(--actor-manual); }
  .actor-auto   { color: var(--gold-deep); }
  .actor-sched  { color: var(--actor-sched); }

  /* System tag — minimal text+icon */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    line-height: 1;
    color: currentColor;
    background: transparent;
    border: none;
    padding: 0;
  }
  .badge i.ti { font-size: 12px; }

  /* Timing — italic serif inline */
  .timing {
    display: inline-flex; align-items: center;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .timing i.ti { display: none; }

  .node-extra {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 12.5px;
    color: var(--ink-muted);
    padding-left: 40px;
    line-height: 1.45;
  }

  /* System color tokens — used both on cards (--node-bg/fg) and badges */
  .sys-zoho      { color: var(--sys-zoho); }
  .sys-whatsapp  { color: var(--sys-wa); }
  .sys-email     { color: var(--sys-mail); }
  .sys-manuale   { color: var(--sys-man); }
  .sys-ads       { color: var(--sys-ads); }
  .sys-logistica { color: var(--sys-log); }

  /* Filled avatar icon color (driven by data-system) */
  .rail-node[data-system="zoho"]      { --node-fg: var(--sys-zoho); }
  .rail-node[data-system="whatsapp"]  { --node-fg: var(--sys-wa); }
  .rail-node[data-system="email"]     { --node-fg: var(--sys-mail); }
  .rail-node[data-system="manuale"]   { --node-fg: var(--sys-man); }
  .rail-node[data-system="ads"]       { --node-fg: var(--sys-ads); }
  .rail-node[data-system="logistica"] { --node-fg: var(--sys-log); }

  /* ============================================================
     FORK CLUSTER — 3 sub-columns stacked at the same slot
     ============================================================ */
  .col-fork {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    display: flex; flex-direction: column;
    gap: 14px;
    background: transparent;
    border: none;
    box-shadow: none;
    position: relative;
    z-index: 2;
  }
  .col-fork-rows {
    display: flex; flex-direction: column;
    gap: 22px;
  }
  .col-fork-annotation {
    margin: 0;
  }
  .col-fork-sub {
    /* Inherits .col base — overrides for sub-column visual */
    flex: 1 1 auto;
    border-radius: 22px;
  }
  .col-fork-sub .col-header {
    padding: 24px 22px 20px;
  }
  .col-fork-sub .col-num {
    font-size: 56px;
    margin-bottom: 8px;
  }
  .col-fork-sub .col-name {
    font-size: 22px;
    line-height: 1.15;
  }
  .col-fork-eyebrow {
    display: block;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .col-fork-label {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    color: var(--fork-color, var(--ink));
    letter-spacing: -0.2px;
  }
  .col-fork-sub.kind-yes   { --fork-color: var(--branch-yes); }
  .col-fork-sub.kind-maybe { --fork-color: var(--branch-maybe); }
  .col-fork-sub.kind-no    { --fork-color: var(--branch-no); }
  .col-fork-sub.kind-yes   { border-color: var(--branch-yes); }
  .col-fork-sub.kind-maybe { border-color: var(--branch-maybe); }
  .col-fork-sub.kind-no    { border-color: var(--branch-no); }
  .col-fork-sub.kind-yes   .col-header::after { background: linear-gradient(90deg, var(--branch-yes), transparent); }
  .col-fork-sub.kind-maybe .col-header::after { background: linear-gradient(90deg, var(--branch-maybe), transparent); }
  .col-fork-sub.kind-no    .col-header::after { background: linear-gradient(90deg, var(--branch-no), transparent); }

  /* ============================================================
     BRANCHES — legacy nested branches (kept for backwards compat)
     ============================================================ */
  .branch-block {
    margin-top: 4px;
    padding-top: 0;
    border-top: none;
    display: flex; flex-direction: column;
    gap: 18px;
    position: relative;
  }
  /* Vertical fork rail running through all branches on the left side */
  .branch-block::before {
    content: "";
    position: absolute;
    left: -12px;
    top: 28px;
    bottom: 28px;
    width: 1px;
    background: var(--hairline);
  }
  .branch-title { display: none; }

  .branch {
    background: var(--card);
    padding: 16px 18px 18px;
    border-radius: 16px;
    border: 1px solid var(--hairline-soft);
    display: flex; flex-direction: column; gap: 12px;
    position: relative;
    box-shadow: 0 1px 2px rgba(20,18,14,0.04),
                0 6px 18px -12px rgba(20,18,14,0.10);
  }
  /* Small horizontal connector from the fork rail into each branch */
  .branch::before {
    content: "";
    position: absolute;
    left: -12px; top: 28px;
    width: 12px; height: 1px;
    background: var(--hairline);
  }
  .branch::after {
    content: "";
    position: absolute;
    left: -14px; top: 25px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--bc);
    border: 2px solid var(--card);
    box-shadow: 0 0 0 1px var(--bc);
  }

  .branch.yes   { --bc: var(--branch-yes); }
  .branch.maybe { --bc: var(--branch-maybe); }
  .branch.no    { --bc: var(--branch-no); }

  .branch-head {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--bc);
    text-transform: uppercase;
    letter-spacing: 1.8px;
    line-height: 1;
    align-self: flex-start;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--bbg, var(--card-soft));
  }
  .branch.yes   .branch-head { background: var(--branch-yes-bg); }
  .branch.maybe .branch-head { background: var(--branch-maybe-bg); }
  .branch.no    .branch-head { background: var(--branch-no-bg); }
  .b-step {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 2px 0;
  }
  .b-step .node-icon { width: 24px; height: 24px; font-size: 12px; }
  .b-step-text {
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.4;
    flex: 1;
    color: var(--ink-soft);
  }
  .b-step-text .badge { margin-top: 6px; }

  /* ============================================================
     CONNECTOR (between columns)
     ============================================================ */
  .connector {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  /* ============================================================
     BOTTOM BAR
     ============================================================ */
  .botbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bot-h);
    background: var(--bg);
    color: var(--ink-muted);
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 18px;
    z-index: 50;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid var(--hairline-soft);
  }
  .botbar::-webkit-scrollbar { display: none; }
  .legend-section {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .legend-label {
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 500;
    color: var(--gold-deep);
    letter-spacing: 2px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .legend-divider {
    width: 1px; height: 20px;
    background: var(--hairline);
    flex-shrink: 0;
  }
  .botbar .actor { font-size: 9.5px; }
  .botbar .badge {
    color: var(--ink-muted);
    font-size: 9.5px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--card);
    border: none;
  }
  .botbar .badge i.ti { font-size: 13px; }
  .botbar .badge.bsys-zoho      { background: var(--sys-zoho-soft); color: var(--sys-zoho); }
  .botbar .badge.bsys-whatsapp  { background: var(--sys-wa-soft);   color: var(--sys-wa); }
  .botbar .badge.bsys-email     { background: var(--sys-mail-soft); color: var(--sys-mail); }
  .botbar .badge.bsys-manuale   { background: var(--sys-man-soft);  color: var(--sys-man); }
  .botbar .badge.bsys-ads       { background: var(--sys-ads-soft);  color: var(--sys-ads); }
  .botbar .badge.bsys-logistica { background: var(--sys-log-soft);  color: var(--sys-log); }
  .botbar .badge i.ti { color: currentColor; }

  /* ============================================================
     PHASE OUTCOME (label between two phases)
     ============================================================ */
  .phase-outcome {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--gold-pale);
    color: var(--gold-deep);
    padding: 10px 18px 11px;
    max-width: 220px;
    min-width: 120px;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13.5px;
    line-height: 1.35;
    letter-spacing: 0.1px;
    z-index: 3;
    pointer-events: none;
    border-radius: 999px;
    box-shadow: 0 1px 2px rgba(168,144,96,0.10),
                0 8px 20px -10px rgba(168,144,96,0.32);
  }
  /* Arrow prefix removed to reduce visual noise */
  .outcome-text {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--gold-deep);
    line-height: 1.3;
  }
  .outcome-trigger {
    display: block;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed rgba(168,144,96,0.30);
    font-family: var(--sans);
    font-style: normal;
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.6px;
    line-height: 1.4;
    text-transform: none;
  }
  .outcome-delta {
    display: block;
    margin-top: 4px;
    font-family: var(--sans);
    font-style: normal;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--gold-deep);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .outcome-delta.positive { color: var(--branch-yes); opacity: 0.9; }
  .outcome-delta.negative { color: var(--ink-muted); opacity: 0.85; }

  /* Edit mode — outcome chip becomes contenteditable */
  .phase-outcome.editable {
    pointer-events: auto;
    border: 1px dashed var(--gold);
    background: var(--card);
  }
  .phase-outcome.editable [contenteditable="true"] {
    outline: none;
    min-width: 60px;
    display: inline-block;
  }
  .phase-outcome.editable [contenteditable="true"]:empty::before {
    content: attr(data-placeholder);
    opacity: 0.45;
    font-style: italic;
  }
  .phase-outcome.editable [contenteditable="true"]:focus {
    outline: none;
  }

  /* ============================================================
     LEAD COUNT (stat card in column header)
     ============================================================ */
  .col-leads {
    display: inline-flex; align-items: baseline; gap: 8px;
    margin-top: 18px;
    padding: 10px 16px 11px;
    background: var(--card-soft);
    border-radius: 12px;
  }
  .col-leads .num {
    font-family: var(--serif);
    font-style: italic;
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
    text-transform: none;
  }
  .col-leads .label {
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--ink-muted);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ============================================================
     RAIL NODE — clickable card
     ============================================================ */
  .rail-node {
    border-radius: 14px;
  }
  .rail-node .node-head {
    align-items: center;
  }
  .node-chev { display: none; }

  /* Inline data inside the touchpoint card (visible at a glance) */
  .node-data {
    margin-top: 4px;
    padding-left: 40px;
    display: flex; flex-direction: column;
    gap: 4px;
  }
  .node-data-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 10px;
    background: var(--card);
    border-radius: 8px;
  }
  .node-data-label {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--ink-muted);
    line-height: 1.3;
    flex: 1;
    min-width: 0;
  }
  .node-data-value {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    flex-shrink: 0;
  }

  /* Edit-mode inline form on each touchpoint card */
  .rail-node.editing .node {
    border: 1px dashed var(--gold);
    background: var(--card);
    box-shadow: 0 1px 2px rgba(20,18,14,0.04),
                0 8px 22px -14px rgba(168,144,96,0.18);
  }
  .node-text-input,
  .node-extra-input {
    font-family: var(--sans);
    font-size: 14px;
    width: 100%;
    border: 1px solid transparent;
    background: var(--card-soft);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--ink);
    resize: vertical;
    line-height: 1.4;
    box-sizing: border-box;
  }
  .node-text-input { font-weight: 500; }
  .node-extra-input {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  .node-text-input:focus,
  .node-extra-input:focus,
  .node-edit-select:focus,
  .node-edit-input:focus,
  .node-data-row.editing input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .node-edit-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding-left: 40px;
    margin-top: 2px;
  }
  .node-edit-fields .node-edit-input { grid-column: 1 / -1; }
  .node-edit-select,
  .node-edit-input {
    font-family: var(--sans);
    font-size: 11.5px;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: var(--card-soft);
    color: var(--ink);
    width: 100%;
    box-sizing: border-box;
  }
  .node-data.editing { padding-left: 40px; gap: 6px; margin-top: 2px; }
  .node-data-row.editing {
    background: var(--card-soft);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex; align-items: center;
    gap: 6px;
  }
  .node-data-row.editing input {
    flex: 1;
    font-family: var(--sans);
    font-size: 12px;
    border: 1px solid transparent;
    background: var(--card);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--ink);
    min-width: 0;
    box-sizing: border-box;
  }
  .node-data-row.editing input[data-field="value"] {
    flex: 0 0 40%;
    text-align: right;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
  }
  .data-row-del {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--ink-muted);
    font-size: 18px;
    line-height: 1;
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
  }
  .data-row-del:hover { background: rgba(156,70,40,0.08); color: #9C4628; }
  .data-row-add {
    margin-left: 0;
    background: transparent;
    border: 1px dashed var(--hairline);
    color: var(--ink-muted);
    font-family: var(--sans);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }
  .data-row-add:hover { color: var(--ink); border-color: var(--gold); }
  .node-actions {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 8px;
    padding-left: 40px;
    margin-top: 6px;
  }
  .node-save-btn {
    background: var(--ink);
    color: #F5EBD7;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .node-save-btn:hover:not(:disabled) { background: #1f1c17; }
  .node-save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .node-save-status {
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--ink-muted);
    letter-spacing: 0.4px;
  }
  .node-save-status[data-state="saving"] { color: var(--gold-deep); }
  .node-save-status[data-state="ok"]     { color: var(--branch-yes); }
  .node-save-status[data-state="error"]  { color: var(--branch-no); }

  .node-del-btn {
    background: transparent;
    color: var(--branch-no);
    border: 1px solid transparent;
    padding: 5px 10px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    cursor: pointer;
    margin-right: auto;
  }
  .node-del-btn:hover { background: rgba(156,70,40,0.08); border-color: var(--branch-no); }

  .add-tp-btn { display: none; }
  body.editing .add-tp-btn {
    display: inline-flex;
    align-items: center; justify-content: center;
    background: transparent;
    color: var(--ink-muted);
    border: 1px dashed var(--hairline);
    padding: 8px 16px;
    border-radius: 12px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    cursor: pointer;
    margin-top: 6px;
    align-self: stretch;
    text-align: center;
  }
  body.editing .add-tp-btn:hover {
    color: var(--ink);
    border-color: var(--gold);
    background: var(--card-soft);
  }

  /* ============================================================
     ASSET PANEL (slide-over from right)
     ============================================================ */
  .asset-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.18);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .asset-backdrop.open { opacity: 1; pointer-events: auto; }

  .asset-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 460px;
    max-width: 92vw;
    background: var(--card);
    z-index: 100;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    overflow-y: auto;
    border-left: 1px solid var(--hairline);
    box-shadow: -4px 0 24px -10px rgba(10,10,10,0.10);
  }
  .asset-panel.open { transform: translateX(0); }

  .asset-panel-inner {
    padding: 32px 36px 56px;
    display: flex; flex-direction: column;
    gap: 24px;
  }
  .asset-panel-header {
    display: flex; align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--hairline);
  }
  .asset-panel-kicker {
    display: block;
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 600;
    color: var(--gold-deep);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .asset-panel-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
    margin: 0;
    line-height: 1.25;
    letter-spacing: -0.2px;
  }
  .asset-panel-close {
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink-muted);
    flex-shrink: 0;
    font-size: 14px;
    transition: color 0.15s, border-color 0.15s;
    padding: 0;
  }
  .asset-panel-close:hover {
    color: var(--ink);
    border-color: var(--ink-muted);
  }

  .asset-panel-meta {
    display: flex; flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    margin-top: -6px;
  }

  .asset-panel-section-title {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin: 4px 0 6px;
  }

  .asset-card {
    display: flex; align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid transparent;
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    background: var(--card-soft);
    overflow: hidden;
  }
  .asset-card:hover {
    background: var(--card-softer);
    border-color: var(--hairline);
    box-shadow: 0 6px 14px -10px rgba(20,18,14,0.12);
  }
  .asset-card.placeholder {
    border-style: dashed;
    background: transparent;
  }
  .asset-card.placeholder .asset-title { color: var(--ink-muted); }
  .asset-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: var(--gold-deep);
    flex-shrink: 0;
  }
  .asset-info { flex: 1; min-width: 0; }
  .asset-title {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .asset-type {
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--ink-muted);
    letter-spacing: 1.6px;
    text-transform: uppercase;
  }
  .asset-arrow {
    color: var(--ink-fade);
    font-size: 14px;
    flex-shrink: 0;
  }

  /* Inline previews — image / video / pdf */
  .asset-card-media {
    flex-direction: column;
    align-items: stretch;
    padding: 0;
    gap: 0;
  }
  .asset-card-media .asset-info {
    padding: 12px 16px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .asset-card-media .asset-info-text { flex: 1; min-width: 0; }
  .asset-card-media .asset-open-arrow {
    color: var(--ink-fade);
    font-size: 14px;
    flex-shrink: 0;
  }
  .asset-card-media:hover .asset-open-arrow { color: var(--ink-muted); }

  .asset-preview-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    background: var(--bg);
    display: block;
  }
  .asset-preview-video {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    background: #000;
    display: block;
  }
  .asset-preview-pdf-wrap {
    position: relative;
    width: 100%;
    height: 360px;
    background: var(--bg);
  }
  .asset-preview-pdf {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }
  .asset-pdf-open {
    position: absolute;
    top: 10px; right: 10px;
    background: var(--ink);
    color: var(--card);
    padding: 7px 12px;
    border-radius: 999px;
    text-decoration: none;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .asset-pdf-open:hover { background: #1f1c17; }
  .asset-empty {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14.5px;
    color: var(--ink-muted);
    padding: 32px 0 8px;
    text-align: center;
    line-height: 1.5;
  }

  /* ============================================================
     EDIT MODE (in-drawer asset editor)
     ============================================================ */
  body.editing .admin-link {
    background: var(--gold);
    color: var(--ink);
  }
  body.editing .admin-link i.ti { color: var(--ink); }
  body.editing .rail-node { box-shadow: 0 0 0 1px var(--gold) inset; }
  body.editing .rail-node:hover { box-shadow: 0 0 0 1.5px var(--gold) inset; }

  .edit-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--gold-pale, #EFE3C7);
    border-radius: 12px;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--gold-deep);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    font-weight: 600;
  }
  body.editing .asset-panel .edit-bar { display: flex; }
  .edit-bar-actions { display: flex; gap: 6px; }
  .edit-btn {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    border-radius: 999px;
    border: none;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .edit-btn i.ti { font-size: 13px; }
  .edit-btn.primary { background: var(--ink); color: #F5EBD7; }
  .edit-btn.primary:hover { background: #1f1c17; }
  .edit-btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .edit-btn.ghost { background: transparent; color: var(--ink-muted); }
  .edit-btn.ghost:hover { color: var(--ink); }
  .edit-btn.danger { background: transparent; color: #9C4628; }
  .edit-btn.danger:hover { background: rgba(156,70,40,0.08); }

  /* Asset card in edit mode — show inputs instead of plain title */
  .asset-card.editing {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 12px 14px;
  }
  .asset-card.editing .asset-edit-row {
    display: flex; align-items: center; gap: 10px;
  }
  .asset-card.editing .asset-icon { width: 32px; height: 32px; font-size: 14px; }
  .asset-card.editing input,
  .asset-card.editing select {
    font-family: var(--sans);
    font-size: 13px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--card);
    color: var(--ink);
    width: 100%;
    box-sizing: border-box;
  }
  .asset-card.editing input:focus,
  .asset-card.editing select:focus {
    outline: none;
    border-color: var(--gold);
  }
  .asset-card.editing .asset-type-select { width: auto; min-width: 120px; }
  .asset-card.editing .asset-row-actions {
    display: flex; gap: 4px;
    margin-left: auto;
  }
  .asset-card.editing .asset-icon-btn {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    cursor: pointer;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: background 0.15s, color 0.15s;
  }
  .asset-card.editing .asset-icon-btn:hover {
    background: var(--bg);
    color: var(--ink);
  }
  .asset-card.editing .asset-icon-btn.danger:hover {
    background: rgba(156,70,40,0.08);
    color: #9C4628;
  }

  /* Drop zone for new file uploads */
  .asset-dropzone {
    border: 2px dashed var(--hairline);
    border-radius: 14px;
    padding: 22px 16px;
    text-align: center;
    font-family: var(--sans);
    color: var(--ink-muted);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-top: 6px;
  }
  .asset-dropzone:hover,
  .asset-dropzone.dragover {
    border-color: var(--gold);
    background: var(--gold-pale, #EFE3C7);
    color: var(--gold-deep);
  }
  .asset-dropzone i.ti {
    font-size: 22px;
    display: block;
    margin: 0 auto 6px;
    color: var(--gold-deep);
  }
  .asset-dropzone .small {
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.75;
  }

  /* ============================================================
     DATA SECTION (touchpoint structured metrics)
     ============================================================ */
  /* View mode — clean list */
  .data-view-list {
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .data-view-row {
    display: flex; align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--card-soft);
    border-radius: 10px;
  }
  .data-view-label {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.3;
    flex: 1;
  }
  .data-view-value {
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    flex-shrink: 0;
  }

  /* Edit mode — inline form rows */
  .data-row {
    display: flex; align-items: stretch;
    gap: 6px;
    padding: 8px 10px;
    background: var(--card-soft);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .data-row input {
    flex: 1;
    font-family: var(--sans);
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    box-sizing: border-box;
    min-width: 0;
  }
  .data-row input[data-field="value"] {
    flex: 0 0 38%;
    text-align: right;
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
  }
  .data-row input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .data-add-row {
    display: flex; gap: 6px;
    margin-top: 10px;
    align-items: stretch;
  }
  .data-add-row input {
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 8px 10px;
    border: 1px solid var(--hairline-soft);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    box-sizing: border-box;
    min-width: 0;
  }
  .data-add-row input:first-child { flex: 1; }
  .data-add-row input:nth-child(2) {
    flex: 0 0 32%;
    font-family: var(--serif);
    font-style: italic;
  }
  .data-add-row input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .data-add-row .edit-btn { flex-shrink: 0; }
  .data-hint {
    display: flex; align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--gold-pale);
    border-radius: 10px;
    font-family: var(--sans);
    font-style: italic;
    font-size: 11.5px;
    color: var(--gold-deep);
    line-height: 1.4;
  }
  .data-hint i.ti {
    font-size: 14px;
    margin-top: 1px;
    flex-shrink: 0;
  }

  .asset-add-row {
    display: flex; gap: 6px;
    margin-top: 10px;
    align-items: stretch;
  }
  .asset-add-row input {
    flex: 1;
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 8px 10px;
    border: 1px solid var(--hairline-soft);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
  }
  .asset-add-row input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .asset-add-row .edit-btn { flex-shrink: 0; }

  .edit-status {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-muted);
    padding: 8px 4px;
    text-align: center;
    letter-spacing: 0.2px;
  }
  .edit-status.saving { color: var(--gold-deep); }
  .edit-status.error  { color: #9C4628; }
  .edit-status.success { color: #4F6B2C; }

  /* Touchpoint metadata editor (inline form at top of edit drawer) */
  .tp-edit-header {
    display: flex; flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline-soft);
  }
  .tp-edit-header .tp-text-input {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 400;
    color: var(--ink);
    border: 1px solid var(--hairline-soft);
    border-radius: 10px;
    padding: 11px 13px;
    background: var(--card);
    width: 100%;
    box-sizing: border-box;
    line-height: 1.3;
    letter-spacing: -0.2px;
  }
  .tp-edit-header .tp-text-input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .tp-edit-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tp-edit-fields .field-full { grid-column: 1 / -1; }
  .tp-edit-field label {
    display: block;
    font-family: var(--sans);
    font-size: 9px;
    color: var(--ink-muted);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-bottom: 5px;
    font-weight: 600;
  }
  .tp-edit-field input,
  .tp-edit-field select,
  .tp-edit-field textarea {
    width: 100%;
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--hairline-soft);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    box-sizing: border-box;
  }
  .tp-edit-field textarea {
    resize: vertical;
    min-height: 56px;
    font-family: var(--serif);
    font-style: italic;
    line-height: 1.4;
  }
  .tp-edit-field input:focus,
  .tp-edit-field select:focus,
  .tp-edit-field textarea:focus {
    outline: none;
    border-color: var(--gold);
  }

  /* In edit mode, hide read-only title + meta (we render editable versions in the body) */
  body.editing .asset-panel-header > div > .asset-panel-title,
  body.editing .asset-panel-meta { display: none; }

  /* ============================================================
     ZOOM CONTROLS (bottom bar)
     ============================================================ */
  .zoom-controls {
    margin-left: auto;
    display: flex; align-items: center;
    gap: 2px;
    padding-left: 14px;
    border-left: 1px solid var(--hairline);
    flex-shrink: 0;
  }
  .zoom-btn {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    padding: 4px 9px;
    line-height: 1;
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s;
  }
  .zoom-btn:hover { color: var(--ink); }
  .zoom-pct {
    min-width: 50px;
    font-size: 11px;
    color: var(--gold-deep);
    letter-spacing: 0.2px;
  }

  /* ============================================================
     SCROLLBAR
     ============================================================ */
  .scroll-area::-webkit-scrollbar { height: 10px; width: 10px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb {
    background: rgba(20,18,14,0.14);
    border-radius: 10px;
    border: 3px solid var(--bg);
  }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: rgba(20,18,14,0.28); }

  /* ============================================================
     CUSTOMER VIEW — bubble + arrows graph
     ============================================================ */
  .cust-wrap {
    padding: 40px 56px 80px 56px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .cust-intro {
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cust-intro .kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--gold-deep);
    font-weight: 500;
  }
  .cust-intro h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .cust-intro p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 14px;
    max-width: 640px;
  }

  .cust-toolbar {
    display: none;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: var(--card-soft);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    width: max-content;
    font-size: 13px;
  }
  body.editing .cust-toolbar { display: inline-flex; }
  .cust-toolbar .group {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cust-toolbar .label {
    color: var(--ink-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .cust-toolbar button {
    appearance: none;
    border: 1px solid var(--hairline);
    background: var(--bg);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .cust-toolbar button:hover { background: var(--gold-pale); border-color: var(--gold-soft); }
  .cust-toolbar button .ti { font-size: 14px; color: var(--gold-deep); }
  .cust-toolbar .hint {
    color: var(--ink-muted);
    font-size: 12px;
    font-style: italic;
  }

  .cust-canvas {
    position: relative;
    width: 1800px;
    height: 1100px;
    background:
      radial-gradient(circle at 1px 1px, rgba(20,18,14,0.06) 1px, transparent 0)
      0 0 / 24px 24px,
      var(--card-softer);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    overflow: hidden;
  }
  body.editing .cust-canvas {
    background:
      radial-gradient(circle at 1px 1px, rgba(168,144,96,0.18) 1px, transparent 0)
      0 0 / 24px 24px,
      var(--card-softer);
  }
  body.editing.cust-connect-mode .cust-canvas { cursor: crosshair; }

  .cust-edges {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .cust-edges path {
    fill: none;
    stroke: #A89060;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.78;
    transition: stroke 0.15s, stroke-width 0.15s, opacity 0.15s;
  }
  body.editing .cust-edges path { pointer-events: stroke; cursor: pointer; }
  body.editing .cust-edges path:hover {
    stroke: var(--actor-manual);
    stroke-width: 2.2;
    opacity: 1;
  }
  .cust-edges .edge-label {
    font-family: var(--sans);
    font-size: 11px;
    fill: var(--ink-muted);
    paint-order: stroke;
    stroke: var(--card-softer);
    stroke-width: 4;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .cust-node {
    position: absolute;
    min-width: 160px;
    max-width: 240px;
    padding: 12px 14px;
    background: var(--card);
    border: 1.5px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 4px 14px -8px rgba(20,18,14,0.18);
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.35;
    transform: translate(-50%, -50%);
    transition: box-shadow 0.15s, border-color 0.15s, transform 0.05s;
    user-select: none;
  }
  .cust-node .cust-node-kicker {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-muted);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .cust-node .cust-node-label {
    display: block;
    color: var(--ink);
    font-weight: 450;
    outline: none;
  }
  .cust-node .cust-node-ref {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--card-soft);
    border: 1px solid var(--hairline-soft);
    font-size: 10.5px;
    color: var(--ink-muted);
    letter-spacing: 0.3px;
  }
  .cust-node .cust-node-ref .ti { font-size: 11px; color: var(--gold); }

  /* type variants */
  .cust-node.type-entry {
    background: var(--gold-pale);
    border-color: var(--gold-soft);
    border-radius: 999px;
    padding: 14px 22px;
    max-width: 280px;
  }
  .cust-node.type-entry .cust-node-kicker { color: var(--gold-deep); }
  .cust-node.type-entry .cust-node-label { color: var(--ink); font-weight: 500; }

  .cust-node.type-touchpoint {
    background: var(--card);
  }

  .cust-node.type-decision {
    background: #FBF6E8;
    border-color: var(--branch-maybe);
    border-style: dashed;
    border-radius: 14px;
  }
  .cust-node.type-decision .cust-node-kicker { color: var(--branch-maybe); }

  .cust-node.type-end {
    background: var(--card);
    border-radius: 12px;
    border-width: 2px;
  }
  .cust-node.type-end.outcome-yes  { border-color: var(--branch-yes);   background: var(--branch-yes-bg); }
  .cust-node.type-end.outcome-yes .cust-node-kicker { color: var(--branch-yes); }
  .cust-node.type-end.outcome-maybe { border-color: var(--branch-maybe); background: var(--branch-maybe-bg); }
  .cust-node.type-end.outcome-maybe .cust-node-kicker { color: var(--branch-maybe); }
  .cust-node.type-end.outcome-no    { border-color: var(--branch-no);    background: var(--branch-no-bg); }
  .cust-node.type-end.outcome-no .cust-node-kicker { color: var(--branch-no); }

  body.editing .cust-node {
    cursor: grab;
  }
  body.editing .cust-node.dragging {
    cursor: grabbing;
    z-index: 50;
    box-shadow: 0 10px 28px -10px rgba(20,18,14,0.32);
    transform: translate(-50%, -50%) scale(1.02);
  }
  body.editing .cust-node.connect-source {
    box-shadow: 0 0 0 3px var(--gold-soft), 0 4px 14px -8px rgba(20,18,14,0.18);
    border-color: var(--gold-deep);
  }
  body.editing .cust-node .cust-node-label[contenteditable="true"] {
    cursor: text;
  }
  body.editing .cust-node .cust-node-label:focus {
    background: var(--gold-pale);
    box-shadow: inset 0 -2px 0 var(--gold);
    border-radius: 3px;
  }

  /* hover actions in edit mode */
  .cust-node-actions {
    position: absolute;
    top: -10px;
    right: -10px;
    display: none;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 4px 12px -4px rgba(20,18,14,0.18);
  }
  body.editing .cust-node:hover .cust-node-actions,
  body.editing .cust-node.dragging .cust-node-actions {
    display: inline-flex;
  }
  .cust-node-actions button {
    appearance: none;
    border: none;
    background: transparent;
    width: 22px; height: 22px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .cust-node-actions button:hover { background: var(--gold-pale); color: var(--gold-deep); }
  .cust-node-actions button.danger:hover { background: var(--branch-no-bg); color: var(--branch-no); }
  .cust-node-actions button .ti { font-size: 14px; }

  .cust-node-type-pill {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 2px 4px 2px 8px;
    font-size: 10px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }
  body.editing .cust-node:hover .cust-node-type-pill { display: inline-flex; align-items: center; gap: 4px; }
  .cust-node-type-pill select {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    color: var(--ink);
    font-weight: 500;
    padding: 0 14px 0 0;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--gold-deep) 50%),
                      linear-gradient(135deg, var(--gold-deep) 50%, transparent 50%);
    background-position: calc(100% - 6px) 50%, calc(100% - 3px) 50%;
    background-size: 3px 3px;
    background-repeat: no-repeat;
  }

  /* drag-edge preview line during connect mode */
  .cust-edge-preview {
    stroke: var(--gold-deep);
    stroke-width: 1.8;
    stroke-dasharray: 6 4;
    fill: none;
    opacity: 0.8;
    pointer-events: none;
  }

  .cust-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-muted);
    align-items: center;
    margin-top: 4px;
  }
  .cust-legend .dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--hairline);
    margin-right: 6px;
    vertical-align: -2px;
  }
  .cust-legend .dot.entry    { background: var(--gold-pale); border-color: var(--gold-soft); }
  .cust-legend .dot.tp       { background: var(--card); }
  .cust-legend .dot.decision { background: #FBF6E8; border-color: var(--branch-maybe); border-style: dashed; }
  .cust-legend .dot.end-yes  { background: var(--branch-yes-bg); border-color: var(--branch-yes); border-radius: 3px; }
  .cust-legend .dot.end-no   { background: var(--branch-no-bg);  border-color: var(--branch-no);  border-radius: 3px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="wordmark">
      <span class="top">Pasticceria</span>
      <span class="giotto">G<span class="bar"></span>I<span class="bar"></span>O<span class="bar"></span>T<span class="bar"></span>T<span class="bar"></span>O</span>
      <span class="bot">Oltre la dolcezza</span>
    </div>
    <div class="subtitle">
      <span class="kicker" id="brandKicker">Journey Retail</span>
      <span class="title" id="brandTitle">Campagna Natale 2026 — operativo rivenditori</span>
    </div>
  </div>

  <div class="topbar-switchers">
    <div class="switcher" id="channelSwitcher" role="tablist" aria-label="Canale"></div>
    <div class="switcher" id="viewSwitcher" role="tablist" aria-label="Vista"></div>
  </div>

  <button type="button" class="admin-link" id="editToggle" title="Attiva modifica">
    <i class="ti ti-pencil"></i><span id="editToggleLabel">Modifica</span>
  </button>
</header>

<main class="scroll-area" id="scrollArea">
  <div class="canvas" id="canvas">
    <div class="track" id="track">
      <svg class="connector" id="connector" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="#A89060" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
        </defs>
      </svg>
    </div>
    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-state-inner">
        <i class="ti ti-tool" id="emptyIcon"></i>
        <h2 id="emptyTitle">Da configurare</h2>
        <p id="emptyText">Questa vista non è ancora stata costruita per questo canale.</p>
      </div>
    </div>
  </div>
</main>

<!-- Floating zoom controls (fixed at the corner of the viewport, NOT zoomed) -->
<div class="zoom-controls zoom-controls-floating">
  <button class="zoom-btn" type="button" data-zoom="-1" aria-label="Zoom out">−</button>
  <button class="zoom-btn zoom-pct" type="button" data-zoom="0" aria-label="Reset zoom">100%</button>
  <button class="zoom-btn" type="button" data-zoom="1" aria-label="Zoom in">+</button>
</div>

<div class="asset-backdrop" id="assetBackdrop"></div>
<aside class="asset-panel" id="assetPanel" aria-hidden="true">
  <div class="asset-panel-inner">
    <header class="asset-panel-header">
      <div>
        <span class="asset-panel-kicker" id="assetPanelKicker">Touchpoint</span>
        <h2 class="asset-panel-title" id="assetPanelTitle"></h2>
      </div>
      <button class="asset-panel-close" type="button" id="assetPanelClose" aria-label="Chiudi">
        <i class="ti ti-x"></i>
      </button>
    </header>
    <div class="asset-panel-meta" id="assetPanelMeta"></div>
    <div class="edit-bar" id="editBar">
      <span><i class="ti ti-pencil"></i> Modalità modifica</span>
      <div class="edit-bar-actions">
        <button type="button" class="edit-btn ghost" id="editCancel">Annulla</button>
        <button type="button" class="edit-btn primary" id="editSave" disabled>
          <i class="ti ti-device-floppy"></i>Salva
        </button>
      </div>
    </div>
    <div class="edit-status" id="editStatus" hidden></div>
    <div class="asset-panel-body" id="assetPanelBody"></div>
  </div>
</aside>

<script>
  // ============================================================
  // CATALOGS
  // ============================================================
  const SYS = {
    manuale:   { label: "Manuale",   cls: "sys-manuale",   icon: "ti-user" },
    ads:       { label: "Ads",       cls: "sys-ads",       icon: "ti-speakerphone" },
    email:     { label: "Email",     cls: "sys-email",     icon: "ti-mail" },
    zoho:      { label: "Zoho",      cls: "sys-zoho",      icon: "ti-database" },
    whatsapp:  { label: "WhatsApp",  cls: "sys-whatsapp",  icon: "ti-brand-whatsapp" },
    logistica: { label: "Logistica", cls: "sys-logistica", icon: "ti-truck" },
  };

  const ACTOR = {
    manual: { label: "Laura",      cls: "actor-manual" },
    auto:   { label: "Auto",       cls: "actor-auto" },
    sched:  { label: "Ricorrente", cls: "actor-sched" },
  };

  const ASSET_TYPE = {
    pdf:    { label: "PDF",      icon: "ti-file-text" },
    doc:    { label: "Doc",      icon: "ti-file-description" },
    sheet:  { label: "Sheet",    icon: "ti-table" },
    image:  { label: "Immagine", icon: "ti-photo" },
    video:  { label: "Video",    icon: "ti-video" },
    folder: { label: "Cartella", icon: "ti-folder" },
    link:   { label: "Link",     icon: "ti-external-link" },
  };

  // Touchpoint index (built after render): tp-id → { tp, phase }
  const touchpointIndex = new Map();

  // Edit-mode flag (visible to renderNode + all renderers)
  let editMode = false;

  // HTML-attribute escape helper (used by both read-only and editable renderers)
  function escapeAttr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  // ---- Commit helpers (via Netlify Function /.netlify/functions/commit) ----
  // Top-scope so they're reachable from every view (operativo, customer, …)
  async function ggGet(path) {
    const res = await fetch(`/.netlify/functions/commit?path=${encodeURIComponent(path)}`);
    if (res.status === 404) return null;
    if (!res.ok) {
      const detail = await ggReadErr(res);
      throw new Error(`GET ${path}: ${res.status} ${detail}`);
    }
    return res.json();
  }

  async function ggPut(path, base64Content, message) {
    const res = await fetch(`/.netlify/functions/commit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path, content: base64Content, message }),
    });
    if (!res.ok) {
      const detail = await ggReadErr(res);
      throw new Error(`PUT ${path}: ${res.status} ${detail}`);
    }
    return res.json();
  }

  async function ggReadErr(res) {
    try {
      const t = await res.text();
      try { return JSON.parse(t).error || t; } catch { return t; }
    } catch { return ""; }
  }

  // ============================================================
  // DATA (populated from data/journey.json on boot)
  // ============================================================
  let phases = [];
  let laura = {};
  let dems = {};


  // ============================================================
  // RENDER
  // ============================================================
  const pad = (n) => String(n).padStart(2, "0");

  function badgeForSystem(systemKey) {
    const s = SYS[systemKey];
    if (!s) return "";
    return `<span class="badge ${s.cls}"><i class="ti ${s.icon}"></i>${s.label}</span>`;
  }

  function actorPill(actorKey) {
    const a = ACTOR[actorKey];
    if (!a) return "";
    return `<span class="actor ${a.cls}">${a.label}</span>`;
  }

  function timingPill(timing) {
    if (!timing) return "";
    return `<span class="timing">${timing}</span>`;
  }

  function renderLink(link) {
    if (!link) return "";
    const icon = link.icon || "ti-arrow-down";
    return `<div class="rail-link">
      <span class="chip"><i class="ti ${icon}"></i>${link.text}</span>
    </div>`;
  }

  let _tpCounter = 0;
  function renderNode(tp, phase, existingId) {
    const id = existingId || ("tp-" + (++_tpCounter));
    if (!existingId) touchpointIndex.set(id, { tp, phase });
    return (typeof editMode !== "undefined" && editMode)
      ? renderNodeEditable(tp, phase, id)
      : renderNodeReadOnly(tp, phase, id);
  }

  function renderNodeReadOnly(tp, phase, id) {
    const sys = SYS[tp.system];
    const iconCls = sys ? sys.cls : "";
    const actorCls = tp.actor ? `actor-${tp.actor}` : "";
    return `
      <div class="rail-node ${actorCls}" data-tp-id="${id}" data-system="${tp.system || ''}">
        <div class="node">
          <div class="node-head">
            <span class="node-icon ${iconCls}"><i class="ti ${tp.icon}"></i></span>
            <div class="node-text">${tp.text}</div>
          </div>
          <div class="node-meta">
            ${actorPill(tp.actor)}
            ${timingPill(tp.timing)}
          </div>
          ${tp.extra ? `<div class="node-extra">${tp.extra}</div>` : ""}
          ${renderInlineData(tp)}
        </div>
      </div>`;
  }

  function renderNodeEditable(tp, phase, id) {
    const sys = SYS[tp.system];
    const iconCls = sys ? sys.cls : "";
    const actorCls = tp.actor ? `actor-${tp.actor}` : "";
    const sysOpts = Object.entries(SYS).map(([k, s]) =>
      `<option value="${k}" ${k === tp.system ? "selected" : ""}>${s.label}</option>`).join("");
    const actorOpts = Object.entries(ACTOR).map(([k, a]) =>
      `<option value="${k}" ${k === tp.actor ? "selected" : ""}>${a.label}</option>`).join("");
    const data = tp.data || [];
    const dataRowsHtml = data.map((d, i) => `
      <div class="node-data-row editing" data-row="${i}">
        <input type="text" data-field="label" value="${escapeAttr(d.label || "")}" placeholder="Etichetta">
        <input type="text" data-field="value" value="${escapeAttr(d.value || "")}" placeholder="Valore">
        <button type="button" class="data-row-del" data-action="delete-data" title="Elimina">×</button>
      </div>`).join("");
    return `
      <div class="rail-node ${actorCls} editing" data-tp-id="${id}" data-system="${tp.system || ''}">
        <div class="node editing">
          <div class="node-head">
            <span class="node-icon ${iconCls}"><i class="ti ${tp.icon}"></i></span>
            <textarea class="node-text-input" data-field="text" rows="2" placeholder="Cosa succede">${escapeAttr(tp.text || "")}</textarea>
          </div>
          <div class="node-edit-fields">
            <select data-field="actor" class="node-edit-select">${actorOpts}</select>
            <select data-field="system" class="node-edit-select">${sysOpts}</select>
            <input type="text" data-field="timing" value="${escapeAttr(tp.timing || "")}" placeholder="Quando" class="node-edit-input">
          </div>
          <textarea class="node-extra-input" data-field="extra" rows="2" placeholder="Nota extra (opzionale)">${escapeAttr(tp.extra || "")}</textarea>
          <div class="node-data editing">
            ${dataRowsHtml}
            <button type="button" class="data-row-add" data-action="add-data">+ Aggiungi dato</button>
          </div>
          <div class="node-actions">
            <button type="button" class="node-del-btn" data-action="delete-tp" title="Elimina questo touchpoint">Elimina</button>
            <span class="node-save-status" data-status></span>
            <button type="button" class="node-save-btn" data-action="save-tp" disabled>Salva</button>
          </div>
        </div>
      </div>`;
  }

  function renderInlineData(tp) {
    if (!tp.data || !tp.data.length) return "";
    return `
      <div class="node-data">
        ${tp.data.map(d => `
          <div class="node-data-row">
            <span class="node-data-label">${escapeAttr(d.label || "")}</span>
            <span class="node-data-value">${escapeAttr(d.value || "")}</span>
          </div>
        `).join("")}
      </div>`;
  }

  // Replace the rail-node DOM in place with a freshly rendered version
  // (used after an edit save so the dashboard reflects without a reload)
  function rerenderRailNode(tpId) {
    const entry = touchpointIndex.get(tpId);
    if (!entry) return;
    const old = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
    if (!old) return;
    const tmp = document.createElement("div");
    tmp.innerHTML = renderNode(entry.tp, entry.phase, tpId);
    const fresh = tmp.firstElementChild;
    old.replaceWith(fresh);
  }

  function renderRail(touchpoints, phase) {
    const items = (touchpoints || []).map((tp, i) => `
      ${i > 0 ? renderLink(tp.link) : ""}
      ${renderNode(tp, phase)}
    `).join("");
    const addBtn = `<button type="button" class="add-tp-btn" data-action="add-tp">+ Aggiungi touchpoint</button>`;
    return `<div class="rail">${items}${addBtn}</div>`;
  }

  function renderStream(stream, phase, streamIdx) {
    const leadsHtml = (stream.leads != null)
      ? `<span class="stream-leads"><span class="num">${formatLeads(stream.leads)}</span> lead</span>`
      : "";
    return `
      <div class="stream ${stream.loop ? "loop" : ""}" data-phase-n="${phase.n}" data-stream-idx="${streamIdx}">
        <div class="stream-header">
          <span class="stream-name" data-original="${escapeAttr(stream.name)}">${escapeAttr(stream.name)}</span>
          ${leadsHtml}
          <button type="button" class="stream-del-btn" data-action="delete-stream" title="Elimina stream">×</button>
        </div>
        ${renderRail(stream.touchpoints, phase)}
      </div>`;
  }

  function renderBranchStep(step) {
    const sys = SYS[step.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="b-step">
        <span class="node-icon ${iconCls}"><i class="ti ${step.icon}"></i></span>
        <div class="b-step-text">
          ${step.text}
          <div>${badgeForSystem(step.system)}</div>
        </div>
      </div>`;
  }

  function renderBranches(branches) {
    if (!branches || !branches.length) return "";
    return `
      <div class="branch-block">
        <div class="branch-title">Risposta del contatto</div>
        ${branches.map(b => `
          <div class="branch ${b.kind}">
            <div class="branch-head">${b.label}</div>
            ${b.steps.map(renderBranchStep).join("")}
          </div>
        `).join("")}
      </div>`;
  }

  function formatLeads(n) {
    return n.toLocaleString("it-IT");
  }
