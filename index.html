<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Retail — Pasticceria Giotto · Natale 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  /* ---------- BRAND TYPEFACES ---------- */
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Light.woff2") format("woff2");        font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-LightItalic.woff2") format("woff2");  font-weight:300; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Regular.woff2") format("woff2");      font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Italic.woff2") format("woff2");       font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Medium.woff2") format("woff2");       font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-MediumItalic.woff2") format("woff2"); font-weight:500; font-style:italic; font-display:swap; }
  @font-face { font-family:"Gazpacho"; src:url("fonts/Gazpacho-Bold.woff2") format("woff2");         font-weight:700; font-style:normal; font-display:swap; }

  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Light.woff2") format("woff2");        font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-LightItalic.woff2") format("woff2");  font-weight:300; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Regular.woff2") format("woff2");      font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Italic.woff2") format("woff2");       font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Medium.woff2") format("woff2");       font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-MediumItalic.woff2") format("woff2"); font-weight:500; font-style:italic; font-display:swap; }
  @font-face { font-family:"Neue Montreal"; src:url("fonts/NeueMontreal-Bold.woff2") format("woff2");         font-weight:700; font-style:normal; font-display:swap; }

  :root {
    --bg:          #F2E8D7;
    --card:        #FFFFFF;

    --ink:         #0A0A0A;
    --ink-soft:    #232019;
    --ink-muted:   #847C70;
    --ink-fade:    #B3A893;

    --gold:        #A89060;
    --gold-deep:   #8E7848;
    --gold-soft:   #D6C39A;

    --hairline:      rgba(168,144,96,0.32);
    --hairline-soft: rgba(168,144,96,0.18);
    --rule:          rgba(10,10,10,0.08);

    --actor-manual:  #7A3920;
    --actor-auto:    #8E7848;
    --actor-sched:   #4F6B2C;

    --sys-zoho:   #2A3D5C;
    --sys-wa:     #4A5A2A;
    --sys-mail:   #7A4A1A;
    --sys-man:    #7A3920;
    --sys-ads:    #4F4677;
    --sys-log:    #4F4738;

    --branch-yes:    #4F6B2C;
    --branch-maybe:  #A87A1E;
    --branch-no:     #9C4628;

    --top-h: 76px;
    --bot-h: 48px;
    --col-w: 332px;
    --gap: 88px;

    --serif: "Gazpacho", Georgia, serif;
    --sans:  "Neue Montreal", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.5;
    font-weight: 400;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     TOP BAR
     ============================================================ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--top-h);
    background: rgba(14, 13, 11, 0.62);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    color: #F5EBD7;
    display: flex; align-items: center;
    padding: 0 32px;
    z-index: 50;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset,
                0 6px 24px -8px rgba(0, 0, 0, 0.18);
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-right: 32px; flex-shrink: 0; }
  .wordmark {
    display: flex; flex-direction: column; align-items: center;
    line-height: 1;
    padding-right: 22px;
    border-right: 1px solid rgba(168,144,96,0.20);
  }
  .wordmark .top, .wordmark .bot {
    font-family: var(--serif);
    font-size: 9px; letter-spacing: 5px;
    color: var(--gold-soft);
    font-weight: 400; text-transform: uppercase;
  }
  .wordmark .top { margin-bottom: 5px; }
  .wordmark .bot { margin-top: 5px; font-size: 7.5px; letter-spacing: 3.5px; }
  .wordmark .giotto {
    font-family: var(--serif);
    font-size: 21px; font-weight: 400;
    color: #FAF1DB;
    display: flex; align-items: center; gap: 6px;
  }
  .wordmark .giotto .bar { width: 1px; height: 15px; background: rgba(255,255,255,0.32); }
  .subtitle { display: flex; flex-direction: column; line-height: 1.3; }
  .subtitle .kicker {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--gold-soft);
    margin-bottom: 2px;
    font-weight: 400;
  }
  .subtitle .title {
    font-size: 12.5px;
    color: #B7AB91;
    letter-spacing: 0.3px;
    font-weight: 400;
  }
  .nav {
    display: flex; gap: 6px; overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
    padding: 0 4px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: #8C8276;
    padding: 6px 12px;
    border-radius: 0;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    transition: color 0.18s;
    white-space: nowrap;
    font-family: var(--sans);
    display: inline-flex; align-items: baseline; gap: 8px;
    border-bottom: 1px solid transparent;
  }
  .pill:hover { color: #F5EBD7; }
  .pill.active { color: var(--gold); border-bottom-color: var(--gold); }
  .pill .num {
    font-family: var(--serif);
    font-size: 15px; font-weight: 400; font-style: italic;
    font-variant-numeric: tabular-nums;
    color: var(--gold-soft);
    opacity: 0.7;
    line-height: 1;
  }
  .pill.active .num { color: var(--gold); opacity: 1; }

  /* ============================================================
     SCROLL AREA + TRACK
     ============================================================ */
  .scroll-area {
    position: fixed;
    top: var(--top-h);
    bottom: var(--bot-h);
    left: 0; right: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: 48px 56px 56px 56px;
  }
  .track {
    display: flex; align-items: flex-start;
    gap: var(--gap);
    min-width: max-content;
    position: relative;
    padding-bottom: 32px;
  }

  /* ============================================================
     COLUMN
     ============================================================ */
  .col {
    width: var(--col-w);
    flex: 0 0 var(--col-w);
    background: var(--card);
    border-radius: 0;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .col.current {
    box-shadow: 0 0 0 1px rgba(168, 144, 96, 0.55) inset,
                0 18px 48px -20px rgba(168, 144, 96, 0.22),
                0 4px 18px -8px rgba(168, 144, 96, 0.18);
  }

  /* Column header (light, editorial) */
  .col-header {
    padding: 36px 32px 26px;
    position: relative;
    background: var(--card);
  }
  .col-header::after {
    content: ""; position: absolute;
    left: 32px; right: 32px; bottom: 0;
    height: 1px; background: var(--hairline);
  }
  .here-dot {
    position: absolute; top: 30px; right: 32px;
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--gold-deep);
    font-size: 10px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    font-family: var(--sans);
  }
  .here-dot .d {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(168,144,96,0.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(168,144,96,0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(168,144,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(168,144,96,0); }
  }

  .col-num {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 76px;
    line-height: 0.9;
    color: var(--gold);
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    display: block;
    margin-bottom: 18px;
  }
  .col-name {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.4px;
    color: var(--ink);
    margin: 0 0 14px;
    line-height: 1.1;
  }
  .col-period {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .col-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag {
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--gold-deep);
    border: 1px solid var(--hairline);
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .col-body {
    padding: 28px 32px 36px;
    display: flex; flex-direction: column;
    gap: 22px;
    flex: 1;
  }

  /* Editorial note */
  .note {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink-soft);
    padding: 0;
    border: none;
    margin: 0;
  }

  /* Entry annotation (storici) */
  .annotation {
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--gold-deep);
    background: transparent;
    border: none;
    border-top: 1px solid var(--hairline-soft);
    border-bottom: 1px solid var(--hairline-soft);
    padding: 12px 0 12px 28px;
    position: relative;
    letter-spacing: 0.1px;
  }
  .annotation::before {
    content: "ENTRY POINT";
    display: block;
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--gold);
    letter-spacing: 2px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .annotation i.ti {
    position: absolute;
    left: 0; top: 30px;
    font-size: 18px;
    color: var(--gold);
  }

  /* ============================================================
     STREAM BLOCK
     ============================================================ */
  .stream {
    display: flex; flex-direction: column;
    gap: 0;
  }
  .stream + .stream { margin-top: 6px; }
  .stream-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .stream-name {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 2.2px;
    text-transform: uppercase;
  }
  .stream-caption {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13.5px;
    color: var(--ink-muted);
    letter-spacing: 0.1px;
  }
  .stream.loop .stream-name::before {
    content: "↻  ";
    color: var(--gold);
    font-weight: 400;
  }

  /* ============================================================
     RAIL (vertical timeline)
     ============================================================ */
  .rail {
    position: relative;
    padding: 6px 0 0 28px;
    display: flex; flex-direction: column;
  }
  .rail::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 16px;
    bottom: 10px;
    width: 1px;
    background: var(--rule);
  }
  .rail-node {
    position: relative;
    padding: 0 0 18px 0;
  }
  .rail-node:last-child { padding-bottom: 0; }
  .rail-node::before {
    content: "";
    position: absolute;
    left: -25px;
    top: 8px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--card);
    border: 1.5px solid var(--ink-fade);
    box-sizing: border-box;
    z-index: 2;
  }
  .rail-node.actor-manual::before {
    background: var(--actor-manual);
    border-color: var(--actor-manual);
  }
  .rail-node.actor-auto::before {
    background: var(--gold);
    border-color: var(--gold);
  }
  .rail-node.actor-sched::before {
    background: var(--actor-sched);
    border-color: var(--actor-sched);
  }

  /* Sequence link between two nodes */
  .rail-link {
    position: relative;
    padding: 0 0 14px 0;
    margin-top: -8px;
  }
  .rail-link .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--gold-deep);
    padding: 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.3;
  }
  .rail-link .chip i.ti {
    font-size: 13px;
    color: var(--gold);
  }

  /* ============================================================
     NODE (touchpoint)
     ============================================================ */
  .node {
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .node-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .node-icon {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 14px;
    margin-top: -2px;
    border: 1px solid currentColor;
    background: transparent;
  }
  .node-text {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
    flex: 1;
    font-weight: 400;
  }
  .node-meta {
    display: flex; flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    padding-left: 40px;
    font-size: 11.5px;
  }

  /* Actor as text label (no pill) */
  .actor {
    display: inline-flex; align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    line-height: 1;
    color: currentColor;
  }
  .actor::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .actor i.ti { display: none; }
  .actor-manual { color: var(--actor-manual); }
  .actor-auto   { color: var(--gold-deep); }
  .actor-sched  { color: var(--actor-sched); }

  /* System tag — minimal text+icon */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    line-height: 1;
    color: currentColor;
    background: transparent;
    border: none;
    padding: 0;
  }
  .badge i.ti { font-size: 12px; }

  /* Timing — italic serif inline */
  .timing {
    display: inline-flex; align-items: center;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .timing i.ti { display: none; }

  .node-extra {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-muted);
    padding-left: 40px;
    line-height: 1.45;
  }

  /* System colors */
  .sys-zoho      { color: var(--sys-zoho); }
  .sys-whatsapp  { color: var(--sys-wa); }
  .sys-email     { color: var(--sys-mail); }
  .sys-manuale   { color: var(--sys-man); }
  .sys-ads       { color: var(--sys-ads); }
  .sys-logistica { color: var(--sys-log); }

  .node-icon.sys-zoho      { color: var(--sys-zoho); }
  .node-icon.sys-whatsapp  { color: var(--sys-wa); }
  .node-icon.sys-email     { color: var(--sys-mail); }
  .node-icon.sys-manuale   { color: var(--sys-man); }
  .node-icon.sys-ads       { color: var(--sys-ads); }
  .node-icon.sys-logistica { color: var(--sys-log); }

  /* ============================================================
     BRANCHES
     ============================================================ */
  .branch-block {
    margin-top: 8px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    display: flex; flex-direction: column;
    gap: 18px;
  }
  .branch-title {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .branch {
    border-left: 2px solid var(--bc);
    background: transparent;
    padding: 4px 0 4px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .branch-head {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 400;
    font-style: italic;
    color: var(--bc);
    line-height: 1;
  }
  .branch.yes   { --bc: var(--branch-yes); }
  .branch.maybe { --bc: var(--branch-maybe); }
  .branch.no    { --bc: var(--branch-no); }
  .b-step {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 2px 0;
  }
  .b-step .node-icon { width: 24px; height: 24px; font-size: 12px; }
  .b-step-text {
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.4;
    flex: 1;
    color: var(--ink-soft);
  }
  .b-step-text .badge { margin-top: 6px; }

  /* ============================================================
     CONNECTOR (between columns)
     ============================================================ */
  .connector {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  /* ============================================================
     BOTTOM BAR
     ============================================================ */
  .botbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bot-h);
    background: rgba(14, 13, 11, 0.62);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    color: var(--gold-soft);
    display: flex; align-items: center;
    padding: 0 32px;
    gap: 18px;
    z-index: 50;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 -1px 0 rgba(255,255,255,0.04) inset,
                0 -6px 24px -8px rgba(0, 0, 0, 0.18);
  }
  .botbar::-webkit-scrollbar { display: none; }
  .legend-section {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .legend-label {
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .legend-divider {
    width: 1px; height: 20px;
    background: rgba(168,144,96,0.22);
    flex-shrink: 0;
  }
  .botbar .actor {
    color: var(--gold-soft);
    font-size: 9.5px;
  }
  .botbar .actor-manual::before { background: #C97755; }
  .botbar .actor-auto::before   { background: var(--gold); }
  .botbar .actor-sched::before  { background: #93B16A; }
  .botbar .badge {
    color: #D6C39A;
    font-size: 9.5px;
  }
  .botbar .badge i.ti { color: var(--gold); font-size: 13px; }

  /* ============================================================
     SCROLLBAR
     ============================================================ */
  .scroll-area::-webkit-scrollbar { height: 12px; width: 12px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb {
    background: rgba(168,144,96,0.32);
    border-radius: 12px;
    border: 3px solid var(--bg);
  }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: var(--gold); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="wordmark">
      <span class="top">Pasticceria</span>
      <span class="giotto">G<span class="bar"></span>I<span class="bar"></span>O<span class="bar"></span>T<span class="bar"></span>T<span class="bar"></span>O</span>
      <span class="bot">Oltre la dolcezza</span>
    </div>
    <div class="subtitle">
      <span class="kicker">Journey Retail</span>
      <span class="title">Campagna Natale 2026 — operativo rivenditori</span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main class="scroll-area" id="scrollArea">
  <div class="track" id="track">
    <svg class="connector" id="connector" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10" fill="none" stroke="#A89060" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </marker>
      </defs>
    </svg>
  </div>
</main>

<footer class="botbar">
  <div class="legend-section">
    <span class="legend-label">Attore</span>
    <span class="actor actor-manual">Laura</span>
    <span class="actor actor-auto">Auto</span>
    <span class="actor actor-sched">Ricorrente</span>
  </div>
  <div class="legend-divider"></div>
  <div class="legend-section">
    <span class="legend-label">Sistema</span>
    <span class="badge"><i class="ti ti-database"></i>Zoho</span>
    <span class="badge"><i class="ti ti-brand-whatsapp"></i>WhatsApp</span>
    <span class="badge"><i class="ti ti-mail"></i>Email</span>
    <span class="badge"><i class="ti ti-user"></i>Manuale</span>
    <span class="badge"><i class="ti ti-speakerphone"></i>Ads</span>
    <span class="badge"><i class="ti ti-truck"></i>Logistica</span>
  </div>
</footer>

<script>
  // ============================================================
  // CATALOGS
  // ============================================================
  const SYS = {
    manuale:   { label: "Manuale",   cls: "sys-manuale",   icon: "ti-user" },
    ads:       { label: "Ads",       cls: "sys-ads",       icon: "ti-speakerphone" },
    email:     { label: "Email",     cls: "sys-email",     icon: "ti-mail" },
    zoho:      { label: "Zoho",      cls: "sys-zoho",      icon: "ti-database" },
    whatsapp:  { label: "WhatsApp",  cls: "sys-whatsapp",  icon: "ti-brand-whatsapp" },
    logistica: { label: "Logistica", cls: "sys-logistica", icon: "ti-truck" },
  };

  const ACTOR = {
    manual: { label: "Laura",      cls: "actor-manual" },
    auto:   { label: "Auto",       cls: "actor-auto" },
    sched:  { label: "Ricorrente", cls: "actor-sched" },
  };

  const phases = [
    {
      n: 1, name: "Generazione lead", period: "Maggio – Giugno 2026",
      current: true,
      note: "Due percorsi paralleli che alimentano la stessa pipeline Zoho.",
      streams: [
        {
          name: "Outbound", caption: "lista costruita a mano",
          touchpoints: [
            { text: "Estrapolazione contatti enoteche per area geografica",
              system: "manuale", icon: "ti-search", actor: "manual",
              timing: "Avvio immediato" },
          ]
        },
        {
          name: "Inbound", caption: "lead da campagna ads",
          touchpoints: [
            { text: "Campagna awareness geo-targeted",
              system: "ads", icon: "ti-speakerphone", actor: "auto",
              timing: "Mag 2026",
              extra: "Prepara il terreno prima delle chiamate" },
            { text: "Campagna lead gen Nord Italia → landing",
              system: "ads", icon: "ti-target", actor: "auto",
              timing: "Mag 2026",
              link: { text: "in parallelo all'awareness", icon: "ti-arrow-right" },
              extra: "Il lead entra in pipeline Zoho senza azione manuale" },
          ]
        },
      ]
    },

    {
      n: 2, name: "Esplorazione", period: "Maggio – Giugno 2026",
      tags: ["parallela alla lead gen"],
      note: "Outbound: Laura lavora la lista. Inbound: i lead della landing arrivano da soli.",
      streams: [
        {
          name: "Outbound", caption: "lista da Fase 01",
          touchpoints: [
            { text: "Laura chiama i contatti della lista outbound",
              system: "manuale", icon: "ti-phone", actor: "manual",
              timing: "Avvio immediato" },
            { text: "Raccoglie l'email durante la chiamata",
              system: "manuale", icon: "ti-at", actor: "manual",
              link: { text: "a fine chiamata", icon: "ti-arrow-down" } },
            { text: "Mail automatica con allegato retail (benefit Giotto)",
              system: "email", icon: "ti-mail", actor: "auto",
              timing: "Entro 24h",
              link: { text: "trigger: email salvata in Zoho", icon: "ti-bolt" } },
          ]
        },
        {
          name: "Inbound", caption: "lead già in pipeline",
          touchpoints: [
            { text: "I lead della landing entrano direttamente in Zoho — confluiscono nelle fasi successive",
              system: "zoho", icon: "ti-database", actor: "auto",
              timing: "In continua" },
          ]
        },
      ]
    },

    {
      n: 3, name: "Proposta appuntamento", period: "Giugno 2026",
      note: "Task automatico da Zoho 72h dopo la mail. Laura non deve ricordarselo.",
      touchpoints: [
        { text: "Task Zoho: chiama per proporre l'incontro",
          system: "zoho", icon: "ti-bell", actor: "auto",
          timing: "+72h dalla mail" },
        { text: "Laura propone l'incontro per far assaggiare la campionatura",
          system: "manuale", icon: "ti-phone", actor: "manual",
          timing: "Giu 2026",
          link: { text: "Laura prende il task", icon: "ti-arrow-down" } },
      ],
      branches: [
        { kind: "yes",   label: "Sì",    steps: [
          { text: "Appuntamento fissato a calendario in Zoho", system: "zoho", icon: "ti-calendar" },
        ]},
        { kind: "maybe", label: "Forse", steps: [
          { text: "Task automatico: richiama tra 1 settimana", system: "zoho", icon: "ti-clock" },
        ]},
        { kind: "no",    label: "No",    steps: [
          { text: "Reminder manuale — data scelta da Laura", system: "zoho", icon: "ti-calendar-off" },
          { text: "Inserito in lista newsletter awareness", system: "email", icon: "ti-mail" },
        ]},
      ],
    },

    {
      n: 4, name: "Incontro", period: "Giugno – Luglio 2026",
      touchpoints: [
        { text: "Laura porta la campionatura prodotti Natale 2026",
          system: "manuale", icon: "ti-gift", actor: "manual",
          timing: "Giu–Lug 2026" },
        { text: "Mostra materiali di comunicazione da tablet",
          system: "manuale", icon: "ti-device-tablet", actor: "manual",
          link: { text: "durante l'incontro", icon: "ti-arrow-down" } },
        { text: "Presenta e lascia il listino",
          system: "manuale", icon: "ti-file-text", actor: "manual",
          link: { text: "a fine incontro", icon: "ti-arrow-down" } },
      ],
    },

    {
      n: 5, name: "Ragionamento", period: "Luglio 2026",
      note: "1–2 settimane in base al periodo. Touchpoint attivo a metà fase.",
      touchpoints: [
        { text: "Reminder Zoho con data di richiamo personalizzata",
          system: "zoho", icon: "ti-bell", actor: "auto",
          timing: "Inizio fase" },
        { text: "WhatsApp di Laura: «Com'è andata con la campionatura?»",
          system: "whatsapp", icon: "ti-brand-whatsapp", actor: "manual",
          timing: "A metà del periodo",
          link: { text: "Laura usa il reminder come innesco", icon: "ti-arrow-down" } },
      ],
    },

    {
      n: 6, name: "Risposta", period: "Luglio – Agosto 2026",
      note: "Momento decisivo. I No definitivi restano nel perimetro Giotto via newsletter.",
      branches: [
        { kind: "yes",   label: "Sì",    steps: [
          { text: "Laura prende l'ordine", system: "manuale", icon: "ti-clipboard-check" },
        ]},
        { kind: "maybe", label: "Forse", steps: [
          { text: "Reminder ping automatico in Zoho", system: "zoho", icon: "ti-bell" },
        ]},
        { kind: "no",    label: "No",    steps: [
          { text: "Reminder a mesi in Zoho", system: "zoho", icon: "ti-calendar-off" },
          { text: "Inserito in lista newsletter awareness", system: "email", icon: "ti-mail" },
        ]},
      ],
    },

    {
      n: 7, name: "Onboarding", period: "Agosto – Settembre 2026",
      tags: ["entry point storici"],
      note: "I rivenditori storici che riacquistano saltano le fasi 1–6 ed entrano direttamente qui.",
      annotation: { icon: "ti-arrow-down-right", text: "Rivenditori storici: ingresso diretto in questa fase" },
      touchpoints: [
        { text: "Mail automatica: store locator + scontistica dedicata per i primi 6 mesi",
          system: "email", icon: "ti-mail", actor: "auto",
          timing: "Entro 24h dalla conferma ordine",
          link: { text: "trigger: ordine confermato in Zoho", icon: "ti-bolt" } },
        { text: "Spedizione ordine + kit comunicazione campagna Natale nella scatola",
          system: "logistica", icon: "ti-truck", actor: "auto",
          timing: "Set 2026",
          link: { text: "dopo conferma pagamento", icon: "ti-arrow-down" } },
      ],
    },

    {
      n: 8, name: "Campagna attiva", period: "Ottobre – Dicembre 2026",
      note: "Touchpoint ricorrenti per tutti i rivenditori attivi — nuovi e storici insieme.",
      streams: [
        {
          name: "Ricorrenti", caption: "loop di nutrimento", loop: true,
          touchpoints: [
            { text: "Scheda prodotto mensile (approfondimento campagna Natale)",
              system: "email", icon: "ti-mail", actor: "sched",
              timing: "1× al mese" },
            { text: "WhatsApp: contenuti social selezionati da Laura",
              system: "whatsapp", icon: "ti-brand-whatsapp", actor: "manual",
              timing: "Ogni venerdì" },
            { text: "Newsletter editoriale «Storie dal carcere»",
              system: "email", icon: "ti-newspaper", actor: "sched",
              timing: "Ogni 2 del mese" },
            { text: "Mail con i numeri salienti della campagna",
              system: "email", icon: "ti-chart-bar", actor: "auto",
              timing: "Nov 2026 — 3 settimane prima della chiusura" },
          ]
        }
      ]
    },

    {
      n: 9, name: "Fine campagna", period: "Gennaio 2027",
      touchpoints: [
        { text: "Mail automatica di feedback sulla campagna",
          system: "email", icon: "ti-mail", actor: "auto",
          timing: "Gen 2027" },
        { text: "Laura propone la campagna successiva (Colomba / Pasqua 2027)",
          system: "manuale", icon: "ti-arrow-right", actor: "manual",
          timing: "Gen 2027",
          link: { text: "subito dopo il feedback", icon: "ti-arrow-down" },
          extra: "Momento di massimo calore — non lasciarlo raffreddare" },
      ],
    },
  ];

  // ============================================================
  // RENDER
  // ============================================================
  const pad = (n) => String(n).padStart(2, "0");

  function badgeForSystem(systemKey) {
    const s = SYS[systemKey];
    if (!s) return "";
    return `<span class="badge ${s.cls}"><i class="ti ${s.icon}"></i>${s.label}</span>`;
  }

  function actorPill(actorKey) {
    const a = ACTOR[actorKey];
    if (!a) return "";
    return `<span class="actor ${a.cls}">${a.label}</span>`;
  }

  function timingPill(timing) {
    if (!timing) return "";
    return `<span class="timing">${timing}</span>`;
  }

  function renderLink(link) {
    if (!link) return "";
    const icon = link.icon || "ti-arrow-down";
    return `<div class="rail-link">
      <span class="chip"><i class="ti ${icon}"></i>${link.text}</span>
    </div>`;
  }

  function renderNode(tp) {
    const sys = SYS[tp.system];
    const iconCls = sys ? sys.cls : "";
    const actorCls = tp.actor ? `actor-${tp.actor}` : "";
    return `
      <div class="rail-node ${actorCls}">
        <div class="node">
          <div class="node-head">
            <span class="node-icon ${iconCls}"><i class="ti ${tp.icon}"></i></span>
            <div class="node-text">${tp.text}</div>
          </div>
          <div class="node-meta">
            ${actorPill(tp.actor)}
            ${badgeForSystem(tp.system)}
            ${timingPill(tp.timing)}
          </div>
          ${tp.extra ? `<div class="node-extra">${tp.extra}</div>` : ""}
        </div>
      </div>`;
  }

  function renderRail(touchpoints) {
    if (!touchpoints || !touchpoints.length) return "";
    return `<div class="rail">
      ${touchpoints.map((tp, i) => `
        ${i > 0 ? renderLink(tp.link) : ""}
        ${renderNode(tp)}
      `).join("")}
    </div>`;
  }

  function renderStream(stream) {
    return `
      <div class="stream ${stream.loop ? "loop" : ""}">
        <div class="stream-header">
          <span class="stream-name">${stream.name}</span>
          <span class="stream-caption">${stream.caption || ""}</span>
        </div>
        ${renderRail(stream.touchpoints)}
      </div>`;
  }

  function renderBranchStep(step) {
    const sys = SYS[step.system];
    const iconCls = sys ? sys.cls : "";
    return `
      <div class="b-step">
        <span class="node-icon ${iconCls}"><i class="ti ${step.icon}"></i></span>
        <div class="b-step-text">
          ${step.text}
          <div>${badgeForSystem(step.system)}</div>
        </div>
      </div>`;
  }

  function renderBranches(branches) {
    if (!branches || !branches.length) return "";
    return `
      <div class="branch-block">
        <div class="branch-title">Risposta del contatto</div>
        ${branches.map(b => `
          <div class="branch ${b.kind}">
            <div class="branch-head">${b.label}</div>
            ${b.steps.map(renderBranchStep).join("")}
          </div>
        `).join("")}
      </div>`;
  }

  function renderColumn(p) {
    const isCurrent = !!p.current;
    let body = "";
    if (p.streams && p.streams.length) {
      body = p.streams.map(renderStream).join("");
    } else if (p.touchpoints && p.touchpoints.length) {
      body = renderRail(p.touchpoints);
    }
    return `
      <section class="col ${isCurrent ? "current" : ""}" id="phase-${p.n}" data-phase="${p.n}">
        <div class="col-header">
          ${isCurrent ? `<span class="here-dot"><span class="d"></span>Siamo qui</span>` : ""}
          <span class="col-num">${pad(p.n)}</span>
          <h2 class="col-name">${p.name}</h2>
          <div class="col-period">${p.period}</div>
          ${p.tags ? `<div class="col-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        </div>
        <div class="col-body">
          ${p.note ? `<div class="note">${p.note}</div>` : ""}
          ${p.annotation ? `<div class="annotation"><i class="ti ${p.annotation.icon}"></i>${p.annotation.text}</div>` : ""}
          ${body}
          ${renderBranches(p.branches)}
        </div>
      </section>`;
  }

  // ============================================================
  // BOOT
  // ============================================================
  const track = document.getElementById("track");
  const nav = document.getElementById("nav");

  track.insertAdjacentHTML("beforeend", phases.map(renderColumn).join(""));

  nav.innerHTML = phases.map(p => `
    <button class="pill" data-target="phase-${p.n}">
      <span class="num">${pad(p.n)}</span>${p.name}
    </button>
  `).join("");

  const scrollArea = document.getElementById("scrollArea");
  const pills = [...nav.querySelectorAll(".pill")];

  pills.forEach(pill => {
    pill.addEventListener("click", () => {
      const target = document.getElementById(pill.dataset.target);
      if (!target) return;
      const left = target.offsetLeft - 56;
      scrollArea.scrollTo({ left, behavior: "smooth" });
    });
  });

  const colEls = [...document.querySelectorAll(".col")];
  const ratios = new Map();
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => ratios.set(entry.target.id, entry.intersectionRatio));
    let bestId = null, bestR = 0;
    ratios.forEach((r, id) => { if (r > bestR) { bestR = r; bestId = id; } });
    pills.forEach(p => p.classList.toggle("active",
      bestId && p.dataset.target === bestId && bestR > 0.05));
  }, { root: scrollArea, threshold: [0, 0.25, 0.5, 0.75, 1] });
  colEls.forEach(el => observer.observe(el));

  function drawConnectors() {
    const svg = document.getElementById("connector");
    svg.setAttribute("width", track.scrollWidth);
    svg.setAttribute("height", track.scrollHeight);
    [...svg.querySelectorAll("path.link")].forEach(n => n.remove());

    for (let i = 0; i < colEls.length - 1; i++) {
      const a = colEls[i];
      const b = colEls[i + 1];
      const ax = a.offsetLeft + a.offsetWidth;
      const bx = b.offsetLeft;
      const y = a.offsetTop + 88;
      const midX = (ax + bx) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${ax + 8} ${y} C ${midX} ${y}, ${midX} ${y}, ${bx - 14} ${y}`;
      path.setAttribute("d", d);
      path.setAttribute("class", "link");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#A89060");
      path.setAttribute("stroke-width", "1");
      path.setAttribute("opacity", "0.6");
      path.setAttribute("marker-end", "url(#arrowhead)");
      svg.appendChild(path);
    }
  }

  window.addEventListener("load", drawConnectors);
  window.addEventListener("resize", drawConnectors);
  setTimeout(drawConnectors, 200);
  setTimeout(drawConnectors, 800);
  setTimeout(drawConnectors, 2000);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawConnectors);
  }

  setTimeout(() => {
    if (!pills.some(p => p.classList.contains("active"))) {
      pills[0].classList.add("active");
    }
  }, 300);
</script>
</body>
</html>
