  function renderColumn(p) {
    if (p.fork && p.fork.length) return renderForkCluster(p);
    const isCurrent = !!p.current;
    let body = "";
    if (p.streams && p.streams.length) {
      body = p.streams.map((s, idx) => renderStream(s, p, idx)).join("");
    } else if (p.touchpoints && p.touchpoints.length) {
      body = renderRail(p.touchpoints, p);
    }
    // Edit-mode: add an "+ Aggiungi stream" button at the end if the phase uses streams
    const addStreamBtn = (p.streams && p.streams.length)
      ? `<button type="button" class="add-stream-btn" data-action="add-stream" data-phase-n="${p.n}">+ Aggiungi stream</button>`
      : "";
    return `
      <section class="col ${isCurrent ? "current" : ""}" id="phase-${p.n}" data-phase="${p.n}">
        <div class="col-header">
          ${isCurrent ? `<span class="here-dot"><span class="d"></span>Siamo qui</span>` : ""}
          <span class="col-num">${pad(p.n)}</span>
          <h2 class="col-name">${p.name}</h2>
          <div class="col-period">${p.period}</div>
          ${p.leads != null ? `<div class="col-leads"><span class="num">${formatLeads(p.leads)}</span><span class="label">lead</span></div>` : ""}
          ${p.tags ? `<div class="col-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        </div>
        <div class="col-body">
          ${p.annotation ? `<div class="annotation"><i class="ti ${p.annotation.icon}"></i>${p.annotation.text}</div>` : ""}
          ${body}
          ${addStreamBtn}
          ${renderBranches(p.branches)}
        </div>
      </section>`;
  }

  // Fork cluster — N sub-columns stacked vertically at the same horizontal slot
  function renderForkCluster(p) {
    return `
      <section class="col-fork" id="phase-${p.n}" data-phase="${p.n}">
        ${p.annotation ? `<div class="annotation col-fork-annotation"><i class="ti ${p.annotation.icon}"></i>${p.annotation.text}</div>` : ""}
        <div class="col-fork-rows">
          ${p.fork.map(f => renderForkSub(p, f)).join("")}
        </div>
      </section>`;
  }

  function renderForkSub(p, f) {
    return `
      <section class="col col-fork-sub kind-${f.kind}" id="phase-${p.n}-${f.kind}" data-phase="${p.n}" data-fork="${f.kind}">
        <div class="col-header col-fork-sub-header">
          <span class="col-num">${pad(p.n)}</span>
          <h2 class="col-name">
            <span class="col-fork-eyebrow">${p.name} ·</span>
            <span class="col-fork-label">${f.label}</span>
          </h2>
          <div class="col-period">${p.period}</div>
        </div>
        <div class="col-body">
          ${(f.touchpoints && f.touchpoints.length)
            ? renderRail(f.touchpoints, p)
            : ""}
        </div>
      </section>`;
  }

  // ============================================================
  // LANES (always-on layers below the phase columns)
  // ============================================================
  function renderLauraLane() {
    const segments = phases.map(p => {
      const text = laura.segments[p.n];
      const showStorici = p.n >= laura.storiciFromPhase;
      if (!text) {
        return `<div class="lane-segment"><div class="lane-card empty">non attivo</div></div>`;
      }
      return `
        <div class="lane-segment">
          <div class="lane-card">
            <div class="lane-text">${text}</div>
            ${showStorici ? `<div class="lane-storici-tag">+ ${laura.storiciNote}</div>` : ""}
          </div>
        </div>`;
    }).join("");
    return `
      <div class="lane lane-laura">
        <div class="lane-header">
          <span class="lane-icon"><i class="ti ${laura.icon}"></i></span>
          <span class="lane-label">${laura.label}</span>
        </div>
        <div class="lane-body">${segments}</div>
      </div>`;
  }

  function renderDemLane() {
    const segments = phases.map(p => {
      const items = dems.items[p.n] || [];
      if (p.n < dems.startPhase) {
        return `<div class="lane-segment"><div class="lane-card empty">non attivo</div></div>`;
      }
      if (!items.length) {
        return `<div class="lane-segment"><div class="lane-card quiet">— nessuna DEM</div></div>`;
      }
      return `
        <div class="lane-segment">
          ${items.map(d => {
            // Register DEM in the same touchpointIndex so it can use the asset drawer
            touchpointIndex.set(d.id, { tp: { ...d, text: d.title }, phase: p });
            return `
              <div class="dem-card" data-tp-id="${d.id}" tabindex="0" role="button" aria-label="Vedi asset DEM">
                <span class="dem-card-icon"><i class="ti ${d.icon}"></i></span>
                <div class="dem-card-info">
                  <div class="dem-card-title">${d.title}</div>
                  <div class="dem-card-timing">${d.timing}</div>
                </div>
              </div>`;
          }).join("")}
        </div>`;
    }).join("");
    return `
      <div class="lane lane-dem">
        <div class="lane-header">
          <span class="lane-icon"><i class="ti ${dems.icon}"></i></span>
          <span class="lane-label">${dems.label}</span>
        </div>
        <div class="lane-body">${segments}</div>
      </div>`;
  }

  // ============================================================
  // BOOT
  // ============================================================
  function bootDashboard() {
  const track = document.getElementById("track");
  const nav = document.getElementById("nav");

  track.insertAdjacentHTML("beforeend",
    `<div class="phases-row" id="phasesRow">${phases.map(renderColumn).join("")}</div>`
    // Swim lanes ('Presidio Laura', 'DEM MailUp') wired up but hidden for now.
    // Re-enable with:
    //   + (laura && laura.segments ? renderLauraLane() : "")
    //   + renderDemLane()
  );

  // Phase pills nav removed from the markup — guard against missing element
  if (nav) {
    nav.innerHTML = phases.map(p => `
      <button class="pill" data-target="phase-${p.n}">
        <span class="num">${pad(p.n)}</span>${p.name}
      </button>
    `).join("");
  }

  const scrollArea = document.getElementById("scrollArea");
  const pills = nav ? [...nav.querySelectorAll(".pill")] : [];

  // ----- Zoom (Cmd/Ctrl+wheel, pinch trackpad, keyboard, controls) -----
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 1.8;
  let zoomLevel = 1.0;
  const zoomPctEl = document.querySelector(".zoom-pct");

  function updateZoomLabel() {
    if (zoomPctEl) zoomPctEl.textContent = Math.round(zoomLevel * 100) + "%";
  }

  function setZoom(nextZoom, anchorX) {
    const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, nextZoom));
    if (Math.abs(clamped - zoomLevel) < 0.001) return;
    if (anchorX == null) anchorX = scrollArea.clientWidth / 2;

    const ratio = clamped / zoomLevel;
    const beforeContentX = scrollArea.scrollLeft + anchorX;

    zoomLevel = clamped;
    const canvas = document.getElementById("canvas");
    if (canvas) canvas.style.zoom = clamped;

    // Keep the point under the anchor visually stable
    scrollArea.scrollLeft = beforeContentX * ratio - anchorX;

    updateZoomLabel();
    requestAnimationFrame(drawConnectors);
  }

  // Cmd/Ctrl+wheel and trackpad pinch (Mac sends ctrlKey=true on pinch) → zoom
  // All other wheel input falls through to native browser scrolling
  scrollArea.addEventListener("wheel", (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const rect = scrollArea.getBoundingClientRect();
      const cursorX = e.clientX - rect.left;
      const factor = Math.pow(0.998, e.deltaY);
      setZoom(zoomLevel * factor, cursorX);
    }
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === "0") { e.preventDefault(); setZoom(1.0); }
    else if (e.key === "=" || e.key === "+") { e.preventDefault(); setZoom(zoomLevel * 1.15); }
    else if (e.key === "-") { e.preventDefault(); setZoom(zoomLevel / 1.15); }
  });

  document.querySelectorAll(".zoom-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const dir = parseInt(btn.dataset.zoom, 10);
      if (dir === 0) setZoom(1.0);
      else if (dir > 0) setZoom(zoomLevel * 1.15);
      else setZoom(zoomLevel / 1.15);
    });
  });

  updateZoomLabel();

  // ----- Asset Panel (slide-over) -----
  const panel = document.getElementById("assetPanel");
  const backdrop = document.getElementById("assetBackdrop");
  const panelTitle = document.getElementById("assetPanelTitle");
  const panelKicker = document.getElementById("assetPanelKicker");
  const panelMeta = document.getElementById("assetPanelMeta");
  const panelBody = document.getElementById("assetPanelBody");
  const panelClose = document.getElementById("assetPanelClose");

  function renderAssetCard(asset) {
    const t = ASSET_TYPE[asset.type] || ASSET_TYPE.link;
    return `
      <a class="asset-card" href="${asset.url || "#"}" target="_blank" rel="noopener">
        <span class="asset-icon"><i class="ti ${t.icon}"></i></span>
        <span class="asset-info">
          <span class="asset-title">${asset.title}</span>
          <span class="asset-type">${t.label}</span>
        </span>
        <i class="ti ti-arrow-up-right asset-arrow"></i>
      </a>`;
  }

  function openPanel(tpId) {
    const entry = touchpointIndex.get(tpId);
    if (!entry) return;
    const { tp, phase } = entry;

    panelKicker.textContent = `Fase ${pad(phase.n)} · ${phase.name}`;
    panelTitle.textContent = tp.text;

    panelMeta.innerHTML = [
      actorPill(tp.actor),
      badgeForSystem(tp.system),
      timingPill(tp.timing),
    ].filter(Boolean).join("");

    const hasData   = tp.data   && tp.data.length;
    const hasAssets = tp.assets && tp.assets.length;
    const sections = [];
    if (hasData) {
      sections.push(`
        <div class="asset-panel-section-title">Dati</div>
        <div class="data-view-list">
          ${tp.data.map(d => `
            <div class="data-view-row">
              <span class="data-view-label">${escapeAttr(d.label || "")}</span>
              <span class="data-view-value">${escapeAttr(d.value || "")}</span>
            </div>
          `).join("")}
        </div>
      `);
    }
    if (hasAssets) {
      sections.push(`
        <div class="asset-panel-section-title" style="margin-top:18px">Link & risorse</div>
        ${tp.assets.map(renderAssetCard).join("")}
      `);
    }
    panelBody.innerHTML = sections.length
      ? sections.join("")
      : `<div class="asset-empty">Nessun dato o link associato a questo touchpoint.</div>`;

    panel.classList.add("open");
    backdrop.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
  }

  function closePanel(force) {
    if (typeof isDirty !== "undefined" && isDirty && !force) {
      if (!confirm("Hai modifiche non salvate. Chiudere comunque?")) return;
    }
    panel.classList.remove("open");
    backdrop.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
    if (typeof activeTpId !== "undefined") {
      activeTpId = null;
      draftAssets = null;
      pendingUploads = [];
      if (typeof markDirty === "function") markDirty(false);
      if (typeof setStatus === "function") setStatus("");
    }
  }

  // Click delegation on touchpoint cards AND DEM cards
  // Touchpoint click-to-open removed — data is now visible inline.
  // (DEM lane is currently hidden; if re-enabled it can be re-wired.)

  panelClose.addEventListener("click", closePanel);
  backdrop.addEventListener("click", closePanel);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePanel();
  });

  // ============================================================
  // EDIT MODE — inline asset editor (commits via Git Gateway)
  // ============================================================
  const CMS_BRANCH = "claude/create-retail-dashboard-pzdUj";
  const editToggleBtn = document.getElementById("editToggle");
  const editToggleLabel = document.getElementById("editToggleLabel");
  const editBar = document.getElementById("editBar");
  const editSaveBtn = document.getElementById("editSave");
  const editCancelBtn = document.getElementById("editCancel");
  const editStatus = document.getElementById("editStatus");

  // editMode declared at script top-level so renderNode can read it
  let activeTpId = null;         // legacy drawer state (unused now)
  let draftTp = null;            // legacy drawer state (unused now)
  let draftData = null;          // working copy of structured data entries [{label, value}]
  let draftAssets = null;        // working copy of asset URLs (no more uploads)
  let isDirty = false;

  function setStatus(msg, kind) {
    editStatus.hidden = !msg;
    editStatus.textContent = msg || "";
    editStatus.className = "edit-status" + (kind ? " " + kind : "");
  }

  function markDirty(dirty) {
    isDirty = !!dirty;
    editSaveBtn.disabled = !dirty;
  }

  function toggleEditMode(on) {
    editMode = on != null ? on : !editMode;
    document.body.classList.toggle("editing", editMode);
    editToggleLabel.textContent = editMode ? "Esci modifica" : "Modifica";
    editToggleBtn.title = editMode ? "Esci dalla modifica" : "Attiva modifica";
    // Re-render every touchpoint card + redraw outcome chips
    [...touchpointIndex.keys()].forEach(tpId => rerenderRailNode(tpId));
    if (typeof drawConnectors === "function") drawConnectors();
  }

  // Normalize outcome value into the structured shape { text, trigger }
  function normalizeOutcome(v) {
    if (!v) return { text: "", trigger: "" };
    if (typeof v === "string") return { text: v, trigger: "" };
    return { text: v.text || "", trigger: v.trigger || "" };
  }

  // Save an inter-phase outcome chip on blur (text or trigger field)
  async function saveOutcomeIfDirty(e) {
    const span = e.target;
    const phaseN = +span.dataset.phaseN;
    const field  = span.dataset.field || "text"; // "text" or "trigger"
    const original = span.dataset.original || "";
    const current = (span.textContent || "").trim();
    if (current === original) return;
    span.dataset.original = current;
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      const phase = journey.channels[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (!phase) throw new Error("Fase non trovata");
      const oc = normalizeOutcome(phase.outcome);
      oc[field] = current;
      if (!oc.text && !oc.trigger) delete phase.outcome;
      else phase.outcome = oc.trigger ? oc : oc.text;  // keep string if no trigger (legacy-friendly)
      // Actually always store as object once a trigger could be involved
      if (oc.text || oc.trigger) phase.outcome = oc;

      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent,
        `cms: outcome fase ${phaseN} ${field} → ${current.slice(0, 60) || "(rimosso)"}`);
      // Sync local CHANNELS + live phases array
      const localPhase = CHANNELS[currentChannel] && CHANNELS[currentChannel].operativo
        && CHANNELS[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (localPhase) localPhase.outcome = phase.outcome;
      if (typeof phases !== "undefined") {
        const livePhase = phases.find(p => p.n === phaseN);
        if (livePhase) livePhase.outcome = phase.outcome;
      }
    } catch (err) {
      span.textContent = original;
      span.dataset.original = original;
      alert("Errore salvataggio outcome: " + (err.message || err));
    }
  }

  // ----- Inline editing on touchpoint cards -----
  // Track per-card pending changes
  const dirtyTps = new Map(); // tpId → draft object

  function getOrInitDraft(tpId) {
    const entry = touchpointIndex.get(tpId);
    if (!entry) return null;
    let draft = dirtyTps.get(tpId);
    if (!draft) {
      draft = {
        text:   entry.tp.text   || "",
        actor:  entry.tp.actor  || "manual",
        system: entry.tp.system || "manuale",
        timing: entry.tp.timing || "",
        extra:  entry.tp.extra  || "",
        // data lives in the DOM rows directly (read at save time)
      };
      dirtyTps.set(tpId, draft);
    }
    return draft;
  }

  function markCardDirty(card, on) {
    const btn = card.querySelector(".node-save-btn");
    if (btn) btn.disabled = !on;
  }

  function cardOf(el) { return el.closest(".rail-node"); }

  // Resolve which phase / stream / fork an element belongs to (DOM ancestry)
  function findContainerInfo(el) {
    let streamName = null;
    const stream = el.closest(".stream");
    if (stream) {
      const nameEl = stream.querySelector(".stream-name");
      if (nameEl) streamName = nameEl.textContent.trim();
    }
    const phaseSection = el.closest("[data-phase]");
    const phaseN = phaseSection ? +phaseSection.dataset.phase : null;
    const forkKind = phaseSection?.dataset.fork || null;
    return { phaseN, streamName, forkKind };
  }

  function gatherCardData(card) {
    return [...card.querySelectorAll(".node-data-row.editing")].map(row => {
      const lab = row.querySelector("input[data-field='label']");
      const val = row.querySelector("input[data-field='value']");
      return { label: (lab && lab.value) || "", value: (val && val.value) || "" };
    });
  }

  // Delegated input/change handlers on the track
  function onInlineEdit(e) {
    const t = e.target;
    const card = cardOf(t);
    if (!card || !card.classList.contains("editing")) return;
    const tpId = card.dataset.tpId;
    const draft = getOrInitDraft(tpId);
    if (!draft) return;

    const field = t.dataset.field;
    if (!field) return;
    const isDataRow = !!t.closest(".node-data-row");
    if (!isDataRow) draft[field] = t.value;
    // (data row values are read straight from the DOM at save time)
    markCardDirty(card, true);
  }

  function onInlineAction(e) {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    // "+ Aggiungi touchpoint" lives at rail level, not inside any card
    if (action === "add-tp") {
      if (!editMode) return;
      onAddTouchpoint(btn);
      return;
    }
    if (action === "delete-stream") {
      if (!editMode) return;
      const streamEl = btn.closest(".stream");
      if (streamEl) deleteStream(streamEl);
      return;
    }
    if (action === "add-stream") {
      if (!editMode) return;
      addStream(btn);
      return;
    }
    const card = cardOf(btn);
    if (!card || !card.classList.contains("editing")) return;
    const tpId = card.dataset.tpId;

    if (action === "delete-data") {
      const row = btn.closest(".node-data-row");
      if (row) row.remove();
      getOrInitDraft(tpId); // ensure draft exists
      markCardDirty(card, true);
    } else if (action === "add-data") {
      const addBtn = card.querySelector(".data-row-add");
      const dataSection = card.querySelector(".node-data.editing");
      if (!dataSection || !addBtn) return;
      const row = document.createElement("div");
      row.className = "node-data-row editing";
      row.innerHTML = `
        <input type="text" data-field="label" placeholder="Etichetta">
        <input type="text" data-field="value" placeholder="Valore">
        <button type="button" class="data-row-del" data-action="delete-data" title="Elimina">×</button>`;
      dataSection.insertBefore(row, addBtn);
      getOrInitDraft(tpId);
      markCardDirty(card, true);
      const labelInput = row.querySelector("input[data-field='label']");
      if (labelInput) labelInput.focus();
    } else if (action === "save-tp") {
      saveInlineCard(tpId);
    } else if (action === "delete-tp") {
      if (!confirm("Eliminare questo touchpoint?")) return;
      deleteInlineCard(tpId);
    }
  }

  // Top-level (not inside the touchpoint card) action handler: "+ Aggiungi touchpoint"
  function onAddTouchpoint(railBtn) {
    const rail = railBtn.closest(".rail");
    if (!rail) return;
    const ctx = findContainerInfo(rail);
    const newTp = {
      text: "", system: "manuale", icon: "ti-mail",
      actor: "manual", timing: "", extra: "",
    };
    const id = "tp-new-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
    const phaseStub = { n: ctx.phaseN };
    touchpointIndex.set(id, { tp: newTp, phase: phaseStub, isNew: true, ctx });
    dirtyTps.set(id, {
      text: "", actor: "manual", system: "manuale", timing: "", extra: "",
    });
    const tmp = document.createElement("div");
    tmp.innerHTML = renderNodeEditable(newTp, phaseStub, id);
    const card = tmp.firstElementChild;
    rail.insertBefore(card, railBtn);
    markCardDirty(card, true);
    const txt = card.querySelector(".node-text-input");
    if (txt) txt.focus();
  }

  function findTargetArray(journey, ctx) {
    const op = journey.channels[currentChannel].operativo;
    const phase = (op.phases || []).find(p => p.n === ctx.phaseN);
    if (!phase) return null;
    if (ctx.forkKind && phase.fork) {
      const f = phase.fork.find(f => f.kind === ctx.forkKind);
      if (!f) return null;
      if (!f.touchpoints) f.touchpoints = [];
      return f.touchpoints;
    }
    if (ctx.streamName && phase.streams) {
      const s = phase.streams.find(s => s.name === ctx.streamName);
      if (!s) return null;
      if (!s.touchpoints) s.touchpoints = [];
      return s.touchpoints;
    }
    if (!phase.touchpoints) phase.touchpoints = [];
    return phase.touchpoints;
  }

  async function saveInlineCard(tpId) {
    const entry = touchpointIndex.get(tpId);
    const draft = dirtyTps.get(tpId);
    if (!entry || !draft) return;
    const card = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
    const status = card.querySelector(".node-save-status");
    const btn = card.querySelector(".node-save-btn");
    btn.disabled = true;
    if (status) { status.textContent = "Salvataggio…"; status.dataset.state = "saving"; }
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));

      // Pull the current data rows directly from the DOM (source of truth during edit)
      const cleanData = gatherCardData(card)
        .map(d => ({ label: d.label.trim(), value: d.value.trim() }))
        .filter(d => d.label || d.value);

      let tpRef;
      if (entry.isNew) {
        const target = findTargetArray(journey, entry.ctx);
        if (!target) throw new Error("Posizione di destinazione non trovata");
        const newTp = { text: draft.text, system: draft.system, icon: "ti-mail", actor: draft.actor };
        if (draft.timing) newTp.timing = draft.timing;
        if (draft.extra)  newTp.extra  = draft.extra;
        if (cleanData.length) newTp.data = cleanData;
        target.push(newTp);
        tpRef = newTp;
      } else {
        tpRef = findTouchpointInJourney(journey, tpId, entry);
        if (!tpRef) throw new Error("Touchpoint non trovato nel JSON");
        tpRef.text   = draft.text;
        tpRef.actor  = draft.actor;
        tpRef.system = draft.system;
        if (draft.timing) tpRef.timing = draft.timing; else delete tpRef.timing;
        if (draft.extra)  tpRef.extra  = draft.extra;  else delete tpRef.extra;
        if (cleanData.length) tpRef.data = cleanData; else delete tpRef.data;
      }

      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      const msgPrefix = entry.isNew ? "cms: add touchpoint" : "cms: update touchpoint";
      await ggPut("data/journey.json", newContent,
        `${msgPrefix} (fase ${entry.ctx ? entry.ctx.phaseN : entry.phase.n}) — ${draft.text.slice(0, 60)}`);

      // Update local + DOM
      entry.tp = tpRef;
      if (entry.isNew) {
        entry.isNew = false;
        // Promote to a normal phase reference
        const op = (CHANNELS[currentChannel] && CHANNELS[currentChannel].operativo) || {};
        const phaseObj = (op.phases || []).find(p => p.n === entry.ctx.phaseN);
        if (phaseObj) entry.phase = phaseObj;
        delete entry.ctx;
      }
      dirtyTps.delete(tpId);
      rerenderRailNode(tpId);
      const fresh = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
      const freshStatus = fresh && fresh.querySelector(".node-save-status");
      if (freshStatus) {
        freshStatus.textContent = "Salvato";
        freshStatus.dataset.state = "ok";
        setTimeout(() => { freshStatus.textContent = ""; delete freshStatus.dataset.state; }, 2500);
      }
    } catch (err) {
      if (status) { status.textContent = "Errore: " + (err.message || err); status.dataset.state = "error"; }
      btn.disabled = false;
    }
  }

  async function deleteInlineCard(tpId) {
    const entry = touchpointIndex.get(tpId);
    if (!entry) return;
    const card = document.querySelector(`.rail-node[data-tp-id="${tpId}"]`);
    // New (un-saved) tp → just drop from local state + DOM
    if (entry.isNew) {
      touchpointIndex.delete(tpId);
      dirtyTps.delete(tpId);
      if (card) card.remove();
      return;
    }
    const status = card && card.querySelector(".node-save-status");
    if (status) { status.textContent = "Eliminazione…"; status.dataset.state = "saving"; }
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      const op = journey.channels[currentChannel].operativo;
      const phase = (op.phases || []).find(p => p.n === entry.phase.n);
      if (!phase) throw new Error("Fase non trovata");
      const arrays = [];
      if (phase.touchpoints) arrays.push(phase.touchpoints);
      if (phase.streams) phase.streams.forEach(s => { if (s.touchpoints) arrays.push(s.touchpoints); });
      if (phase.fork)    phase.fork.forEach(f    => { if (f.touchpoints) arrays.push(f.touchpoints); });
      const matchText = entry.tp.text;
      let removed = false;
      for (const arr of arrays) {
        const idx = arr.findIndex(t => t.text === matchText);
        if (idx >= 0) { arr.splice(idx, 1); removed = true; break; }
      }
      if (!removed) throw new Error("Touchpoint non trovato nel JSON");

      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent,
        `cms: delete touchpoint (fase ${entry.phase.n}) — ${matchText.slice(0, 60)}`);

      touchpointIndex.delete(tpId);
      dirtyTps.delete(tpId);
      if (card) card.remove();
    } catch (err) {
      if (status) { status.textContent = "Errore: " + (err.message || err); status.dataset.state = "error"; }
    }
  }

  // Attach delegated handlers once
  track.addEventListener("input",  onInlineEdit);
  track.addEventListener("change", onInlineEdit);
  track.addEventListener("click",  onInlineAction);

  // ----- Stream title editing (click to edit, blur/Enter saves) -----
  track.addEventListener("click", (e) => {
    if (!editMode) return;
    const name = e.target.closest(".stream-name");
    if (!name || name.isContentEditable) return;
    name.contentEditable = "true";
    name.dataset.original = name.textContent.trim();
    name.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(name);
    sel.removeAllRanges();
    sel.addRange(range);
  });
  track.addEventListener("blur", (e) => {
    const name = e.target;

    name.contentEditable = "false";
    const original = (name.dataset.original || "").trim();
    const current = (name.textContent || "").trim();
    if (!current) { name.textContent = original; return; }
    if (current === original) return;
    saveStreamRename(name, current);
  }, true);
  track.addEventListener("keydown", (e) => {
    const name = e.target;
    if (!name.classList || !name.classList.contains("stream-name")) return;
    if (e.key === "Enter") { e.preventDefault(); name.blur(); }

  async function saveStreamRename(nameEl, newName) {
    const streamEl = nameEl.closest(".stream");
    const phaseN = +streamEl.dataset.phaseN;
    const streamIdx = +streamEl.dataset.streamIdx;
    nameEl.dataset.original = newName;
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      const phase = journey.channels[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (!phase || !phase.streams || !phase.streams[streamIdx]) throw new Error("Stream non trovato");
      phase.streams[streamIdx].name = newName;
      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent, `cms: rename stream (fase ${phaseN}) → ${newName}`);
      const localPhase = CHANNELS[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (localPhase && localPhase.streams[streamIdx]) localPhase.streams[streamIdx].name = newName;
      if (typeof phases !== "undefined") {
        const lp = phases.find(p => p.n === phaseN);
        if (lp && lp.streams && lp.streams[streamIdx]) lp.streams[streamIdx].name = newName;
      }
    } catch (err) {
      alert("Errore rename stream: " + (err.message || err));
      nameEl.textContent = nameEl.dataset.original;
    }
  }

  async function deleteStream(streamEl) {
    const phaseN = +streamEl.dataset.phaseN;
    const streamIdx = +streamEl.dataset.streamIdx;
    if (!confirm("Eliminare questo stream e tutti i suoi touchpoint?")) return;
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      const phase = journey.channels[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (!phase || !phase.streams) throw new Error("Fase senza stream");
      const removed = phase.streams.splice(streamIdx, 1)[0];
      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent,
        `cms: delete stream (fase ${phaseN}) — ${removed ? removed.name : ""}`);
      const localPhase = CHANNELS[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (localPhase && localPhase.streams) localPhase.streams.splice(streamIdx, 1);
      if (typeof phases !== "undefined") {
        const lp = phases.find(p => p.n === phaseN);
        if (lp && lp.streams) lp.streams.splice(streamIdx, 1);
      }
      streamEl.remove();
      // Refresh data-stream-idx on remaining streams to stay in sync
      const colBody = streamEl.parentElement || document;
      document.querySelectorAll(`.stream[data-phase-n="${phaseN}"]`).forEach((s, i) => {
        s.dataset.streamIdx = i;
      });
    } catch (err) {
      alert("Errore eliminazione stream: " + (err.message || err));
    }
  }

  async function addStream(addBtn) {
    const phaseN = +addBtn.dataset.phaseN;
    const newName = prompt("Nome del nuovo stream:");
    if (!newName || !newName.trim()) return;
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      const phase = journey.channels[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (!phase) throw new Error("Fase non trovata");
      if (!phase.streams) phase.streams = [];
      const newStream = { name: newName.trim(), touchpoints: [] };
      phase.streams.push(newStream);
      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent, `cms: add stream (fase ${phaseN}) — ${newName.trim()}`);
      // Sync local
      const localPhase = CHANNELS[currentChannel].operativo.phases.find(p => p.n === phaseN);
      if (localPhase) {
        if (!localPhase.streams) localPhase.streams = [];
        localPhase.streams.push({ ...newStream });
      }
      if (typeof phases !== "undefined") {
        const lp = phases.find(p => p.n === phaseN);
        if (lp) {
          if (!lp.streams) lp.streams = [];
          lp.streams.push({ ...newStream });
        }
      }
      // Insert a freshly rendered stream into the DOM before the add button
      const newIdx = (phase.streams.length - 1);
      const tmp = document.createElement("div");
      tmp.innerHTML = renderStream(newStream, { n: phaseN }, newIdx);
      const streamNode = tmp.firstElementChild;
      addBtn.parentElement.insertBefore(streamNode, addBtn);
    } catch (err) {
      alert("Errore aggiunta stream: " + (err.message || err));
    }
  }

  async function saveTouchpointEdits() {
    if (!activeTpId || !draftAssets) return;
    const entry = touchpointIndex.get(activeTpId);
    if (!entry) return;

    editSaveBtn.disabled = true;
    editCancelBtn.disabled = true;

    try {
      // Update journey.json
      setStatus("Salvataggio modifiche…", "saving");
      // Read fresh journey to get latest SHA
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      // Locate the touchpoint and update its fields
      const tpRef = findTouchpointInJourney(journey, activeTpId, entry);
      if (!tpRef) throw new Error("Touchpoint non trovato nel journey JSON");

      // Metadata
      tpRef.text = draftTp.text;
      tpRef.system = draftTp.system;
      tpRef.actor = draftTp.actor;
      if (draftTp.timing) tpRef.timing = draftTp.timing; else delete tpRef.timing;
      if (draftTp.extra)  tpRef.extra  = draftTp.extra;  else delete tpRef.extra;

      // Structured data
      const cleanData = draftData
        .map(d => ({ label: (d.label || "").trim(), value: (d.value || "").trim() }))
        .filter(d => d.label || d.value);
      if (cleanData.length) tpRef.data = cleanData; else delete tpRef.data;

      // Asset links (external URLs)
      const cleanAssets = draftAssets.map(a => {
        const { _pending, _tempId, ...rest } = a;
        return rest;
      });
      if (cleanAssets.length) tpRef.assets = cleanAssets; else delete tpRef.assets;

      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent, `cms: update touchpoint (fase ${entry.phase.n}) — ${draftTp.text.slice(0, 60)}`);

      // Update local data so UI reflects without a full reload
      entry.tp.text   = draftTp.text;
      entry.tp.system = draftTp.system;
      entry.tp.actor  = draftTp.actor;
      entry.tp.timing = draftTp.timing || undefined;
      entry.tp.extra  = draftTp.extra  || undefined;
      entry.tp.data   = cleanData.length ? cleanData : undefined;
      entry.tp.assets = cleanAssets.length ? cleanAssets : undefined;

      // Re-render the affected card in place + redraw connectors
      // so the dashboard reflects the change without a browser refresh
      rerenderRailNode(activeTpId);
      if (typeof drawConnectors === "function") drawConnectors();
      markDirty(false);
      setStatus("Salvato. Netlify ridepoia tra ~30s.", "success");
      setTimeout(() => setStatus(""), 4500);
    } catch (err) {
      console.error(err);
      setStatus("Errore: " + (err.message || err), "error");
    } finally {
      editSaveBtn.disabled = !isDirty;
      editCancelBtn.disabled = false;
    }
  }

  // Find the touchpoint in the journey JSON by re-resolving its position.
  // Multi-channel data: phases live under channels[currentChannel].operativo.phases
  // (falls back to legacy single-channel layout if journey.phases exists.)
  function findTouchpointInJourney(journey, tpId, entry) {
    const op = journey.channels && journey.channels[currentChannel] && journey.channels[currentChannel].operativo;
    const phases = (op && op.phases) || journey.phases || [];
    const phase = phases.find(p => p.n === entry.phase.n);
    if (!phase) return null;
    const matchText = entry.tp.text;
    if (phase.touchpoints) {
      const t = phase.touchpoints.find(x => x.text === matchText);
      if (t) return t;
    }
    if (phase.streams) {
      for (const s of phase.streams) {
        const t = (s.touchpoints || []).find(x => x.text === matchText);
        if (t) return t;
      }
    }
    return null;
  }

  const colEls = [...document.querySelectorAll("#phasesRow > .col, #phasesRow > .col-fork")];
  const ratios = new Map();
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => ratios.set(entry.target.id, entry.intersectionRatio));
    let bestId = null, bestR = 0;
    ratios.forEach((r, id) => { if (r > bestR) { bestR = r; bestId = id; } });
    pills.forEach(p => p.classList.toggle("active",
      bestId && p.dataset.target === bestId && bestR > 0.05));
  }, { root: scrollArea, threshold: [0, 0.25, 0.5, 0.75, 1] });
  colEls.forEach(el => observer.observe(el));

  function drawConnectors() {
    const svg = document.getElementById("connector");
    svg.setAttribute("width", track.scrollWidth);
    svg.setAttribute("height", track.scrollHeight);
    [...svg.querySelectorAll("path.link")].forEach(n => n.remove());
    [...track.querySelectorAll(".phase-outcome")].forEach(n => n.remove());

    // Single horizontal line for all connectors at ~½ of the shortest column,
    // so the outcome chip floats between phases at column mid-height.
    const minColH = Math.min(...colEls.map(c => c.offsetHeight));
    const baseY = Math.floor(minColH / 2);

    function drawArrowLine(x1, y1, x2, y2) {
      if (x2 - x1 < 4) return; // too short to bother
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
      path.setAttribute("class", "link");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#A89060");
      path.setAttribute("stroke-width", "1");
      path.setAttribute("opacity", "0.55");
      path.setAttribute("marker-end", "url(#arrowhead)");
      svg.appendChild(path);
    }

    // Resolve a track-relative box (handles CSS zoom by dividing by current zoom)
    const trackRect = track.getBoundingClientRect();
    const z = (typeof zoomLevel === "number" && zoomLevel) ? zoomLevel : 1;
    function trackBox(el) {
      const r = el.getBoundingClientRect();
      return {
        left:  (r.left  - trackRect.left) / z,
        right: (r.right - trackRect.left) / z,
        top:   (r.top   - trackRect.top)  / z,
        bot:   (r.bottom- trackRect.top)  / z,
        midY:  ((r.top + r.bottom) / 2 - trackRect.top) / z,
      };
    }

    for (let i = 0; i < colEls.length - 1; i++) {
      const a = colEls[i];
      const b = colEls[i + 1];
      const phase = phases[i];
      const next = phases[i + 1];

      // When phase has a fork, the connector to next phase originates from the
      // "continues" branch (kind:yes by convention), not the average of forks.
      let anchorEl = a;
      if (a.classList.contains("col-fork") && phase.fork && phase.fork.length) {
        const continuesIdx = phase.fork.findIndex(f => f.continues || f.kind === "yes");
        const subs = a.querySelectorAll(".col-fork-sub");
        if (continuesIdx >= 0 && subs[continuesIdx]) anchorEl = subs[continuesIdx];
      }

      const aBox = trackBox(anchorEl);
      const bBox = trackBox(b);
      const ax = aBox.right;
      const bx = bBox.left;
      const y = Math.round((aBox.midY + bBox.midY) / 2);
      const midX = (ax + bx) / 2;

      const oc = phase.outcome;
      const outcomeText    = oc && typeof oc === "object" ? (oc.text || "")    : (oc || "");
      const outcomeTrigger = oc && typeof oc === "object" ? (oc.trigger || "") : "";
      const hasOutcomeText = !!(outcomeText || outcomeTrigger);
      const hasLeadDelta   = (phase.leads != null && next.leads != null);
      const hasChip = hasOutcomeText || hasLeadDelta || editMode;

      let chipLeftEdge = midX, chipRightEdge = midX;

      if (hasChip) {
        const label = document.createElement("div");
        label.className = "phase-outcome" + (editMode ? " editable" : "");
        label.style.left = midX + "px";
        label.style.top = y + "px";

        const textSpan = document.createElement("span");
        textSpan.className = "outcome-text";
        textSpan.textContent = outcomeText;
        if (editMode) {
          textSpan.contentEditable = "true";
          textSpan.dataset.placeholder = "Aggiungi outcome…";
          textSpan.dataset.phaseN = phase.n;
          textSpan.dataset.field = "text";
          textSpan.dataset.original = outcomeText;
          textSpan.spellcheck = false;
          textSpan.addEventListener("blur", saveOutcomeIfDirty);
          textSpan.addEventListener("keydown", outcomeEditKeydown);
        }
        label.appendChild(textSpan);

        // Trigger / automation sub-line (shown when present, OR always in edit mode)
        if (outcomeTrigger || editMode) {
          const trig = document.createElement("span");
          trig.className = "outcome-trigger";
          trig.textContent = outcomeTrigger;
          if (editMode) {
            trig.contentEditable = "true";
            trig.dataset.placeholder = "+ trigger / automation…";
            trig.dataset.phaseN = phase.n;
            trig.dataset.field = "trigger";
            trig.dataset.original = outcomeTrigger;
            trig.spellcheck = false;
            trig.addEventListener("blur", saveOutcomeIfDirty);
            trig.addEventListener("keydown", outcomeEditKeydown);
          }
          label.appendChild(trig);
        }

        if (hasLeadDelta && phase.leads > 0) {
          const delta = next.leads - phase.leads;
          if (delta !== 0) {
            const pct = Math.round((delta / phase.leads) * 100);
            const sign = delta > 0 ? "+" : "−";
            const deltaEl = document.createElement("span");
            deltaEl.className = "outcome-delta " + (delta > 0 ? "positive" : "negative");
            deltaEl.textContent = `${sign}${formatLeads(Math.abs(delta))} lead · ${sign}${Math.abs(pct)}%`;
            label.appendChild(deltaEl);
          }
        }
        track.appendChild(label);

        const chipW = label.offsetWidth;
        chipLeftEdge  = midX - chipW / 2;
        chipRightEdge = midX + chipW / 2;
      }

      // Arrows removed — only the outcome chip stays as the inter-phase signal.
    }
  }

  function outcomeEditKeydown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
    if (e.key === "Escape") { e.target.textContent = e.target.dataset.original || ""; e.target.blur(); }
  }

  window.addEventListener("resize", drawConnectors);

  setTimeout(drawConnectors, 800);

  // ============================================================
  // MULTI-CHANNEL DATA LOADER + ROUTING
  // ============================================================

  let currentView    = "operativo";

  function parseHash() {
    const m = (location.hash || "").match(/^#\/([^/]+)(?:\/([^/]+))?/);
    return {
      channel: m && CHANNELS[m[1]] ? m[1] : "retail",
      view:    m && VIEWS.find(v => v.key === m[2]) ? m[2] : "operativo",
    };
  }

  function navigateTo(channel, view) {
    const newHash = `#/${channel}/${view}`;
    if (location.hash === newHash) return;
    location.hash = newHash;
    // Full reload — keeps bootDashboard idempotent without a big refactor.
    // Iterate to SPA-style navigation later if needed.
    location.reload();
  }

  function applyRoute() {
    const { channel, view } = parseHash();
    currentChannel = channel;
    currentView    = view;
    renderChannelSwitcher();

  function escapeCust(s) {

      .replace(/&/g, "&amp;").replace(/"/g, "&quot;")

  function getCustData() {
    const ch = CHANNELS[currentChannel];

  function renderCustomerNodes() {
    const canvas = document.getElementById("custCanvas");
    if (!canvas) return;
    // Wipe existing nodes (keep SVG)
    [...canvas.querySelectorAll(".cust-node")].forEach(n => n.remove());
    const data = getCustData();
    if (!data || !Array.isArray(data.nodes)) return;
    data.nodes.forEach(node => canvas.appendChild(buildCustomerNode(node)));

  function buildCustomerNode(node) {
    const el = document.createElement("div");
    const typeCls = "type-" + (node.type || "touchpoint");
    const outcomeCls = node.type === "end" && node.outcome ? "outcome-" + node.outcome : "";
    el.className = `cust-node ${typeCls} ${outcomeCls}`.trim();
    el.dataset.id = node.id;
    el.style.left = (node.x || 200) + "px";
    el.style.top  = (node.y || 200) + "px";

    const typeMeta = CUST_TYPES.find(t => t.key === node.type) || CUST_TYPES[1];
    const kicker = node.type === "end" && node.outcome
      ? (CUST_END_OUTCOMES.find(o => o.key === node.outcome) || {}).label || typeMeta.kicker
      : typeMeta.kicker;

    let refHtml = "";
    if (node.ops_phase || node.ops_text) {
      refHtml = `<span class="cust-node-ref" title="Collegamento all'operativo">
        <i class="ti ti-link"></i>${node.ops_phase ? "Fase " + escapeCust(node.ops_phase) : ""}${node.ops_phase && node.ops_text ? " · " : ""}${escapeCust(node.ops_text || "")}
      </span>`;
    }

    el.innerHTML = `
      <span class="cust-node-kicker">${escapeCust(kicker)}</span>
      <span class="cust-node-label" data-original="${escapeCust(node.label || "")}">${escapeCust(node.label || "")}</span>
      ${refHtml}
      <div class="cust-node-actions">
        <button type="button" data-cust-action="link" title="Collega a una fase operativa"><i class="ti ti-link"></i></button>
        <button type="button" data-cust-action="connect" title="Connetti ad altro nodo"><i class="ti ti-arrow-right"></i></button>
        <button type="button" class="danger" data-cust-action="delete" title="Elimina nodo"><i class="ti ti-trash"></i></button>
      </div>
      <span class="cust-node-type-pill">
        <select data-cust-field="type">
          ${CUST_TYPES.map(t => `<option value="${t.key}" ${t.key === (node.type || "touchpoint") ? "selected" : ""}>${t.label}</option>`).join("")}
        </select>
        ${node.type === "end" ? `
          <select data-cust-field="outcome" style="margin-left:6px">
            ${CUST_END_OUTCOMES.map(o => `<option value="${o.key}" ${o.key === (node.outcome || "yes") ? "selected" : ""}>${o.label}</option>`).join("")}
          </select>` : ""}
      </span>
    `;
    return el;
  }

  function renderCustomerEdges() {
    const svg = document.getElementById("custEdges");
    if (!svg) return;
    [...svg.querySelectorAll("path.cust-edge, text.edge-label")].forEach(n => n.remove());
    const data = getCustData();
    if (!data) return;
    const nodeById = new Map((data.nodes || []).map(n => [n.id, n]));
    (data.edges || []).forEach(edge => {
      const a = nodeById.get(edge.from);
      const b = nodeById.get(edge.to);
      if (!a || !b) return;
      const d = buildEdgePath(a, b);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "cust-edge");
      path.setAttribute("marker-end", "url(#custArrow)");
      path.dataset.id = edge.id;
      svg.appendChild(path);
      if (edge.label) {
        const mid = midpoint(a, b);
        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("class", "edge-label");
        txt.setAttribute("x", mid.x);
        txt.setAttribute("y", mid.y - 6);
        txt.setAttribute("text-anchor", "middle");
        txt.textContent = edge.label;
        svg.appendChild(txt);
      }
    });
  }

  function buildEdgePath(a, b) {
    // Curved cubic bezier from a to b. Pull control points along the dominant axis.
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const horiz = Math.abs(dx) >= Math.abs(dy);
    const k = Math.min(220, Math.max(60, dist * 0.45));
    const c1x = horiz ? a.x + Math.sign(dx) * k : a.x;
    const c1y = horiz ? a.y : a.y + Math.sign(dy) * k;
    const c2x = horiz ? b.x - Math.sign(dx) * k : b.x;
    const c2y = horiz ? b.y : b.y - Math.sign(dy) * k;
    // Slightly retract end point so arrowhead doesn't pierce node
    const retract = 14;
    const angle = Math.atan2(b.y - c2y, b.x - c2x);
    const ex = b.x - Math.cos(angle) * retract;
    const ey = b.y - Math.sin(angle) * retract;
    return `M ${a.x} ${a.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${ex} ${ey}`;
  }

  function midpoint(a, b) {
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  // ---- Editing interactions -----------------------------------
  function bindCustomerHandlers() {
    const canvas = document.getElementById("custCanvas");
    const toolbar = document.getElementById("custToolbar");
    if (!canvas) return;

    // Toolbar add-node buttons
    toolbar.querySelectorAll("button[data-add]").forEach(btn => {
      btn.addEventListener("click", () => addCustomerNode(btn.dataset.add));
    });

    // Delegated handlers on the canvas
    canvas.addEventListener("click", onCustomerCanvasClick);
    canvas.addEventListener("dblclick", onCustomerCanvasDblClick);
    canvas.addEventListener("contextmenu", onCustomerCanvasContextMenu);
    canvas.addEventListener("mousedown", onCustomerCanvasMouseDown);
    canvas.addEventListener("change", onCustomerCanvasChange);
    canvas.addEventListener("focusout", onCustomerCanvasFocusOut, true);

    // Bind document-level handlers once (drag end, connect-mode cancel)
    if (!custIsBoundToDocument) {
      custIsBoundToDocument = true;
      document.addEventListener("mouseup", onCustomerDocMouseUp);
      document.addEventListener("mousemove", onCustomerCanvasMouseMove);
      document.addEventListener("keydown", onCustomerDocKeyDown);
    }

    // Wire the header Edit toggle — bootDashboard isn't called on this view,
    // so we attach our own handler that owns the editMode state for the customer canvas.
    const editToggleBtn   = document.getElementById("editToggle");
    const editToggleLabel = document.getElementById("editToggleLabel");
    if (editToggleBtn && !editToggleBtn.dataset.custBound) {
      editToggleBtn.dataset.custBound = "1";
      editToggleBtn.addEventListener("click", () => {
        editMode = !editMode;
        document.body.classList.toggle("editing", editMode);
        editToggleLabel.textContent = editMode ? "Esci modifica" : "Modifica";
        editToggleBtn.title = editMode ? "Esci dalla modifica" : "Attiva modifica";
        switchCustomerEditMode(editMode);
      });
    }
  }

  function bindCustomerIntroEditing() {
    const title = document.getElementById("custIntroTitle");
    const text  = document.getElementById("custIntroText");
    [title, text].forEach(el => {
      if (!el) return;
      el.addEventListener("focus", () => { el.dataset.original = el.textContent; });
      el.addEventListener("blur", () => {
        const cur = (el.textContent || "").trim();
        if (cur === (el.dataset.original || "").trim()) return;
        const data = getCustData();
        if (!data) return;
        if (el.id === "custIntroTitle") data.intro_title = cur;
        else data.intro = cur;
        scheduleCustomerSave(`cms: customer ${currentChannel} · intro aggiornata`);
      });
    });
    // Toggle contenteditable depending on edit mode (handled in switchCustomerEditMode)
    switchCustomerEditMode(editMode);
  }

  function switchCustomerEditMode(on) {
    const canvas = document.getElementById("custCanvas");
    if (!canvas) return;
    canvas.querySelectorAll(".cust-node-label").forEach(lbl => {
      lbl.setAttribute("contenteditable", on ? "true" : "false");
    });
    const title = document.getElementById("custIntroTitle");
    const text  = document.getElementById("custIntroText");
    if (title) title.setAttribute("contenteditable", on ? "true" : "false");
    if (text)  text.setAttribute("contenteditable",  on ? "true" : "false");
    if (!on) {
      document.body.classList.remove("cust-connect-mode");
      custConnectSourceId = null;
      [...canvas.querySelectorAll(".connect-source")].forEach(n => n.classList.remove("connect-source"));
      const prev = document.getElementById("custEdgePreview");
      if (prev) prev.remove();
    }
  }

  function onCustomerCanvasClick(e) {
    if (!editMode) return;
    const actionBtn = e.target.closest("[data-cust-action]");
    const node = e.target.closest(".cust-node");
    if (actionBtn && node) {
      const id = node.dataset.id;
      if (actionBtn.dataset.custAction === "delete") {
        deleteCustomerNode(id);
      } else if (actionBtn.dataset.custAction === "connect") {
        startCustomerConnect(id);
      } else if (actionBtn.dataset.custAction === "link") {
        editCustomerNodeOpsLink(id);
      }
      e.stopPropagation();
      return;
    }
    // If we're in connect mode, clicking another node completes the edge
    if (custConnectSourceId && node && node.dataset.id !== custConnectSourceId) {
      completeCustomerConnect(node.dataset.id);
      return;
    }
    // Click on edge → prompt for label (empty = clear label, but keep edge)
    const edgePath = e.target.closest("path.cust-edge");
    if (edgePath) {
      editCustomerEdgeLabel(edgePath.dataset.id);
      return;
    }
    // Click on empty canvas → cancel connect
    if (custConnectSourceId && !node) cancelCustomerConnect();
  }

  function onCustomerCanvasContextMenu(e) {
    if (!editMode) return;
    const edgePath = e.target.closest("path.cust-edge");
    if (!edgePath) return;
    e.preventDefault();
    deleteCustomerEdge(edgePath.dataset.id);
  }

  function editCustomerEdgeLabel(edgeId) {
    const data = getCustData();
    if (!data) return;
    const edge = (data.edges || []).find(ed => ed.id === edgeId);
    if (!edge) return;
    const cur = prompt("Etichetta della freccia (lascia vuoto per togliere il testo · click-destro sulla freccia per eliminarla):", edge.label || "");
    if (cur === null) return;
    edge.label = cur.trim();
    renderCustomerEdges();
    scheduleCustomerSave(`cms: customer ${currentChannel} · etichetta freccia`);
  }

  function onCustomerCanvasDblClick(e) {
    // Reserved for future use; single-click handles edge labels now.
  }

  function onCustomerCanvasMouseDown(e) {
    if (!editMode) return;
    const node = e.target.closest(".cust-node");
    if (!node) return;
    // Don't start drag on interactive children
    if (e.target.closest("button, select, [contenteditable=\"true\"]")) return;
    const data = getCustData();
    if (!data) return;
    const id = node.dataset.id;
    const nodeData = (data.nodes || []).find(n => n.id === id);
    if (!nodeData) return;
    const z = (typeof zoomLevel === "number" && zoomLevel) ? zoomLevel : 1;
    const canvas = document.getElementById("custCanvas");
    const rect = canvas.getBoundingClientRect();
    const mouseCanvasX = (e.clientX - rect.left) / z;
    const mouseCanvasY = (e.clientY - rect.top)  / z;
    custDragState = {
      id,
      offsetX: mouseCanvasX - (nodeData.x || 0),
      offsetY: mouseCanvasY - (nodeData.y || 0),
      moved: false,
    };
    node.classList.add("dragging");
    e.preventDefault();
  }

  function onCustomerCanvasMouseMove(e) {
    if (!editMode) return;
    if (!custDragState && !custConnectSourceId) return;
    const canvas = document.getElementById("custCanvas");
    if (!canvas) return;
    const z = (typeof zoomLevel === "number" && zoomLevel) ? zoomLevel : 1;
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) / z;
    const cy = (e.clientY - rect.top)  / z;

    if (custDragState) {
      const data = getCustData();
      const node = (data.nodes || []).find(n => n.id === custDragState.id);
      if (!node) return;
      node.x = clamp(cx - custDragState.offsetX, 80, 1800 - 40);
      node.y = clamp(cy - custDragState.offsetY, 60, 1100 - 40);
      custDragState.moved = true;
      const el = canvas.querySelector(`.cust-node[data-id="${cssEsc(node.id)}"]`);
      if (el) {
        el.style.left = node.x + "px";
        el.style.top  = node.y + "px";
      }
      renderCustomerEdges();
    } else if (custConnectSourceId) {
      const data = getCustData();
      const src = (data.nodes || []).find(n => n.id === custConnectSourceId);
      if (!src) return;
      const svg = document.getElementById("custEdges");
      if (!svg) return;
      let prev = document.getElementById("custEdgePreview");
      if (!prev) {
        prev = document.createElementNS("http://www.w3.org/2000/svg", "path");
        prev.setAttribute("id", "custEdgePreview");
        prev.setAttribute("class", "cust-edge-preview");
        svg.appendChild(prev);
      }
      prev.setAttribute("d", buildEdgePath(src, { x: cx, y: cy }));
    }
  }

  function onCustomerDocMouseUp() {
    if (!custDragState) return;
    const canvas = document.getElementById("custCanvas");
    if (canvas) {
      const node = canvas.querySelector(`.cust-node[data-id="${cssEsc(custDragState.id)}"]`);
      if (node) node.classList.remove("dragging");
    }
    if (custDragState.moved) {
      scheduleCustomerSave(`cms: customer ${currentChannel} · riposiziona nodo`);
    }
    custDragState = null;
  }

  function onCustomerDocKeyDown(e) {
    if (e.key === "Escape" && custConnectSourceId) {
      cancelCustomerConnect();
    }
  }

  function onCustomerCanvasChange(e) {
    if (!editMode) return;
    const node = e.target.closest(".cust-node");
    if (!node) return;
    const data = getCustData();
    if (!data) return;
    const nodeData = (data.nodes || []).find(n => n.id === node.dataset.id);
    if (!nodeData) return;
    if (e.target.matches("[data-cust-field=\"type\"]")) {
      nodeData.type = e.target.value;
      if (nodeData.type === "end" && !nodeData.outcome) nodeData.outcome = "yes";
      if (nodeData.type !== "end") delete nodeData.outcome;
      renderCustomerNodes();
      renderCustomerEdges();
      switchCustomerEditMode(editMode);
      scheduleCustomerSave(`cms: customer ${currentChannel} · cambia tipo nodo`);
    } else if (e.target.matches("[data-cust-field=\"outcome\"]")) {
      nodeData.outcome = e.target.value;
      renderCustomerNodes();
      renderCustomerEdges();
      switchCustomerEditMode(editMode);
      scheduleCustomerSave(`cms: customer ${currentChannel} · cambia esito`);
    }
  }

  function onCustomerCanvasFocusOut(e) {
    if (!editMode) return;
    const lbl = e.target.closest(".cust-node-label");
    if (!lbl) return;
    const node = lbl.closest(".cust-node");
    if (!node) return;
    const original = lbl.dataset.original || "";
    const cur = (lbl.textContent || "").trim();
    if (cur === original.trim()) return;
    const data = getCustData();
    if (!data) return;
    const nodeData = (data.nodes || []).find(n => n.id === node.dataset.id);
    if (!nodeData) return;
    nodeData.label = cur;
    lbl.dataset.original = cur;
    scheduleCustomerSave(`cms: customer ${currentChannel} · rinomina nodo`);
  }

  function startCustomerConnect(id) {
    if (custConnectSourceId === id) { cancelCustomerConnect(); return; }
    cancelCustomerConnect();
    custConnectSourceId = id;
    document.body.classList.add("cust-connect-mode");
    const canvas = document.getElementById("custCanvas");
    const src = canvas.querySelector(`.cust-node[data-id="${cssEsc(id)}"]`);
    if (src) src.classList.add("connect-source");
  }

  function cancelCustomerConnect() {
    custConnectSourceId = null;
    document.body.classList.remove("cust-connect-mode");
    const canvas = document.getElementById("custCanvas");
    if (canvas) [...canvas.querySelectorAll(".connect-source")].forEach(n => n.classList.remove("connect-source"));
    const prev = document.getElementById("custEdgePreview");
    if (prev) prev.remove();
  }

  function completeCustomerConnect(targetId) {
    const data = getCustData();
    if (!data) return;
    data.edges = data.edges || [];
    // Avoid duplicate edge
    const exists = data.edges.some(e => e.from === custConnectSourceId && e.to === targetId);
    if (!exists) {
      data.edges.push({ id: nextCustId("e", data.edges), from: custConnectSourceId, to: targetId, label: "" });
      renderCustomerEdges();
      scheduleCustomerSave(`cms: customer ${currentChannel} · nuova connessione`);
    }
    cancelCustomerConnect();
  }

  function addCustomerNode(type) {
    const data = getCustData();
    if (!data) return;
    data.nodes = data.nodes || [];
    const id = nextCustId("n", data.nodes);
    const node = {
      id,
      type,
      label: type === "entry" ? "Nuovo entry point"
           : type === "decision" ? "Nuova decisione"
           : type === "end" ? "Nuovo esito"
           : "Nuovo touchpoint",
      x: 220 + (data.nodes.length % 6) * 90,
      y: 180 + Math.floor(data.nodes.length / 6) * 90,
    };
    if (type === "end") node.outcome = "yes";
    data.nodes.push(node);
    renderCustomerNodes();
    switchCustomerEditMode(editMode);
    scheduleCustomerSave(`cms: customer ${currentChannel} · nuovo nodo`);
  }

  function editCustomerNodeOpsLink(id) {
    const data = getCustData();
    if (!data) return;
    const node = (data.nodes || []).find(n => n.id === id);
    if (!node) return;

    // Build a list of available operativo phases for this channel
    const ch = CHANNELS[currentChannel];
    const phases = (ch && ch.operativo && ch.operativo.phases) || [];
    const phaseList = phases.map(p => `${p.n} = ${p.name}`).join("\n");

    const phaseAns = prompt(
      `Collega a quale fase operativa?\n\n${phaseList}\n\nScrivi il numero (1-${phases.length}) — vuoto per rimuovere.`,
      node.ops_phase || ""
    );
    if (phaseAns === null) return;
    const phaseTrim = phaseAns.trim();
    if (!phaseTrim) {
      delete node.ops_phase;
      delete node.ops_text;
    } else {
      const phaseN = parseInt(phaseTrim, 10);
      if (!phaseN || !phases.find(p => p.n === phaseN)) {
        alert("Fase non valida.");
        return;
      }
      const phase = phases.find(p => p.n === phaseN);
      const textAns = prompt(
        `Etichetta del collegamento (es. "${phase.name}", "Verifica lead", ecc.):`,
        node.ops_text || phase.name
      );
      if (textAns === null) return;
      node.ops_phase = phaseN;
      node.ops_text = textAns.trim();
    }
    renderCustomerNodes();
    switchCustomerEditMode(editMode);
    scheduleCustomerSave(`cms: customer ${currentChannel} · collegamento operativo`);
  }

  function deleteCustomerNode(id) {
    const data = getCustData();
    if (!data) return;
    const node = (data.nodes || []).find(n => n.id === id);
    if (!node) return;
    if (!confirm(`Elimina nodo "${node.label || id}"?`)) return;
    data.nodes = (data.nodes || []).filter(n => n.id !== id);
    data.edges = (data.edges || []).filter(e => e.from !== id && e.to !== id);
    renderCustomerNodes();
    renderCustomerEdges();
    scheduleCustomerSave(`cms: customer ${currentChannel} · elimina nodo`);
  }

  function deleteCustomerEdge(id) {
    const data = getCustData();
    if (!data) return;
    const edge = (data.edges || []).find(e => e.id === id);
    if (!edge) return;
    if (!confirm("Elimina questa connessione?")) return;
    data.edges = data.edges.filter(e => e.id !== id);
    renderCustomerEdges();
    scheduleCustomerSave(`cms: customer ${currentChannel} · elimina freccia`);
  }

  function nextCustId(prefix, arr) {
    let i = 1;
    const used = new Set((arr || []).map(x => x.id));
    while (used.has(prefix + i)) i++;
    return prefix + i;
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function cssEsc(s) {
    return String(s).replace(/(["\\\\])/g, "\\$1");
  }

  // Debounced commit to data/journey.json — collapse rapid edits into one PR
  function scheduleCustomerSave(message) {
    if (custSaveTimer) clearTimeout(custSaveTimer);
    custSaveTimer = setTimeout(() => saveCustomerToGitHub(message), 1200);
  }

  async function saveCustomerToGitHub(message) {
    const localCh = CHANNELS[currentChannel];
    if (!localCh) return;
    try {
      const cur = await ggGet("data/journey.json");
      const journey = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
      journey.channels = journey.channels || {};
      journey.channels[currentChannel] = journey.channels[currentChannel] || {};
      journey.channels[currentChannel].customer = localCh.customer;
      const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(journey, null, 2))));
      await ggPut("data/journey.json", newContent, message || `cms: customer ${currentChannel}`);
    } catch (err) {
      console.error("Customer save failed:", err);
      alert("Errore salvataggio customer view: " + (err.message || err));
    }
  }

  function showCurrentView() {
    updateBrandSubtitle();
    const ch = CHANNELS[currentChannel];
    const viewData = ch && ch[currentView];

    const emptyEl    = document.getElementById("emptyState");
    const scrollArea = document.getElementById("scrollArea");
    const track      = document.getElementById("track");

    if (!viewData) {
      // Empty state
      clearTrack();
      track.style.display = "none";
      emptyEl.hidden = false;
      const isActive = ch && ch.active;
      const view = VIEWS.find(v => v.key === currentView);
      document.getElementById("emptyIcon").className =
        "ti " + (isActive ? "ti-tool" : (ch && ch.icon) || "ti-circle");
      document.getElementById("emptyTitle").textContent = isActive
        ? `Vista "${view ? view.label : currentView}" da costruire`
        : `${ch ? ch.label : "Canale"} · da configurare`;
      document.getElementById("emptyText").textContent = isActive
        ? "Questa vista non è ancora stata sviluppata per questo canale."
        : `Il canale ${ch ? ch.label : ""} sarà attivato quando avremo i contenuti.`;
      return;
    }

    // Has data → render
    emptyEl.hidden = true;
    track.style.display = "";

    if (currentView === "operativo") {
      // Reuse the existing dashboard pipeline
      phases = viewData.phases || [];
      laura  = viewData.laura  || {};
      dems   = viewData.dems   || {};
      bootDashboard();
    } else if (currentView === "customer") {
      renderCustomerView(viewData);
    } else {
      // Timeline — placeholder until commit 3
      clearTrack();
      emptyEl.hidden = false;
      const view = VIEWS.find(v => v.key === currentView);
      document.getElementById("emptyIcon").className = "ti ti-tool";
      document.getElementById("emptyTitle").textContent = `Vista "${view.label}" in arrivo`;
      document.getElementById("emptyText").textContent = "La sto costruendo. Per ora resta solo l'Operativo.";
    }
  }

  // ============================================================
  // LOAD JOURNEY DATA (data/journey.json), THEN BOOT
  // ============================================================
  fetch("data/journey.json", { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(data => {
      CHANNELS = data.channels || {};
      window.addEventListener("hashchange", applyRoute);
      applyRoute();
    })
    .catch(err => {
      console.error("Failed to load data/journey.json:", err);
      document.body.innerHTML = `<div style="padding:60px;font-family:sans-serif;color:#7A3920;max-width:520px;margin:0 auto">
        <h2 style="font-family:Georgia,serif">Dati non caricati</h2>
        <p>Impossibile leggere <code>data/journey.json</code>. Serve un server HTTP — apri la dashboard via Netlify o avvia in locale con <code>python3 -m http.server</code>.</p>
        <p style="font-size:12px;color:#666">${err.message}</p>
      </div>`;
    });
</script>
</body>
</html>
