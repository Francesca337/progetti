# Decap CMS — Pasticceria Giotto · Journey
# Note: l'editing dettagliato di fasi / touchpoint / asset avviene
# direttamente nella dashboard (modalità Modifica nel drawer).
# Qui esponiamo solo i metadata canale (label, persona, icona, attivo/no).
backend:
  name: git-gateway
  branch: claude/create-retail-dashboard-pzdUj
  commit_messages:
    create: "cms: create {{collection}} '{{slug}}'"
    update: "cms: update {{collection}} '{{slug}}'"
    delete: "cms: delete {{collection}} '{{slug}}'"
    uploadMedia: "cms: upload '{{path}}'"
    deleteMedia: "cms: delete asset '{{path}}'"

media_folder: "assets"
public_folder: "assets"

publish_mode: simple
locale: "it"

collections:
  - name: journey
    label: "Journey · Pasticceria Giotto"
    label_singular: "Canale"
    files:
      - file: "data/journey.json"
        label: "Canali (metadata)"
        name: "channels-meta"
        format: "json"
        fields:
          - name: channels
            label: "Canali"
            widget: object
            fields:
              - name: retail
                label: "Retail"
                widget: object
                fields:
                  - name: label
                    label: "Etichetta"
                    widget: string
                  - name: persona
                    label: "Persona"
                    widget: string
                  - name: icon
                    label: "Icona Tabler"
                    widget: string
                  - name: campaign
                    label: "Campagna corrente"
                    widget: string
                  - name: active
                    label: "Canale attivo"
                    widget: boolean
                    default: true

              - name: b2b
                label: "B2B"
                widget: object
                fields:
                  - name: label
                    label: "Etichetta"
                    widget: string
                  - name: persona
                    label: "Persona"
                    widget: string
                  - name: icon
                    label: "Icona Tabler"
                    widget: string
                  - name: campaign
                    label: "Campagna corrente"
                    widget: string
                  - name: active
                    label: "Canale attivo"
                    widget: boolean
                    default: false

              - name: ecommerce
                label: "E-commerce"
                widget: object
                fields:
                  - name: label
                    label: "Etichetta"
                    widget: string
                  - name: persona
                    label: "Persona"
                    widget: string
                  - name: icon
                    label: "Icona Tabler"
                    widget: string
                  - name: campaign
                    label: "Campagna corrente"
                    widget: string
                  - name: active
                    label: "Canale attivo"
                    widget: boolean
                    default: false

              - name: store
                label: "Store"
                widget: object
                fields:
                  - name: label
                    label: "Etichetta"
                    widget: string
                  - name: persona
                    label: "Persona"
                    widget: string
                  - name: icon
                    label: "Icona Tabler"
                    widget: string
                  - name: campaign
                    label: "Campagna corrente"
                    widget: string
                  - name: active
                    label: "Canale attivo"
                    widget: boolean
                    default: false
