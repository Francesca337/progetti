# Netlify configuration — Pasticceria Giotto · Journey Retail
# Static HTML site. The Functions slot is reserved for the future
# Zoho API proxy (so the dashboard can pull live numbers / pipeline
# data without exposing credentials in the client).

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Long-cache fonts (immutable: filenames don't change)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always-fresh HTML (every push deploys a new version)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
